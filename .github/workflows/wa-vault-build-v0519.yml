name: WA Vault v0.5.19 Final Hardening

on:
  push:
    branches: [wa-vault-build-v0519]
    paths:
      - 'wa-vault-build-v0519/**'
      - '.github/workflows/wa-vault-build-v0519.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.18 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0519-project
          gh run download 31921828055 -n WA-Vault-v0.5.18-source -D wa-vault-v0519-project
          grep -q 'versionCode = 68' wa-vault-v0519-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.18"' wa-vault-v0519-project/app/build.gradle.kts

      - name: Apply v0.5.19 transformation and regressions
        run: |
          set -euo pipefail
          cp wa-vault-build-v0519/apply_v0519.py wa-vault-v0519-project/apply_v0519.py
          cd wa-vault-v0519-project
          python3 apply_v0519.py
          python3 tools/v0519_regression_test.py
          grep -q 'versionCode = 69' app/build.gradle.kts
          grep -q 'versionName = "0.5.19"' app/build.gradle.kts
          test ! -e verify_source.py
          test ! -e app/src/main/java/com/fer/wavault/PortableBackupManager.java
          ! grep -n -E '\.plainbak|\.encbak|File backup=' app/src/main/java/com/fer/wavault/MediaCrypto.java
          ! grep -R -n -E 'PORTABLE_BACKUP_CREATE_REQ|PORTABLE_BACKUP_RESTORE_REQ|pendingPortableBackupPassword|showCreatePortableBackupDialog|choosePortableBackupToRestore|runPortableBackup|runPortableRestore|listMediaForPortableBackup|\.wavb' app/src/main/java
          rm -f apply_v0519.py

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0519-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore stable signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks

      - name: Sign and verify v0.5.19
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0519-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0519-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0519-output/WA-Vault-v0.5.19.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0519-output/WA-Vault-v0.5.19.apk > wa-vault-v0519-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0519-output/WA-Vault-v0.5.19.apk > wa-vault-v0519-output/APK_SHA256.txt
          cp wa-vault-v0519-project/V0519_NOTES.md wa-vault-v0519-output/
          cp wa-vault-v0519-project/TEST_MATRIX.md wa-vault-v0519-output/
          cp wa-vault-v0519-project/tools/v0519_regression_test.py wa-vault-v0519-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.19-release
          path: |
            wa-vault-v0519-output/WA-Vault-v0.5.19.apk
            wa-vault-v0519-output/APK_SHA256.txt
            wa-vault-v0519-output/APK_SIGNATURE.txt
            wa-vault-v0519-output/V0519_NOTES.md
            wa-vault-v0519-output/TEST_MATRIX.md
            wa-vault-v0519-output/v0519_regression_test.py
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.19-source
          path: wa-vault-v0519-project
          retention-days: 30
