name: ProductShot Local AI Android

on:
  push:
    branches: [productshot-local-ai]
    paths:
      - "productshot-local/**"
      - ".github/workflows/productshot-local-ai.yml"
  pull_request:
    branches: [main]
    paths:
      - "productshot-local/**"
      - ".github/workflows/productshot-local-ai.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build + lint local AI APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.5.0"
          cache-disabled: true

      - name: Ensure Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"

      - name: Lint, R8 and build
        shell: bash
        run: |
          set -euo pipefail
          gradle -p productshot-local :app:clean :app:lintRelease :app:assembleRelease :app:assembleDebug --stacktrace --no-daemon
          DEBUG_APK="productshot-local/app/build/outputs/apk/debug/app-debug.apk"
          RELEASE_APK="productshot-local/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$DEBUG_APK"
          test -s "$RELEASE_APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$DEBUG_APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$DEBUG_APK" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.productshot.local'" "$RUNNER_TEMP/badging.txt"
          grep -q "minSdkVersion:'29'" "$RUNNER_TEMP/badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          mkdir -p "$RUNNER_TEMP/productshot-local-build"
          cp "$DEBUG_APK" "$RUNNER_TEMP/productshot-local-build/ProductShot-Local-alpha-debug.apk"
          cp "$RELEASE_APK" "$RUNNER_TEMP/productshot-local-build/ProductShot-Local-alpha-release-unsigned.apk"
          cp "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/productshot-local-build/"
          cp productshot-local/app/build/reports/lint-results-release.txt "$RUNNER_TEMP/productshot-local-build/" || true
          sha256sum "$RUNNER_TEMP/productshot-local-build/"*.apk | tee "$RUNNER_TEMP/productshot-local-build/SHA256SUMS.txt"

      - name: Upload local AI APKs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: productshot-local-ai-apks
          path: ${{ runner.temp }}/productshot-local-build/*
          if-no-files-found: error
          retention-days: 7

  runtime:
    name: Runtime API ${{ matrix.api }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 35, 36]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Download APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: productshot-local-ai-apks
          path: ${{ runner.temp }}/productshot-local-apks

      - name: Provision emulator
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$AVD_HOME"
          export ANDROID_AVD_HOME="$AVD_HOME"
          echo "ANDROID_AVD_HOME=$AVD_HOME" >> "$GITHUB_ENV"
          "$SDKMANAGER" --install "platform-tools" "emulator"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          LIST="$RUNNER_TEMP/sdk-list.txt"
          "$SDKMANAGER" --list > "$LIST"
          IMAGE=""
          for candidate in \
            "system-images;android-${API_LEVEL};google_apis;x86_64" \
            "system-images;android-${API_LEVEL};default;x86_64"; do
            if grep -Fq "$candidate" "$LIST"; then IMAGE="$candidate"; break; fi
          done
          test -n "$IMAGE"
          "$SDKMANAGER" --install "$IMAGE"
          AVD="productshot-local-api${API_LEVEL}"
          echo "LOCAL_AVD=$AVD" >> "$GITHUB_ENV"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" >/dev/null

      - name: Boot, install and lifecycle smoke
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          APK="$RUNNER_TEMP/productshot-local-apks/ProductShot-Local-alpha-debug.apk"
          EVIDENCE="$RUNNER_TEMP/productshot-local-evidence-${API_LEVEL}"
          mkdir -p "$EVIDENCE"
          ACCEL="-accel off"
          if [[ -e /dev/kvm ]]; then sudo chmod 666 /dev/kvm; ACCEL="-accel on"; fi
          "$SDK_ROOT/emulator/emulator" "@$LOCAL_AVD" -no-window -noaudio -no-boot-anim -no-snapshot -no-metrics -gpu swiftshader_indirect -camera-back none -camera-front none -memory 2048 $ACCEL > "$EVIDENCE/emulator.log" 2>&1 &
          PID=$!
          sleep 8
          kill -0 "$PID"
          adb start-server
          timeout 180 adb wait-for-device
          timeout 300 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82 || true
          adb shell cmd window dismiss-keyguard || true
          adb install --no-streaming -r "$APK" | tee "$EVIDENCE/install.txt"
          adb logcat -c
          launch() {
            adb shell am start -W -n com.productshot.local/.MainActivity | tr -d '\r' | tee "$EVIDENCE/launch-$1.txt"
            grep -q 'Status: ok' "$EVIDENCE/launch-$1.txt"
            sleep 2
            adb shell dumpsys activity activities | grep -E 'mResumedActivity|topResumedActivity' | grep -Fq 'com.productshot.local'
          }
          launch initial
          adb exec-out screencap -p > "$EVIDENCE/initial.png" || true
          adb shell input keyevent 3
          launch resume
          adb shell am force-stop com.productshot.local
          launch force-stop
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop com.productshot.local
          launch offline
          adb shell svc wifi enable || true
          adb shell svc data enable || true
          adb shell dumpsys activity exit-info com.productshot.local > "$EVIDENCE/exit-info.txt" 2>&1 || true
          adb logcat -d -v threadtime > "$EVIDENCE/logcat.txt"
          if grep -E 'FATAL EXCEPTION|ANR in com\.productshot\.local' "$EVIDENCE/logcat.txt"; then exit 1; fi

      - name: Upload runtime evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: productshot-local-ai-runtime-api${{ matrix.api }}
          path: ${{ runner.temp }}/productshot-local-evidence-${{ matrix.api }}/*
          if-no-files-found: warn
          retention-days: 7
