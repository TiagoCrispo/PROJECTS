name: AniFlow RC12 No-WebView Native Player Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc12-final
  cancel-in-progress: true

jobs:
  android-rc12-final:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC12_FINAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc12

    steps:
      - name: Announce run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC12_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0", cache-read-only: true }

      - name: Materialize latest RC11
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/aniflow-rc11-artifact
          mkdir -p "$ANIFLOW_ROOT" /tmp/aniflow-rc11-artifact
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow aniflow-rc11-final.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "AniFlow-v1.0.10-rc11-final") | .id' | head -1)"
          test -n "$ART_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > /tmp/aniflow-rc11-artifact.zip
          unzip -q /tmp/aniflow-rc11-artifact.zip -d /tmp/aniflow-rc11-artifact
          unzip -q /tmp/aniflow-rc11-artifact/AniFlow-v1.0.10-rc11-source.zip -d "$ANIFLOW_ROOT"
          grep -q 'versionName = "1.0.10-rc11"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Remove WebView playback implementation
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ANIFLOW_ROOT" <<'PY'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])
          path=root/'app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt'
          source=path.read_text()

          def matching_brace(text,start):
              depth=0; i=start; state='code'; quote=''
              while i<len(text):
                  c=text[i]; n=text[i+1] if i+1<len(text) else ''
                  if state=='code':
                      if c=='/' and n=='/': state='line'; i+=2; continue
                      if c=='/' and n=='*': state='block'; i+=2; continue
                      if c in ('"', "'"): quote=c; state='string'; i+=1; continue
                      if c=='{': depth+=1
                      elif c=='}':
                          depth-=1
                          if depth==0: return i
                      i+=1
                  elif state=='line':
                      if c=='\n': state='code'
                      i+=1
                  elif state=='block':
                      if c=='*' and n=='/': state='code'; i+=2
                      else: i+=1
                  else:
                      if c=='\\': i+=2; continue
                      if c==quote: state='code'
                      i+=1
              raise SystemExit('Unmatched Kotlin brace while removing WebView')

          replaced=0
          while 'WebView(' in source:
              idx=source.index('WebView(')
              candidates=[m.start() for m in re.finditer(r'(?m)^(?:private\s+)?fun\s+\w+',source[:idx])]
              if not candidates:
                  candidates=[m.start() for m in re.finditer(r'\bfun\s+\w+',source[:idx])]
              if not candidates: raise SystemExit('WebView outside function')
              fstart=candidates[-1]
              opening=source.find('{',fstart,idx+1)
              if opening<0: raise SystemExit('Cannot locate WebView function body')
              closing=matching_brace(source,opening)
              body='''{
    Box(
        modifier = Modifier.fillMaxSize(),
        contentAlignment = Alignment.Center,
    ) {
        Text(
            text = "Esta fuente web no es compatible con el reproductor nativo.",
            textAlign = TextAlign.Center,
        )
    }
}'''
              source=source[:opening]+body+source[closing+1:]
              replaced+=1
              if replaced>10: raise SystemExit('Unexpected WebView implementation count')

          source='\n'.join(line for line in source.splitlines() if not line.startswith('import android.webkit.'))+'\n'
          needed=[]
          if 'import androidx.compose.ui.Alignment' not in source: needed.append('import androidx.compose.ui.Alignment')
          if 'import androidx.compose.ui.text.style.TextAlign' not in source: needed.append('import androidx.compose.ui.text.style.TextAlign')
          if needed:
              lines=source.splitlines(); last=max(i for i,l in enumerate(lines) if l.startswith('import '))
              for item in reversed(needed): lines.insert(last+1,item)
              source='\n'.join(lines)+'\n'
          path.write_text(source)

          for kotlin in root.glob('app/src/main/java/**/*.kt'):
              text=kotlin.read_text()
              for forbidden in ['WebView(', 'WebViewClient', 'WebChromeClient', '.loadUrl(', 'CookieManager.getInstance()', 'evaluateJavascript(']:
                  if forbidden in text: raise SystemExit(f'{forbidden} remains in {kotlin}')

          build=root/'app/build.gradle.kts'; b=build.read_text()
          b=re.sub(r'(?m)^(\s*)versionCode\s*=\s*\d+\s*$',r'\1versionCode = 1000012',b)
          b=re.sub(r'(?m)^(\s*)versionName\s*=\s*"[^"]+"\s*$',r'\1versionName = "1.0.11-rc12"',b)
          build.write_text(b)

          validator=root/'scripts/validate-block16.py'
          validator.write_text('''#!/usr/bin/env python3
from pathlib import Path
ROOT=Path(__file__).resolve().parents[1]
SRC=ROOT/"app/src/main/java"
PLAYER=(SRC/"com/aniflow/app/feature/player/PlayerScreen.kt").read_text()

def req(ok,msg):
    if not ok: raise SystemExit("BLOCK16_FAIL: "+msg)
for path in SRC.rglob("*.kt"):
    text=path.read_text()
    for forbidden in ["WebView(", "WebViewClient", "WebChromeClient", ".loadUrl(", "evaluateJavascript("]:
        req(forbidden not in text, f"web playback remains: {forbidden} in {path}")
req("PlayerView" in PLAYER, "Media3 PlayerView missing")
req("NATIVE_WEB_FALLBACK_ENABLED = false" in PLAYER, "native-only gate regressed")
req("setForceHighestSupportedBitrate(true)" in PLAYER, "1080p preference regressed")
print("BLOCK16_NO_WEBVIEW_PLAYER_OK")
''')
          validator.chmod(0o755)
          PY
          grep -q 'versionName = "1.0.11-rc12"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Regression guards Blocks 2-16
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in $(seq 2 16); do test -f "scripts/validate-block${gate}.py"; python3 "scripts/validate-block${gate}.py"; done
          bash scripts/validate-pure-kotlin.sh
          bash scripts/validate-network-kotlin.sh
          bash scripts/validate-data-kotlin.sh
          bash scripts/validate-viewmodels-kotlin.sh
          bash scripts/validate-ui-syntax.sh
      - name: Unit tests
        run: gradle -p "$ANIFLOW_ROOT" :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Android lint
        run: gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify RC12
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"; UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc12-release.jks"; ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.11-rc12-aligned.apk"; FINAL="$RUNNER_TEMP/AniFlow-v1.0.11-rc12.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-rc12-ci -keypass aniflow-rc12-ci -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal RC12, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-rc12-ci --key-pass pass:aniflow-rc12-ci --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-rc12-deliverables"; mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.11-rc12-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.11-rc12.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.11-rc12-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          test ! -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" || cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/"
      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.11-rc12-final
          path: ${{ runner.temp }}/aniflow-rc12-deliverables/*
          if-no-files-found: error
          retention-days: 30
      - name: Announce success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC12_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.11-rc12-final"
