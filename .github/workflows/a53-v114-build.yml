name: A53 Performance v1.14 stable build

on:
  push:
    branches: [a53-build-v1.10]
    paths:
      - 'a53v113part-*'
      - 'a53v114diff-*'
      - '.github/workflows/a53-v114-build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified v1.13 base
        shell: bash
        run: |
          cat a53v113part-* > source.b64
          test "$(wc -c < source.b64)" -eq 54840
          base64 -d source.b64 > a53v113-source.tar.xz
          test "$(wc -c < a53v113-source.tar.xz)" -eq 41128
          echo "2aeec9d8fa486fc7112e9643e0a1628d9d9d9ee85a90dfc80f68cc9d29a0f7ba  a53v113-source.tar.xz" | sha256sum -c -
          tar -tJf a53v113-source.tar.xz >/dev/null
          tar -xJf a53v113-source.tar.xz
          grep -q "versionCode 19" a53v113/app/build.gradle
          grep -q "versionName '1.13.0'" a53v113/app/build.gradle

      - name: Apply verified v1.14 delta
        shell: bash
        run: |
          cat a53v114diff-* > v114diff.b64
          test "$(wc -c < v114diff.b64)" -eq 28656
          base64 -d v114diff.b64 > v114.diff.xz
          test "$(wc -c < v114.diff.xz)" -eq 21492
          echo "8af44f6f22f7d176638fc92e572022c81fbf324cb117b5ee7cbdb6d98b8c498b  v114.diff.xz" | sha256sum -c -
          xz -dc v114.diff.xz > v114.diff
          patch --batch --forward -p3 -d a53v113 < v114.diff
          mv a53v113 a53v114
          grep -q "versionCode 20" a53v114/app/build.gradle
          grep -q "versionName '1.14.0'" a53v114/app/build.gradle
          test -f a53v114/app/src/main/java/com/fer/a53performance/IndexDb.java
          test -f a53v114/app/src/main/java/com/fer/a53performance/MediaGenerationSync.java
          test -f a53v114/app/src/main/java/com/fer/a53performance/ThermalGuard.java
          test -f a53v114/app/src/main/java/com/fer/a53performance/GameProfiles.java

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - name: Restore stable v1.11+ signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: a53-performance-signing-v110
          fail-on-cache-miss: true

      - name: Force exact stable signer
        shell: bash
        run: |
          test -f "$HOME/.android/debug.keystore"
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | tee SIGNING_CERT.txt
          grep -q "14:C3:F4:55:94:6E:5E:43:6C:64:A6:A3:22:12:1F:6F:5B:BA:7F:96:F9:CF:9A:28:EC:73:05:CF:B3:87:52:95" SIGNING_CERT.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('a53v114/app/build.gradle')
          s=p.read_text()
          needle='    compileOptions {'
          insert='''    signingConfigs {\n        stableDebug {\n            storeFile file(System.getProperty("user.home") + "/.android/debug.keystore")\n            storePassword "android"\n            keyAlias "androiddebugkey"\n            keyPassword "android"\n        }\n    }\n\n    buildTypes {\n        debug {\n            signingConfig signingConfigs.stableDebug\n        }\n    }\n\n'''
          if needle not in s: raise SystemExit('compileOptions anchor missing')
          p.write_text(s.replace(needle, insert+needle, 1))
          PY

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Build v1.14
        run: gradle -p a53v114 :app:assembleDebug --stacktrace

      - name: Verify signer package version and 16KB alignment
        shell: bash
        run: |
          APK=a53v114/app/build/outputs/apk/debug/app-debug.apk
          BT=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          OUT=a53v114/app/build/outputs/apk/debug/verification
          mkdir -p "$OUT"
          "$BT/apksigner" verify --verbose --print-certs "$APK" | tee "$OUT/APK_VERIFY.txt"
          grep -q "certificate SHA-256 digest: 14c3f455946e5e436c64a6a322121f6f5bba7f96f9cf9a28ec7305cfb3875295" "$OUT/APK_VERIFY.txt"
          sha256sum "$APK" | tee "$OUT/SHA256.txt"
          "$BT/aapt" dump badging "$APK" | head -30 | tee "$OUT/BADGING.txt"
          grep -q "package: name='com.fer.a53performance' versionCode='20' versionName='1.14.0'" "$OUT/BADGING.txt"
          cp SIGNING_CERT.txt "$OUT/SIGNING_CERT.txt"
          unzip -t "$APK" > "$OUT/ZIP_TEST.txt"
          "$BT/zipalign" -v -c -P 16 4 "$APK" > "$OUT/ZIPALIGN_16KB.txt"
          if unzip -l "$APK" | grep -E 'lib/.*\.so$' > "$OUT/NATIVE_LIBS.txt"; then
            echo "Native libraries present" >> "$OUT/NATIVE_LIBS.txt"
          else
            echo "No native .so libraries present" > "$OUT/NATIVE_LIBS.txt"
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.14.0-INDEX-THERMAL
          retention-days: 1
          path: |
            a53v114/app/build/outputs/apk/debug/app-debug.apk
            a53v114/app/build/outputs/apk/debug/verification/APK_VERIFY.txt
            a53v114/app/build/outputs/apk/debug/verification/SHA256.txt
            a53v114/app/build/outputs/apk/debug/verification/BADGING.txt
            a53v114/app/build/outputs/apk/debug/verification/SIGNING_CERT.txt
            a53v114/app/build/outputs/apk/debug/verification/ZIP_TEST.txt
            a53v114/app/build/outputs/apk/debug/verification/ZIPALIGN_16KB.txt
            a53v114/app/build/outputs/apk/debug/verification/NATIVE_LIBS.txt
          if-no-files-found: error
