name: AniFlow RC23 Root Playback Fix V10

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc23-rootfix-v10
  cancel-in-progress: true

jobs:
  build-apk:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC23_ROOTFIX_V10'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROOT: /tmp/aniflow-rc22
      OUT: /tmp/aniflow-rc23-out
      VERSION: 1.0.22-rc23

    steps:
      - uses: actions/checkout@v5

      - name: Announce start
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC23_ROOTFIX_V10_STARTED run_id=${GITHUB_RUN_ID}"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
          cache-read-only: true

      - name: Reconstruct verified RC22 + buildfixes 1-3
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash "$GITHUB_WORKSPACE/.ci/rc22/reconstruct-buildfix3.sh"

      - name: Apply RC23 root playback patch
        shell: bash
        run: |
          set -euo pipefail
          PATCH="$GITHUB_WORKSPACE/.ci/rc23/rc22-to-rc23-root-playback-fix.patch"
          sha256sum "$PATCH"
          (cd "$ROOT" && patch -p1 --forward --batch < "$PATCH")
          grep -q 'versionCode = 1000023' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "1.0.22-rc23"' "$ROOT/app/build.gradle.kts"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/aniflow-rc22/app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt').read_text()
          block=p[p.index('DisposableEffect(player, source.uri)'):p.index('DisposableEffect(player)', p.index('DisposableEffect(player, source.uri)'))]
          assert 'player.release()' not in block
          assert 'onDispose { player.release() }' in p
          assert 'DefaultHttpDataSource.Factory()' in p
          print('RC23_PLAYER_LIFECYCLE_ROOTFIX_OK')
          PY

      - name: Verify live Wikimedia demo transports
        shell: bash
        run: |
          set -euo pipefail
          urls=(
            'https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a7/Morevna_Episode_3.0.2_%28English%29.webm/Morevna_Episode_3.0.2_%28English%29.webm.720p.vp9.webm'
            'https://upload.wikimedia.org/wikipedia/commons/transcoded/a/a7/Morevna_Episode_3.0.2_%28English%29.webm/Morevna_Episode_3.0.2_%28English%29.webm.1080p.vp9.webm'
            'https://upload.wikimedia.org/wikipedia/commons/a/a7/Morevna_Episode_3.0.2_%28English%29.webm'
          )
          i=0
          for url in "${urls[@]}"; do
            i=$((i+1))
            headers="/tmp/morevna-${i}.headers"
            body="/tmp/morevna-${i}.bin"
            curl -L --fail --silent --show-error --max-time 25 --range 0-8191 \
              -A 'AniFlow-RC23-CI/1.0 (+https://github.com/TiagoCrispo/PROJECTS)' \
              -D "$headers" -o "$body" "$url"
            test -s "$body"
            tr -d '\r' < "$headers" | grep -Eiq '^content-type: video/webm([;[:space:]]|$)'
            echo "MOREVNA_TRANSPORT_${i}_OK bytes=$(wc -c < "$body")"
          done

      - name: Source and playback-catalog gates
        shell: bash
        run: |
          set -euo pipefail
          cd "$ROOT"
          find scripts -maxdepth 1 -type f -name '*.sh' -exec chmod +x {} +
          bash scripts/validate-local.sh
          cd playback-catalog
          npm test
          npm run validate

      - name: Unit tests, lint, debug and release assembly
        run: gradle -p "$ROOT" :app:testDebugUnitTest :app:lintDebug :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify tests and lint
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('/tmp/aniflow-rc22/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files:
              raise SystemExit('no junit xml files')
          tests=failures=errors=skipped=0
          for f in files:
              r=ET.parse(f).getroot()
              tests += int(r.attrib.get('tests',0))
              failures += int(r.attrib.get('failures',0))
              errors += int(r.attrib.get('errors',0))
              skipped += int(r.attrib.get('skipped',0))
          print(f'TEST_COUNTS tests={tests} failures={failures} errors={errors} skipped={skipped}')
          if tests != 64 or failures or errors:
              raise SystemExit(1)
          PY
          REPORT="$ROOT/app/build/reports/lint-results-debug.txt"
          test -f "$REPORT"
          ! grep -q ': Error:' "$REPORT"
          ! grep -q '\[RequiresFeature\]' "$REPORT"
          ERRORS=$(grep -Ec '^[^ ].*:.*: Error:' "$REPORT" || true)
          WARNINGS=$(grep -Ec '^[^ ].*:.*: Warning:' "$REPORT" || true)
          echo "LINT_COUNTS errors=${ERRORS} warnings=${WARNINGS}"

      - name: Sign, inspect and verify APKs
        id: apk
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          DEBUG="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          UNSIGNED="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc23-v10.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v${VERSION}-aligned.apk"
          RELEASE="$RUNNER_TEMP/AniFlow-v${VERSION}.apk"
          mkdir -p "$OUT"

          test -s "$DEBUG"
          test -s "$UNSIGNED"
          unzip -t "$DEBUG" >/dev/null
          unzip -t "$UNSIGNED" >/dev/null
          unzip -l "$DEBUG" | grep -q 'AndroidManifest.xml'
          unzip -l "$DEBUG" | grep -q 'classes.dex'
          unzip -l "$UNSIGNED" | grep -q 'AndroidManifest.xml'
          unzip -l "$UNSIGNED" | grep -q 'classes.dex'

          PASS="$(openssl rand -hex 24)"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass "$PASS" \
            -keypass "$PASS" \
            -alias aniflow \
            -keyalg RSA \
            -keysize 4096 \
            -validity 3650 \
            -dname "CN=AniFlow RC23 Test Release, OU=Android, O=AniFlow, L=Mendoza, C=AR"

          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/zipalign" -c -v 4 "$ALIGNED"
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias aniflow \
            --ks-pass "pass:$PASS" \
            --key-pass "pass:$PASS" \
            --out "$RELEASE" \
            "$ALIGNED"

          "$TOOLS/apksigner" verify --verbose --print-certs "$DEBUG" | tee "$OUT/apksigner-debug.txt"
          "$TOOLS/apksigner" verify --verbose --print-certs "$RELEASE" | tee "$OUT/apksigner-release.txt"
          "$TOOLS/zipalign" -c -v 4 "$RELEASE"
          unzip -t "$RELEASE" >/dev/null

          "$TOOLS/aapt" dump badging "$DEBUG" | tee "$OUT/badging-debug.txt"
          "$TOOLS/aapt" dump badging "$RELEASE" | tee "$OUT/badging-release.txt"

          grep -q "package: name='com.aniflow.app.debug'" "$OUT/badging-debug.txt"
          grep -q "versionCode='1000023'" "$OUT/badging-debug.txt"
          grep -q "versionName='1.0.22-rc23-debug'" "$OUT/badging-debug.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/badging-debug.txt"

          grep -q "package: name='com.aniflow.app'" "$OUT/badging-release.txt"
          grep -q "versionCode='1000023'" "$OUT/badging-release.txt"
          grep -q "versionName='1.0.22-rc23'" "$OUT/badging-release.txt"
          grep -q "targetSdkVersion:'36'" "$OUT/badging-release.txt"

          cp "$DEBUG" "$OUT/AniFlow-v${VERSION}-debug.apk"
          cp "$RELEASE" "$OUT/AniFlow-v${VERSION}-release-signed.apk"
          sha256sum "$OUT/AniFlow-v${VERSION}-debug.apk" "$OUT/AniFlow-v${VERSION}-release-signed.apk" | tee "$OUT/SHA256SUMS.txt"
          echo "debug_sha=$(sha256sum "$OUT/AniFlow-v${VERSION}-debug.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"
          echo "release_sha=$(sha256sum "$OUT/AniFlow-v${VERSION}-release-signed.apk" | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Package source and reports
        shell: bash
        run: |
          set -euo pipefail
          (cd "$ROOT" && zip -qr "$OUT/AniFlow-v${VERSION}-source.zip" . \
            -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*' 'benchmark/build/*' 'playback-catalog/node_modules/*')
          cp "$ROOT/app/build/reports/lint-results-debug.txt" "$OUT/"
          cat > "$OUT/INSTALL.txt" <<'EOF'
          AniFlow RC23 root playback fix

          Recommended device test: AniFlow-v1.0.22-rc23-debug.apk
          Debug package is com.aniflow.app.debug and can coexist with the release package.

          RC23 fixes ExoPlayer lifecycle during source failover, adds an explicit HTTP data source with timeouts/user-agent/redirect handling, replaces the unverified Archive fallback with current Wikimedia VP9 derivatives plus the original file, preflights catalog demo sources, and can fall back to the official Morevna Project YouTube IFrame if direct Media3 playback fails.

          The release-signed APK uses an ephemeral CI test certificate.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.22-rc23-rootfix-v10
          path: /tmp/aniflow-rc23-out/*
          if-no-files-found: error
          retention-days: 30

      - name: Announce success
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          DEBUG_SHA: ${{ steps.apk.outputs.debug_sha }}
          RELEASE_SHA: ${{ steps.apk.outputs.release_sha }}
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC23_ROOTFIX_V10_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.22-rc23-rootfix-v10 tests=64/64 lint_errors=0 debug_sha256=${DEBUG_SHA} release_sha256=${RELEASE_SHA}"

      - name: Announce failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC23_ROOTFIX_V10_FAILED run_id=${GITHUB_RUN_ID}"
