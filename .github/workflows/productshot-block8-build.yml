name: ProductShot Block 8 Android Build

on:
  push:
    branches:
      - productshot-block8-build
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-block8-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-block8-build.yml"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild and verify ProductShot source archive
        shell: bash
        run: |
          set -euo pipefail
          cd projects/ProductShot/block8

          expected=(
            source.b64.00 source.b64.01 source.b64.02 source.b64.03
            source.b64.04 source.b64.05 source.b64.06
          )
          for part in "${expected[@]}"; do
            test -s "$part" || { echo "Missing/empty transport chunk: $part" >&2; exit 1; }
          done
          mapfile -t actual < <(find . -maxdepth 1 -type f -name 'source.b64.*' -printf '%f\n' | sort)
          if [[ "${actual[*]}" != "${expected[*]}" ]]; then
            printf 'Unexpected transport chunk set.\nExpected: %s\nActual: %s\n' "${expected[*]}" "${actual[*]}" >&2
            exit 1
          fi

          mkdir -p "$RUNNER_TEMP/productshot-src"
          ARCHIVE="$RUNNER_TEMP/ProductShot-v0.9.8-source.zip"
          cat "${expected[@]}" | base64 -d > "$ARCHIVE"
          ACTUAL_SHA256="$(sha256sum "$ARCHIVE" | awk '{print $1}')"
          echo "actual_source_zip_sha256=$ACTUAL_SHA256"
          unzip -t "$ARCHIVE"
          EXPECTED_SHA256="10601a51d25279711fefe276c6bc685424096677f8b78d072e11836f97047c0b"
          if [[ "$ACTUAL_SHA256" != "$EXPECTED_SHA256" ]]; then
            echo "Source ZIP checksum mismatch: expected=$EXPECTED_SHA256 actual=$ACTUAL_SHA256" >&2
            exit 1
          fi
          unzip -q "$ARCHIVE" -d "$RUNNER_TEMP/productshot-src"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static validation
        working-directory: ${{ runner.temp }}/productshot-src
        run: python3 scripts/static_validate.py .

      - name: Runtime dependency report
        working-directory: ${{ runner.temp }}/productshot-src
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/productshot-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK checksum
        working-directory: ${{ runner.temp }}/productshot-src
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-debug.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v0.9.8-debug
          path: |
            ${{ runner.temp }}/productshot-src/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/productshot-src/apk-debug.sha256
            ${{ runner.temp }}/productshot-src/dependency-report.txt
          if-no-files-found: error
