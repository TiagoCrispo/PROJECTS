name: ProductShot Block 8 Android Build

on:
  push:
    branches:
      - productshot-block8-build
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-block8-build.yml"
  pull_request:
    branches:
      - main
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-block8-build.yml"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Rebuild ProductShot source archive
        run: |
          cd projects/ProductShot/block8
          cat > chunks.sha256 <<'EOF'
          a0f2f011a490c3cf4430598251af2eb193de023d3b64270a2e706f057490b847  source.b64.00
          5399602c0cf37b157165d9baddcb74e47459b57c5728ebb96d0e05e4fcf13962  source.b64.01
          696c20de28c089cfbf54fc5a8ccbe91e4a75389d094c2ef5b2c549f63efd7f02  source.b64.02
          11fa47841eb07233a9243ea7ab5d95c3ed0ddd0f5591b4011b3dc9fec12be494  source.b64.03
          34a4ea4d43f25afb87896b6dbc649246c7630b44d4fe8e84039c02196a536857  source.b64.04
          98a42d1a2e5ae29a1c1adda6ea5ed1288b06cdc6761c12a28cb29508ecc13bc8  source.b64.05
          b152aa88424ec29b71572645d454b1ed262d0c0874b2b20ee3e9d7844aebd28f  source.b64.06
          EOF
          sha256sum -c chunks.sha256
          mkdir -p "$RUNNER_TEMP/productshot-src"
          cat source.b64.00 source.b64.01 source.b64.02 source.b64.03 source.b64.04 source.b64.05 source.b64.06 | base64 -d > "$RUNNER_TEMP/ProductShot-v0.9.8-source.zip"
          echo "10601a51d25279711fefe276c6bc685424096677f8b78d072e11836f97047c0b  $RUNNER_TEMP/ProductShot-v0.9.8-source.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/ProductShot-v0.9.8-source.zip" -d "$RUNNER_TEMP/productshot-src"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Static validation
        working-directory: ${{ runner.temp }}/productshot-src
        run: python3 scripts/static_validate.py .

      - name: Runtime dependency report
        working-directory: ${{ runner.temp }}/productshot-src
        run: gradle --no-daemon :app:dependencies --configuration debugRuntimeClasspath > dependency-report.txt

      - name: Build debug APK
        working-directory: ${{ runner.temp }}/productshot-src
        run: gradle --no-daemon --stacktrace :app:assembleDebug

      - name: APK checksum
        working-directory: ${{ runner.temp }}/productshot-src
        run: sha256sum app/build/outputs/apk/debug/app-debug.apk | tee apk-debug.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v0.9.8-debug
          path: |
            ${{ runner.temp }}/productshot-src/app/build/outputs/apk/debug/app-debug.apk
            ${{ runner.temp }}/productshot-src/apk-debug.sha256
            ${{ runner.temp }}/productshot-src/dependency-report.txt
          if-no-files-found: error
