name: Build BandLab v1.0

on:
  push:
    branches: ['agent/bandlab-v10-build3']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct v0.9 base
        run: |
          cat v09/part_00.b64 v09/part_01.b64 v09/part_02.b64 v09/part_03.b64 v09/part_04.b64 v09/part_05.b64 v09/p6_00.b64 v09/p6_01.b64 v09/p6_02.b64 v09/p6_03.b64 v09/p6_04.b64 v09/p6_05.b64 v09/p6_06.b64 v09/p6_07.b64 v09/part_07.b64 | base64 -d > /tmp/BandLabNative_v09_project.zip
          echo "80887ff56ae0d35b91f4706da8c83df193f2c19da31341190e9aafb46067116b  /tmp/BandLabNative_v09_project.zip" | sha256sum -c -
          unzip -q /tmp/BandLabNative_v09_project.zip
      - name: Apply v1.0 patch
        run: |
          cat v10/c00.b64 v10/c01.b64 v10/c02.b64 v10/c03.b64 v10/c04.b64 > /tmp/v10patch.b64
          echo "6e6c98537b896794709a85a033bbd41d863ad2e94d70934c60baec24330ca445  /tmp/v10patch.b64" | sha256sum -c -
          base64 -d /tmp/v10patch.b64 > /tmp/v10patch.gz
          echo "709844c1c200f75f7f2cbd5047fb4a546754971201b39ffaad674b47ecb3c89d  /tmp/v10patch.gz" | sha256sum -c -
          gzip -dc /tmp/v10patch.gz > /tmp/v10.patch
          cd BandLabNative_v09
          patch -p1 < /tmp/v10.patch
          mkdir -p app/src/main/res/drawable
          cp ../v10/band_hero.xml app/src/main/res/drawable/band_hero.xml
          cp ../v10/band_normal_preview.xml app/src/main/res/drawable/band_normal_preview.xml
          grep -q "1.0.0-test" app/build.gradle
      - name: Build APK
        working-directory: BandLabNative_v09
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
          file BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
          sha256sum BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BandLab9Active-v1.0-test-apk
          path: BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
