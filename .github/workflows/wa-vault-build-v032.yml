name: WA Vault v0.3.2 build

on:
  push:
    branches: [wa-vault-build-v032]
    paths:
      - 'wa-vault-build-v032-small/**'
      - '.github/workflows/wa-vault-build-v032.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Decode verified project
        shell: bash
        run: |
          set -euo pipefail
          cat \
            wa-vault-build-v032-small/part-000.b64 \
            wa-vault-build-v032-small/part-001.b64 \
            wa-vault-build-v032-small/part-002.b64 \
            wa-vault-build-v032-small/part-003.b64 \
            wa-vault-build-v032-small/part-004.b64 \
            wa-vault-build-v032-small/part-005.b64 \
            wa-vault-build-v032-small/part-006.b64 \
            wa-vault-build-v032-small/part-007a.b64 \
            wa-vault-build-v032-small/part-007b.b64 \
            wa-vault-build-v032-small/part-008a.b64 \
            wa-vault-build-v032-small/part-008b.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          echo 'a5933b2452ec76b37f552a8bb42bb14045de3c3d8b80d5aee27a9526981ac90b  /tmp/project.tar.xz' | sha256sum -c -
          xz -t /tmp/project.tar.xz
          rm -rf wa-vault-build-v032-project
          mkdir -p wa-vault-build-v032-project
          tar -xJf /tmp/project.tar.xz -C wa-vault-build-v032-project
          test -f wa-vault-build-v032-project/app/src/main/java/com/fer/wavault/MainActivity.java
          test -f wa-vault-build-v032-project/app/src/main/java/com/fer/wavault/MediaThumbnailLoader.java
          grep -q 'versionCode = 32' wa-vault-build-v032-project/app/build.gradle.kts
          grep -q 'pending_manual_media' wa-vault-build-v032-project/app/src/main/java/com/fer/wavault/VaultDb.java

      - name: Apply compile fixes
        run: |
          python3 wa-vault-build-v032-small/compile_fix.py wa-vault-build-v032-project
          python3 wa-vault-build-v032-small/compile_fix2.py wa-vault-build-v032-project

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK and capture compiler log
        id: android_build
        working-directory: wa-vault-build-v032-project
        shell: bash
        run: |
          set +e
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain 2>&1 | tee /tmp/wa-vault-v032-gradle.log
          rc=${PIPESTATUS[0]}
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist compiler failure log
        if: steps.android_build.outputs.exit_code != '0'
        run: |
          mkdir -p ci-logs
          {
            echo "WA Vault v0.3.2 Gradle failure"
            echo "run: $GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
            echo
            tail -n 1200 /tmp/wa-vault-v032-gradle.log
          } > ci-logs/wa-vault-v032-gradle-failure.log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ci-logs/wa-vault-v032-gradle-failure.log
          git commit -m "Record WA Vault v0.3.2 compiler failure" || true
          git push origin HEAD:wa-vault-build-v032

      - name: Fail after preserving compiler log
        if: steps.android_build.outputs.exit_code != '0'
        run: exit 1

      - name: Verify APK
        if: steps.android_build.outputs.exit_code == '0'
        shell: bash
        run: |
          APK=wa-vault-build-v032-project/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          sha256sum "$APK" | tee wa-vault-build-v032-project/APK_SHA256.txt

      - uses: actions/upload-artifact@v4
        if: steps.android_build.outputs.exit_code == '0'
        with:
          name: WA-Vault-v0.3.2-debug
          path: |
            wa-vault-build-v032-project/app/build/outputs/apk/debug/app-debug.apk
            wa-vault-build-v032-project/APK_SHA256.txt
            wa-vault-build-v032-project/CHANGELOG.md
            wa-vault-build-v032-project/README.md
