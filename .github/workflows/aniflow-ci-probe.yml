name: AniFlow CI Orchestrator

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  orchestrate:
    if: github.event_name != 'issue_comment' || github.event.comment.body == 'RUN_ANIFLOW_RC3_FINAL_TRIGGER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch RC3 final build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          WORKFLOW="aniflow-rc3-final.yml"
          BEFORE_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          gh workflow run "$WORKFLOW" --repo "$GITHUB_REPOSITORY" --ref main
          FINAL_RUN_ID=""
          for attempt in $(seq 1 24); do
            CANDIDATE="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow "$WORKFLOW" --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            if [ -n "$CANDIDATE" ] && [ "$CANDIDATE" != "$BEFORE_ID" ]; then
              FINAL_RUN_ID="$CANDIDATE"
              break
            fi
            sleep 5
          done
          test -n "$FINAL_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" \
            -f body="ANIFLOW_RC3_FINAL_DISPATCHED run_id=$FINAL_RUN_ID previous_run_id=${BEFORE_ID:-none} orchestrator_run_id=$GITHUB_RUN_ID" || true
