name: AniFlow CI Orchestrator

on:
  issue_comment:
    types: [created]
  schedule:
    - cron: "34 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  issues: write

concurrency:
  group: aniflow-ci-orchestrator
  cancel-in-progress: false

jobs:
  orchestrate:
    if: github.event_name != 'issue_comment' || github.event.comment.body == 'RUN_ANIFLOW_FINAL'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Announce orchestrator
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/34/comments" \
            -f body="ANIFLOW_ORCHESTRATOR_START run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA trigger=$GITHUB_EVENT_NAME" || true
          API="repos/$GITHUB_REPOSITORY/contents/.ci/aniflow-orchestrator-status.txt"
          TEXT="ANIFLOW_ORCHESTRATOR_START run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA trigger=$GITHUB_EVENT_NAME"
          CONTENT="$(printf '%s\n' "$TEXT" | base64 -w0)"
          CURRENT_SHA="$(gh api "$API" --jq .sha 2>/dev/null || true)"
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "$API" -f message="Update AniFlow orchestrator status" -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch="main" >/dev/null || true
          else
            gh api --method PUT "$API" -f message="Create AniFlow orchestrator status" -f content="$CONTENT" -f branch="main" >/dev/null || true
          fi

      - name: Dispatch final AniFlow gate
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run aniflow-smoke.yml --repo "$GITHUB_REPOSITORY" --ref main
          FINAL_RUN_ID=""
          for attempt in $(seq 1 12); do
            FINAL_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow aniflow-smoke.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$FINAL_RUN_ID" ] && break
            sleep 5
          done
          test -n "$FINAL_RUN_ID"
          TEXT="ANIFLOW_FINAL_DISPATCHED final_run_id=$FINAL_RUN_ID orchestrator_run_id=$GITHUB_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/34/comments" -f body="$TEXT" || true
          API="repos/$GITHUB_REPOSITORY/contents/.ci/aniflow-orchestrator-status.txt"
          CONTENT="$(printf '%s\n' "$TEXT" | base64 -w0)"
          CURRENT_SHA="$(gh api "$API" --jq .sha 2>/dev/null || true)"
          if [ -n "$CURRENT_SHA" ]; then
            gh api --method PUT "$API" -f message="Record AniFlow final run id" -f content="$CONTENT" -f sha="$CURRENT_SHA" -f branch="main" >/dev/null || true
          fi
