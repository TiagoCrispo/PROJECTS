name: AniFlow CI Orchestrator

on:
  issue_comment:
    types: [created]
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  issues: write

jobs:
  orchestrate:
    if: github.event_name != 'issue_comment' || github.event.comment.body == 'RUN_ANIFLOW_RC2_TRIGGER'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Dispatch RC2 build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh workflow run aniflow-rc2.yml --repo "$GITHUB_REPOSITORY" --ref main
          RC2_RUN_ID=""
          for attempt in $(seq 1 18); do
            RC2_RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow aniflow-rc2.yml --event workflow_dispatch --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
            [ -n "$RC2_RUN_ID" ] && break
            sleep 5
          done
          test -n "$RC2_RUN_ID"
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/${{ github.event.issue.number }}/comments" \
            -f body="ANIFLOW_RC2_DISPATCHED run_id=$RC2_RUN_ID orchestrator_run_id=$GITHUB_RUN_ID" || true
