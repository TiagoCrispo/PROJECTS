name: A53 Performance v1.15.10
on:
  workflow_dispatch:
  push:
    branches: [agent/a53-performance-v11510]
    paths: [A53Performance/BUILD_READY_11510]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v11510
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release debug and tests
        working-directory: A53Performance
        run: gradle --no-daemon clean :app:assembleRelease :app:assembleDebug :app:assembleAndroidTest
      - name: Validate release APK
        run: |
          APK=A53Performance/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "package: name='com.fer.a53performance' versionCode='32' versionName='1.15.10'"
          for P in android.permission.POST_NOTIFICATIONS android.permission.PACKAGE_USAGE_STATS android.permission.WRITE_SETTINGS android.permission.QUERY_ALL_PACKAGES; do if $ANDROID_HOME/build-tools/35.0.0/aapt dump permissions "$APK" | grep -q "$P"; then echo "Unexpected permission $P"; exit 1; fi; done
          mkdir -p out smoke
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 "$APK" out/A53Performance_v1.15.10_DEVICE_HARDENING_UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 out/A53Performance_v1.15.10_DEVICE_HARDENING_UNSIGNED.apk
          cp A53Performance/app/build/outputs/apk/debug/app-debug.apk smoke/A53Performance_v1.15.10_debug.apk
          cp A53Performance/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk smoke/A53Performance_v1.15.10_androidTest.apk
          sha256sum out/A53Performance_v1.15.10_DEVICE_HARDENING_UNSIGNED.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.15.10-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.15.10-smoke
          path: smoke/
          if-no-files-found: error
          retention-days: 1

  emulator-matrix:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        api: [30, 33, 35]
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: A53Performance-v1.15.10-smoke
          path: smoke
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r smoke/A53Performance_v1.15.10_debug.apk
            adb install -r smoke/A53Performance_v1.15.10_androidTest.apk
            if [ ${{ matrix.api }} -ge 33 ]; then adb shell pm grant com.fer.a53performance android.permission.READ_MEDIA_IMAGES || true; adb shell pm grant com.fer.a53performance android.permission.READ_MEDIA_VIDEO || true; adb shell pm grant com.fer.a53performance android.permission.READ_MEDIA_AUDIO || true; else adb shell pm grant com.fer.a53performance android.permission.READ_EXTERNAL_STORAGE || true; fi
            adb shell appops set com.fer.a53performance MANAGE_EXTERNAL_STORAGE allow || true
            adb shell am instrument -w com.fer.a53performance.test/androidx.test.runner.AndroidJUnitRunner | tee instrument.txt
            grep -q 'OK (9 tests)' instrument.txt
            adb logcat -c
            if [ ${{ matrix.api }} -ge 35 ]; then i=0; while [ $i -lt 14 ]; do adb shell am force-stop com.fer.a53performance; adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null; i=$((i+1)); done; else i=0; while [ $i -lt 8 ]; do adb shell am force-stop com.fer.a53performance; adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null; i=$((i+1)); done; fi
            adb install -r smoke/A53Performance_v1.15.10_debug.apk >/dev/null
            adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null
            adb shell settings put system accelerometer_rotation 0 || true
            adb shell settings put system user_rotation 1 || true
            adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null
            adb shell settings put system user_rotation 0 || true
            adb shell am send-trim-memory com.fer.a53performance RUNNING_LOW || true
            if [ ${{ matrix.api }} -ge 35 ]; then adb shell monkey -p com.fer.a53performance --pct-syskeys 0 --pct-appswitch 0 --throttle 8 800 >/dev/null || true; else adb shell monkey -p com.fer.a53performance --pct-syskeys 0 --pct-appswitch 0 --throttle 8 300 >/dev/null || true; fi
            adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null
            sleep 3
            test -n "$(adb shell pidof com.fer.a53performance | tr -d '\r')"
            if adb logcat -d -t 5000 | grep -A24 'FATAL EXCEPTION' | grep -q 'com.fer.a53performance'; then exit 1; fi

  upgrade-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v11510
          path: current
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1158
          path: old
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build both versions under same debug signer
        run: |
          (cd old/A53Performance && gradle --no-daemon :app:assembleDebug)
          (cd current/A53Performance && gradle --no-daemon :app:assembleDebug)
          mkdir -p upgrade
          cp old/A53Performance/app/build/outputs/apk/debug/app-debug.apk upgrade/v1158.apk
          cp current/A53Performance/app/build/outputs/apk/debug/app-debug.apk upgrade/v11510.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify upgrade/v1158.apk
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify upgrade/v11510.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS:="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install upgrade/v1158.apk
            adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null
            adb shell am force-stop com.fer.a53performance
            printf '%s' '<map><string name="last_profile">COOL</string><boolean name="auto_restore_profile" value="false" /></map>' > /tmp/a53_ui.xml
            printf '%s' '<map><set name="user_packages"><string>com.example.keepme</string></set></map>' > /tmp/a53_protected_apps.xml
            adb push /tmp/a53_ui.xml /data/local/tmp/a53_ui.xml >/dev/null
            adb push /tmp/a53_protected_apps.xml /data/local/tmp/a53_protected_apps.xml >/dev/null
            adb shell chmod 644 /data/local/tmp/a53_ui.xml /data/local/tmp/a53_protected_apps.xml
            adb shell run-as com.fer.a53performance mkdir -p shared_prefs files
            adb shell run-as com.fer.a53performance cp /data/local/tmp/a53_ui.xml shared_prefs/a53_ui.xml
            adb shell run-as com.fer.a53performance cp /data/local/tmp/a53_protected_apps.xml shared_prefs/a53_protected_apps.xml
            adb shell run-as com.fer.a53performance cp /data/local/tmp/a53_ui.xml files/upgrade_marker.txt
            adb install -r upgrade/v11510.apk
            adb shell dumpsys package com.fer.a53performance | grep -q 'versionName=1.15.10'
            adb shell run-as com.fer.a53performance cat files/upgrade_marker.txt | grep -q COOL
            adb shell run-as com.fer.a53performance cat shared_prefs/a53_ui.xml | grep -q COOL
            adb shell run-as com.fer.a53performance cat shared_prefs/a53_protected_apps.xml | grep -q com.example.keepme
            adb shell am start -W -n com.fer.a53performance/.MainActivity >/dev/null
            sleep 2
            test -n "$(adb shell pidof com.fer.a53performance | tr -d '\r')"
            if adb logcat -d -t 2500 | grep -A24 'FATAL EXCEPTION' | grep -q 'com.fer.a53performance'; then exit 1; fi
