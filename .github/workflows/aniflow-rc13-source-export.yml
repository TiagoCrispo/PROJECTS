name: AniFlow RC13 Source Export

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc13-source-export
  cancel-in-progress: true

jobs:
  export:
    if: github.event.issue.number == 37 && github.event.comment.body == 'EXPORT_ANIFLOW_RC13_SOURCE'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc13-export
    steps:
      - uses: actions/checkout@v5
      - name: Reconstruct exact RC13 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/rc8-export
          mkdir -p "$ANIFLOW_ROOT" /tmp/rc8-export
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9375678214/zip" > /tmp/rc8-export.zip
          echo "67075e5eda087f82ad5e871947e02c5cf59e75ebea63e183e6c2e6dd1b8e936d  /tmp/rc8-export.zip" | sha256sum -c -
          unzip -q /tmp/rc8-export.zip -d /tmp/rc8-export
          unzip -q /tmp/rc8-export/AniFlow-v1.0.7-rc8-source.zip -d "$ANIFLOW_ROOT"
          cat .ci/rc9v4/part01.b64 | base64 -d | gzip -dc > /tmp/rc9.patch
          echo "03f194e7bb0990fcfab591233ad140ee8d1a36e795e3f3214da7f5f450609736  /tmp/rc9.patch" | sha256sum -c -
          (cd "$ANIFLOW_ROOT" && patch -p1 --forward --batch < /tmp/rc9.patch)
          cat .ci/rc10/part01.b64 .ci/rc10/part02.b64 | base64 -d | gzip -dc > /tmp/rc10.patch
          echo "5d961aa778892658c05122be7d0ccec7ece798ba399ef64d8f7941531d36320c  /tmp/rc10.patch" | sha256sum -c -
          (cd "$ANIFLOW_ROOT" && patch -p1 --forward --batch < /tmp/rc10.patch)
          python3 tools/aniflow_rc11_recovery.py "$ANIFLOW_ROOT"
          python3 tools/aniflow_rc13_recovery_patch_v3.py "$ANIFLOW_ROOT"
          mkdir -p /tmp/rc13-source-export
          cp "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt" /tmp/rc13-source-export/
          cp "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/feature/player/PlayerViewModel.kt" /tmp/rc13-source-export/
          cp "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/data/repository/RemotePlaybackResolver.kt" /tmp/rc13-source-export/
          cp "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/domain/VideoQualityPolicy.kt" /tmp/rc13-source-export/
          cp "$ANIFLOW_ROOT/app/build.gradle.kts" /tmp/rc13-source-export/
          (cd "$ANIFLOW_ROOT" && zip -qr /tmp/rc13-source-export/AniFlow-v1.0.12-rc13-transformed-source.zip . -x '.gradle/*' '**/build/*')
      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.12-rc13-transformed-source
          path: /tmp/rc13-source-export/*
          retention-days: 7
          if-no-files-found: error
      - name: Announce
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_SOURCE_EXPORT_SUCCESS run_id=${GITHUB_RUN_ID}"
