name: A53 v1.15.6 UI Patch
on:
  push:
    paths:
      - 'A53Performance/PATCH_V1156_READY'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1156
      - name: Patch v1.15.6 UI
        run: |
          python3 A53Performance/tools/patch_v1156.py
          git config user.name 'ChatGPT Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git commit -m 'Integrate v1.15.6 permission diagnostics'
          git push origin HEAD:agent/a53-performance-v1156
