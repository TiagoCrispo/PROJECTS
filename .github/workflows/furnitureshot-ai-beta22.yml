name: FurnitureShot AI beta22

on:
  pull_request:
    paths:
      - "projects/furnitureshot-ai-overlays/v0.7.1-beta22/**"
      - ".github/workflows/furnitureshot-ai-beta22.yml"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 16 SDK
        run: yes | sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble consolidated beta22 source tree
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/furnitureshot-ai-beta22"
          cp -a projects/furnitureshot-ai "$BUILD_DIR"
          OVERLAY="projects/furnitureshot-ai-overlays/v0.7.1-beta22"
          TARGET="$BUILD_DIR/app/src/main/java/com/tiagocrispo/furnitureshot/processing"
          rm -f "$TARGET/HighFidelityEnhancementEngine.kt"
          cp "$OVERLAY/LocalEnhancementEngine.kt" "$TARGET/LocalEnhancementEngine.kt"
          cp "$OVERLAY/FinishPassEngine.kt" "$TARGET/FinishPassEngine.kt"
          cp "$OVERLAY/PromptPolicy.kt" "$TARGET/PromptPolicy.kt"
          python3 - "$BUILD_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 31', text)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.7.1-beta22"', text)
          path.write_text(text)
          PY
          grep -n "versionCode\|versionName" "$BUILD_DIR/app/build.gradle.kts"

      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/furnitureshot-ai-beta22" :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/furnitureshot-ai-beta22/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          sha256sum "$APK"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureShotAI-v0.7.1-beta22-debug
          path: ${{ runner.temp }}/furnitureshot-ai-beta22/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
