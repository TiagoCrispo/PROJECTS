name: WA Vault v0.5.25 Final Hardening

on:
  push:
    branches: [wa-vault-build-v0525]
    paths:
      - 'wa-vault-build-v0525/**'
      - '.github/workflows/wa-vault-build-v0525.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.24 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0525-project
          gh run download 31926837799 -n WA-Vault-v0.5.24-source -D wa-vault-v0525-project
          grep -q 'versionCode = 74' wa-vault-v0525-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.24"' wa-vault-v0525-project/app/build.gradle.kts

      - name: Apply v0.5.25 final hardening patch
        run: |
          set -euo pipefail
          cat wa-vault-build-v0525/v0525.patch.gz.b64.part* | base64 -d | gzip -d > /tmp/v0525.patch
          cd wa-vault-v0525-project
          patch -p1 < /tmp/v0525.patch
          rm -rf app/build build .gradle
          python3 tools/v0525_regression_test.py
          grep -q 'versionCode = 75' app/build.gradle.kts
          grep -q 'versionName = "0.5.25"' app/build.gradle.kts

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0525-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore stable signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          test -s signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.25
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0525-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0525-output
          PASS="$(cat signing/SIGNING_BACKUP_PASSWORD.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0525-output/WA-Vault-v0.5.25.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0525-output/WA-Vault-v0.5.25.apk > wa-vault-v0525-output/APK_SIGNATURE.txt
          grep -qi 'Verified using v2 scheme.*true' wa-vault-v0525-output/APK_SIGNATURE.txt
          grep -qi 'Verified using v3 scheme.*true' wa-vault-v0525-output/APK_SIGNATURE.txt
          grep -qi '5e142d9605d4d63c8264d013e71a7d5e1aa04ca35438cf973e04c388c85d5be6' wa-vault-v0525-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0525-output/WA-Vault-v0.5.25.apk > wa-vault-v0525-output/APK_SHA256.txt
          cp wa-vault-v0525-project/V0525_NOTES.md wa-vault-v0525-output/
          cp wa-vault-v0525-project/TEST_MATRIX.md wa-vault-v0525-output/
          cp wa-vault-v0525-project/tools/v0525_regression_test.py wa-vault-v0525-output/

      - name: Prepare clean source
        run: |
          mkdir wa-vault-v0525-source
          rsync -a --exclude app/build --exclude build --exclude .gradle wa-vault-v0525-project/ wa-vault-v0525-source/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.25-release
          path: |
            wa-vault-v0525-output/WA-Vault-v0.5.25.apk
            wa-vault-v0525-output/APK_SHA256.txt
            wa-vault-v0525-output/APK_SIGNATURE.txt
            wa-vault-v0525-output/V0525_NOTES.md
            wa-vault-v0525-output/TEST_MATRIX.md
            wa-vault-v0525-output/v0525_regression_test.py
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.25-source
          path: wa-vault-v0525-source
          retention-days: 30
