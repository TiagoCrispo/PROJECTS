name: WA Vault v0.5.1 deleted-message hotfix

on:
  push:
    branches: [wa-vault-build-v051]
    paths:
      - 'wa-vault-build-v051/**'
      - '.github/workflows/wa-vault-build-v051.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.0 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v051-project
          gh run download 31871803635 -n WA-Vault-v0.5.0-source -D wa-vault-v051-project
          grep -q 'versionCode = 50' wa-vault-v051-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.0"' wa-vault-v051-project/app/build.gradle.kts
          grep -q 'android.useAndroidX=true' wa-vault-v051-project/gradle.properties

      - name: Apply verified v0.5.1 patch
        run: |
          set -euo pipefail
          cat wa-vault-build-v051/patch-00.b64 wa-vault-build-v051/patch-01.b64 wa-vault-build-v051/patch-02.b64 > /tmp/v051.patch.b64
          base64 -d /tmp/v051.patch.b64 > /tmp/v051.patch.xz
          echo '2157f619631ca960a17ec55528d6153e9e5d6884ff432eae4983162c5c145b88  /tmp/v051.patch.xz' | sha256sum -c -
          xz -dc /tmp/v051.patch.xz > /tmp/v051.patch
          cd wa-vault-v051-project
          patch -p1 --batch < /tmp/v051.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 51' app/build.gradle.kts
          grep -q 'versionName = "0.5.1"' app/build.gradle.kts
          grep -q 'DELETE_VERIFY_MS = 650L' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'saveRecentRemovedSnapshot' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'BORRADO PROBABLE' app/src/main/java/com/fer/wavault/MainActivity.java

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v051-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.1
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v051-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v051-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v051-output/WA-Vault-v0.5.1.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v051-output/WA-Vault-v0.5.1.apk > wa-vault-v051-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v051-output/WA-Vault-v0.5.1.apk > wa-vault-v051-output/APK_SHA256.txt
          cp wa-vault-v051-project/V051_NOTES.md wa-vault-v051-output/
          cp wa-vault-v051-project/TEST_MATRIX.md wa-vault-v051-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.1-release
          path: |
            wa-vault-v051-output/WA-Vault-v0.5.1.apk
            wa-vault-v051-output/APK_SHA256.txt
            wa-vault-v051-output/APK_SIGNATURE.txt
            wa-vault-v051-output/V051_NOTES.md
            wa-vault-v051-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.1-source
          path: wa-vault-v051-project
          retention-days: 30
