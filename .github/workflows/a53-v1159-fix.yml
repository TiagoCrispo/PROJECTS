name: A53 v1.15.9 Compat Fix
on:
  push:
    branches: [agent/a53-performance-v1159]
    paths: [A53Performance/FIX_READY_1159]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1159
      - run: python3 A53Performance/fix1159.py
      - run: |
          git config user.name "Damián Crispo"
          git config user.email "116601726+TiagoCrispo@users.noreply.github.com"
          git add A53Performance/app/src/main/java/com/fer/a53performance/StorageRepository.java A53Performance/app/src/main/java/com/fer/a53performance/StorageAnalyzer.java
          git diff --cached --quiet && exit 0
          git commit -m "Remove Java 9 collection factories from app paths"
          git push origin HEAD:agent/a53-performance-v1159
