name: WA Vault v0.5.12 precision media + storage fix

on:
  push:
    branches: [wa-vault-build-v0512]
    paths:
      - 'wa-vault-build-v0512/**'
      - '.github/workflows/wa-vault-build-v0512.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.11 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0512-project
          gh run download 31908975463 -n WA-Vault-v0.5.11-source -D wa-vault-v0512-project
          grep -q 'versionCode = 61' wa-vault-v0512-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.11"' wa-vault-v0512-project/app/build.gradle.kts

      - name: Apply verified v0.5.12 patch
        run: |
          set -euo pipefail
          cat wa-vault-build-v0512/chunks/part* | tr -d '\r\n' > /tmp/v0512.patch.gz.b64
          base64 -d /tmp/v0512.patch.gz.b64 | gzip -dc > /tmp/v0512.patch
          echo 'ffafcea04767d742c5be4f15ae662901d1cd51e2ccab666d492d72a1f71ecaee  /tmp/v0512.patch' | sha256sum -c -
          cd wa-vault-v0512-project
          patch -p1 --batch < /tmp/v0512.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 62' app/build.gradle.kts
          grep -q 'versionName = "0.5.12"' app/build.gradle.kts
          grep -q 'APP_CANCEL_PERSISTENT_REPOST' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'PROVISIONAL_MEDIA_TTL_MS' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'monitorPendingMedia' app/src/main/java/com/fer/wavault/MediaArchiver.java
          grep -qi 'whatsapp stickers' app/src/main/java/com/fer/wavault/DirectMediaWatcher.java
          grep -q 'consumeArm' app/src/main/java/com/fer/wavault/DirectVoiceWatcher.java
          test -s V0512_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0512-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.12
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0512-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0512-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0512-output/WA-Vault-v0.5.12.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0512-output/WA-Vault-v0.5.12.apk > wa-vault-v0512-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0512-output/WA-Vault-v0.5.12.apk > wa-vault-v0512-output/APK_SHA256.txt
          cp wa-vault-v0512-project/V0512_NOTES.md wa-vault-v0512-output/
          cp wa-vault-v0512-project/TEST_MATRIX.md wa-vault-v0512-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.12-release
          path: |
            wa-vault-v0512-output/WA-Vault-v0.5.12.apk
            wa-vault-v0512-output/APK_SHA256.txt
            wa-vault-v0512-output/APK_SIGNATURE.txt
            wa-vault-v0512-output/V0512_NOTES.md
            wa-vault-v0512-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.12-source
          path: wa-vault-v0512-project
          retention-days: 30
