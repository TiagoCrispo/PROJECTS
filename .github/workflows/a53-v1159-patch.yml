name: A53 v1.15.9 UI Patch
on:
  push:
    branches: [agent/a53-performance-v1159]
    paths: [A53Performance/PATCH_READY_1159]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1159
      - run: python3 A53Performance/patch1159.py
      - run: |
          git config user.name "Damián Crispo"
          git config user.email "116601726+TiagoCrispo@users.noreply.github.com"
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "Integrate v1.15.9 storage and safe RAM UI"
          git push origin HEAD:agent/a53-performance-v1159
