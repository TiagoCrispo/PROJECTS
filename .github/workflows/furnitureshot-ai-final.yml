name: FurnitureShot AI v0.8.0 final

on:
  pull_request:
    paths:
      - "projects/furnitureshot-ai-overlays/v0.8.0-final/**"
      - ".github/workflows/furnitureshot-ai-final.yml"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble final source tree
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/furnitureshot-ai-final"
          cp -a projects/furnitureshot-ai "$BUILD_DIR"
          PROCESSING="$BUILD_DIR/app/src/main/java/com/tiagocrispo/furnitureshot/processing"
          BETA22="projects/furnitureshot-ai-overlays/v0.7.1-beta22"
          BETA23="projects/furnitureshot-ai-overlays/v0.7.2-beta23"

          # Reconstruct the exact real beta22 source first.
          rm -f "$PROCESSING/HighFidelityEnhancementEngine.kt"
          cp "$BETA22/LocalEnhancementEngine.kt" "$PROCESSING/LocalEnhancementEngine.kt"
          cp "$BETA22/FinishPassEngine.kt" "$PROCESSING/FinishPassEngine.kt"
          cp "$BETA22/PromptPolicy.kt" "$PROCESSING/PromptPolicy.kt"

          # Reproduce the real beta23 engine that previously compiled successfully.
          python3 "$BETA23/transform_beta22_to_beta23.py" "$PROCESSING/LocalEnhancementEngine.kt"
          cp "$BETA23/PromptPolicy.kt" "$PROCESSING/PromptPolicy.kt"

          # Apply the final MAX-only patch tested against the beta23 source tree.
          PATCH_B64="$RUNNER_TEMP/final.patch.b64"
          PATCH_FILE="$RUNNER_TEMP/final.patch"
          cat projects/furnitureshot-ai-overlays/v0.8.0-final/patch-b64/chunk*.txt > "$PATCH_B64"
          base64 -d "$PATCH_B64" > "$PATCH_FILE"
          patch --batch --forward -p1 -d "$BUILD_DIR" < "$PATCH_FILE"

          python3 - "$BUILD_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 40', text)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.8.0-final"', text)
          path.write_text(text)
          PY
          grep -n "versionCode\|versionName" "$BUILD_DIR/app/build.gradle.kts"

      - name: Static pipeline guards
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/furnitureshot-ai-final/app/src/main/java/com/tiagocrispo/furnitureshot/processing/LocalEnhancementEngine.kt"
          POLICY="$RUNNER_TEMP/furnitureshot-ai-final/app/src/main/java/com/tiagocrispo/furnitureshot/processing/PromptPolicy.kt"
          UI="$RUNNER_TEMP/furnitureshot-ai-final/app/src/main/java/com/tiagocrispo/furnitureshot/ui/FurnitureShotApp.kt"
          ! grep -q "drawOval" "$SRC"
          ! grep -q "ProcessingProfile" "$POLICY"
          grep -q "SEGMENTATION_LONG_EDGE = 1792" "$SRC"
          grep -q "topologyLock" "$SRC"
          grep -q "suppressMulticolorBackgroundLeaks" "$SRC"
          grep -q "recoverLinearStructures" "$SRC"
          grep -q "suppressWhiteFringe" "$SRC"
          grep -q "Guardando en la galería" "$UI"
          grep -q "Listo. Guardado en la galería" "$UI"

      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/furnitureshot-ai-final" :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/furnitureshot-ai-final/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          sha256sum "$APK" | tee "$RUNNER_TEMP/furnitureshot-ai-final/apk-sha256.txt"

      - name: Package source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/furnitureshot-ai-final"
          zip -qr "$RUNNER_TEMP/FurnitureShotAI-v0.8.0-final-source.zip" . -x 'app/build/*' '.gradle/*' '.kotlin/*'

      - name: Stage deliverables
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/final-deliverables"
          cp "$RUNNER_TEMP/furnitureshot-ai-final/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/final-deliverables/FurnitureShotAI-v0.8.0-final.apk"
          cp "$RUNNER_TEMP/FurnitureShotAI-v0.8.0-final-source.zip" "$RUNNER_TEMP/final-deliverables/"
          cp "$RUNNER_TEMP/furnitureshot-ai-final/apk-sha256.txt" "$RUNNER_TEMP/final-deliverables/"

      - name: Upload final deliverables
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureShotAI-v0.8.0-final
          path: ${{ runner.temp }}/final-deliverables/*
          if-no-files-found: error
