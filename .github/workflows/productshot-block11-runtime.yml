name: ProductShot Block 11 Android runtime matrix

on:
  pull_request:
    branches:
      - main
    paths:
      - ".ci/productshot-rc1-exact/**"
      - ".ci/productshot-rc1-remediation/**"
      - ".github/workflows/productshot-block11-runtime.yml"
  workflow_dispatch:

permissions:
  contents: read

env:
  APP_PACKAGE: com.productshot.app.rc
  APP_ACTIVITY: com.productshot.app.MainActivity

jobs:
  build-runtime-apk:
    name: Build checksum-verified runtime APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5 release line
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.5.0"
          cache-disabled: true

      - name: Reconstruct and verify warning-remediated source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/productshot-block11-base.tar.gz"
          PROJECT="$RUNNER_TEMP/productshot-block11"
          cat .ci/productshot-rc1-exact/android.tar.gz.b64.x* | tr -d '\r\n' | base64 -d > "$ARCHIVE"
          echo "0108434bf6b1f4f37e745ac35878e909be4b42e8d38dfd27c3aedde698e2f573  $ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT"
          tar -xzf "$ARCHIVE" -C "$PROJECT"
          patch -d "$PROJECT" -p1 --batch --forward < .ci/productshot-rc1-remediation/warning-remediation.patch
          (
            cd "$PROJECT"
            sha256sum -c "$GITHUB_WORKSPACE/.ci/productshot-rc1-remediation/source.sha256"
          )
          grep -q "compileSdk 36" "$PROJECT/app/build.gradle"
          grep -q "targetSdk 36" "$PROJECT/app/build.gradle"
          grep -q "minSdk 29" "$PROJECT/app/build.gradle"
          grep -q 'applicationIdSuffix ".rc"' "$PROJECT/app/build.gradle"
          grep -q 'https://api.productshot.invalid' "$PROJECT/app/build.gradle"

      - name: Ensure Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Build optimized RC APK
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/productshot-block11"
          gradle -p "$PROJECT" :app:clean :app:assembleRc --stacktrace --no-daemon
          APK="$PROJECT/app/build/outputs/apk/rc/app-rc.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          mkdir -p "$RUNNER_TEMP/block11-apk"
          cp "$APK" "$RUNNER_TEMP/block11-apk/ProductShot-Block11-runtime.apk"
          sha256sum "$RUNNER_TEMP/block11-apk/ProductShot-Block11-runtime.apk" | tee "$RUNNER_TEMP/block11-apk/ProductShot-Block11-runtime.sha256"

      - name: Upload runtime APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 release line
        with:
          name: productshot-block11-runtime-apk
          path: ${{ runner.temp }}/block11-apk/*
          if-no-files-found: error
          retention-days: 7

  runtime-matrix:
    name: Runtime API ${{ matrix.api }}
    needs: build-runtime-apk
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        api: [29, 33, 35, 36]

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download runtime APK
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: productshot-block11-runtime-apk
          path: ${{ runner.temp }}/block11-apk

      - name: Provision Android emulator image
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          AVDMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/avdmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          if [[ ! -x "$AVDMANAGER" ]]; then AVDMANAGER="$(command -v avdmanager || true)"; fi
          test -x "$SDKMANAGER"
          test -x "$AVDMANAGER"
          "$SDKMANAGER" --install "platform-tools" "emulator"

          LIST="$RUNNER_TEMP/sdk-list-${API_LEVEL}.txt"
          "$SDKMANAGER" --list > "$LIST"
          IMAGE=""
          for candidate in \
            "system-images;android-${API_LEVEL};google_apis;x86_64" \
            "system-images;android-${API_LEVEL};default;x86_64" \
            "system-images;android-${API_LEVEL};google_apis_playstore;x86_64"; do
            if grep -Fq "$candidate" "$LIST"; then
              IMAGE="$candidate"
              break
            fi
          done
          if [[ -z "$IMAGE" ]]; then
            echo "No x86_64 emulator system image found for API ${API_LEVEL}" >&2
            grep -F "system-images;android-${API_LEVEL};" "$LIST" || true
            exit 1
          fi
          echo "BLOCK11_IMAGE=$IMAGE" >> "$GITHUB_ENV"
          "$SDKMANAGER" --install "$IMAGE"
          AVD="productshot-api${API_LEVEL}"
          echo "BLOCK11_AVD=$AVD" >> "$GITHUB_ENV"
          echo no | "$AVDMANAGER" create avd --force --name "$AVD" --package "$IMAGE" --device "pixel_6" >/dev/null

      - name: Boot emulator
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          EMULATOR="$SDK_ROOT/emulator/emulator"
          test -x "$EMULATOR"
          mkdir -p "$RUNNER_TEMP/block11-evidence-api${API_LEVEL}"
          EVIDENCE="$RUNNER_TEMP/block11-evidence-api${API_LEVEL}"

          ACCEL="-accel off"
          if [[ -e /dev/kvm ]]; then
            sudo chmod 666 /dev/kvm
            ACCEL="-accel on"
          fi
          echo "emulator_acceleration=$ACCEL" | tee "$EVIDENCE/emulator-acceleration.txt"
          "$EMULATOR" "@$BLOCK11_AVD" \
            -no-window \
            -noaudio \
            -no-boot-anim \
            -no-snapshot \
            -no-metrics \
            -gpu swiftshader_indirect \
            -camera-back emulated \
            -camera-front none \
            -memory 2048 \
            $ACCEL \
            > "$EVIDENCE/emulator.log" 2>&1 &
          echo $! > "$EVIDENCE/emulator.pid"

          adb wait-for-device
          timeout 420 bash -c 'until [[ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d "\r")" == "1" ]]; do sleep 2; done'
          adb shell input keyevent 82 || true
          adb shell cmd window dismiss-keyguard || true
          adb shell settings put global window_animation_scale 0
          adb shell settings put global transition_animation_scale 0
          adb shell settings put global animator_duration_scale 0
          adb shell getprop > "$EVIDENCE/getprop.txt"
          adb shell wm size > "$EVIDENCE/wm-size.txt"
          adb shell wm density > "$EVIDENCE/wm-density.txt"
          adb shell df -h > "$EVIDENCE/df.txt"

      - name: Install, launch and exercise lifecycle
        shell: bash
        env:
          API_LEVEL: ${{ matrix.api }}
        run: |
          set -euo pipefail
          EVIDENCE="$RUNNER_TEMP/block11-evidence-api${API_LEVEL}"
          APK="$RUNNER_TEMP/block11-apk/ProductShot-Block11-runtime.apk"
          COMPONENT="$APP_PACKAGE/$APP_ACTIVITY"
          test -s "$APK"
          adb install --no-streaming -r "$APK" | tee "$EVIDENCE/adb-install.txt"
          adb shell pm path "$APP_PACKAGE" | tee "$EVIDENCE/pm-path.txt"
          adb shell dumpsys package "$APP_PACKAGE" > "$EVIDENCE/package.txt"
          adb logcat -c
          adb logcat -b events -c || true

          assert_foreground() {
            for _ in $(seq 1 20); do
              if adb shell dumpsys activity activities 2>/dev/null | grep -E 'mResumedActivity|topResumedActivity' | grep -Fq "$APP_ACTIVITY"; then
                return 0
              fi
              sleep 1
            done
            adb shell dumpsys activity activities > "$EVIDENCE/activity-not-foreground.txt" || true
            return 1
          }

          launch() {
            local label="$1"
            adb shell am start -W -n "$COMPONENT" | tr -d '\r' | tee "$EVIDENCE/${label}-launch.txt"
            grep -q 'Status: ok' "$EVIDENCE/${label}-launch.txt"
            assert_foreground
          }

          snapshot() {
            local label="$1"
            adb exec-out screencap -p > "$EVIDENCE/${label}.png" || true
            adb shell uiautomator dump /sdcard/productshot-window.xml >/dev/null 2>&1 || true
            adb pull /sdcard/productshot-window.xml "$EVIDENCE/${label}-ui.xml" >/dev/null 2>&1 || true
          }

          launch initial
          snapshot initial

          python3 - "$EVIDENCE/initial-ui.xml" > "$EVIDENCE/clickables.txt" <<'PY'
          import sys, xml.etree.ElementTree as ET
          path = sys.argv[1]
          try:
              root = ET.parse(path).getroot()
          except Exception as exc:
              print(f"UI hierarchy unavailable: {exc}")
              raise SystemExit(0)
          for n in root.iter("node"):
              a = n.attrib
              if a.get("clickable") == "true" or a.get("long-clickable") == "true":
                  print(" | ".join([
                      f"text={a.get('text','')!r}",
                      f"desc={a.get('content-desc','')!r}",
                      f"id={a.get('resource-id','')!r}",
                      f"class={a.get('class','')!r}",
                      f"bounds={a.get('bounds','')}",
                  ]))
          PY

          # Background -> resume.
          adb shell input keyevent 3
          sleep 2
          launch resume-after-home

          # Configuration recreation through a 90-degree and back rotation.
          adb shell settings put system accelerometer_rotation 0 || true
          adb shell settings put system user_rotation 1 || true
          sleep 3
          assert_foreground
          snapshot landscape
          adb shell settings put system user_rotation 0 || true
          sleep 3
          assert_foreground

          # Real background process-death attempt. am kill only targets cached/background apps.
          adb shell input keyevent 3
          sleep 2
          adb shell am kill "$APP_PACKAGE" || true
          sleep 2
          launch relaunch-after-am-kill

          # Strong stop/restart path.
          adb shell am force-stop "$APP_PACKAGE"
          sleep 1
          launch relaunch-after-force-stop

          # Memory pressure signal; must not crash the foreground activity.
          adb shell am send-trim-memory "$APP_PACKAGE" RUNNING_CRITICAL || true
          sleep 2
          assert_foreground

          # Offline cold start. Backend is deliberately invalid in this internal RC, but the UI
          # must remain usable and must not crash merely because connectivity is unavailable.
          adb shell svc wifi disable || true
          adb shell svc data disable || true
          adb shell am force-stop "$APP_PACKAGE"
          launch offline-cold-start
          sleep 3
          assert_foreground
          snapshot offline
          adb shell svc wifi enable || true
          adb shell svc data enable || true

          # Repeated cold-start stability and timing evidence.
          : > "$EVIDENCE/cold-starts.txt"
          for i in 1 2 3 4 5; do
            adb shell am force-stop "$APP_PACKAGE"
            adb shell am start -W -n "$COMPONENT" | tr -d '\r' | tee "$EVIDENCE/cold-start-${i}.txt"
            grep -q 'Status: ok' "$EVIDENCE/cold-start-${i}.txt"
            grep -E '^(ThisTime|TotalTime|WaitTime):' "$EVIDENCE/cold-start-${i}.txt" >> "$EVIDENCE/cold-starts.txt" || true
            assert_foreground
          done

          # Verify platform handlers ProductShot relies on can be resolved. These are evidence
          # probes only; no user data is selected and no photo is captured.
          adb shell cmd package resolve-activity --brief -a android.media.action.IMAGE_CAPTURE > "$EVIDENCE/camera-intent-resolution.txt" 2>&1 || true
          if (( API_LEVEL >= 33 )); then
            adb shell cmd package resolve-activity --brief -a android.provider.action.PICK_IMAGES -t 'image/*' > "$EVIDENCE/photo-picker-resolution.txt" 2>&1 || true
          else
            adb shell cmd package resolve-activity --brief -a android.intent.action.OPEN_DOCUMENT -c android.intent.category.OPENABLE -t 'image/*' > "$EVIDENCE/photo-picker-resolution.txt" 2>&1 || true
          fi

          snapshot final
          adb shell dumpsys activity activities > "$EVIDENCE/activity-final.txt" || true
          adb shell dumpsys meminfo "$APP_PACKAGE" > "$EVIDENCE/meminfo-final.txt" || true
          adb shell dumpsys gfxinfo "$APP_PACKAGE" > "$EVIDENCE/gfxinfo-final.txt" || true
          adb shell dumpsys activity exit-info "$APP_PACKAGE" > "$EVIDENCE/exit-info.txt" 2>&1 || true
          adb logcat -d -v threadtime > "$EVIDENCE/logcat.txt"
          adb logcat -b events -d -v threadtime > "$EVIDENCE/events.txt" || true
          adb shell dumpsys dropbox --print data_app_crash > "$EVIDENCE/dropbox-crash.txt" 2>&1 || true
          adb shell dumpsys dropbox --print data_app_anr > "$EVIDENCE/dropbox-anr.txt" 2>&1 || true

          # Fail the gate on app-specific crash/ANR evidence.
          if grep -E "am_crash.*${APP_PACKAGE}|am_anr.*${APP_PACKAGE}" "$EVIDENCE/events.txt"; then
            echo "ProductShot crash/ANR found in event log" >&2
            exit 1
          fi
          if grep -Fq "Process: ${APP_PACKAGE}" "$EVIDENCE/logcat.txt"; then
            echo "ProductShot fatal process record found in logcat" >&2
            exit 1
          fi
          if grep -Fq "$APP_PACKAGE" "$EVIDENCE/dropbox-crash.txt"; then
            echo "ProductShot crash found in DropBox" >&2
            exit 1
          fi
          if grep -Fq "$APP_PACKAGE" "$EVIDENCE/dropbox-anr.txt"; then
            echo "ProductShot ANR found in DropBox" >&2
            exit 1
          fi

          printf 'api=%s\npackage=%s\nactivity=%s\nresult=PASS\n' "$API_LEVEL" "$APP_PACKAGE" "$APP_ACTIVITY" | tee "$EVIDENCE/result.txt"

      - name: Upload runtime evidence API ${{ matrix.api }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 release line
        with:
          name: productshot-block11-runtime-evidence-api${{ matrix.api }}
          path: ${{ runner.temp }}/block11-evidence-api${{ matrix.api }}/*
          if-no-files-found: warn
          retention-days: 7
