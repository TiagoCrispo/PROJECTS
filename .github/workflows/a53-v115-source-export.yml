name: A53 v1.15 Source Export

on:
  push:
    branches: [a53-work-v1151]
    paths:
      - '.github/workflows/a53-v115-source-export.yml'
  workflow_dispatch:

jobs:
  export-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct verified v1.15 source
        shell: bash
        run: |
          set -euo pipefail
          cat a53v113part-* > source.b64
          test "$(wc -c < source.b64)" -eq 54840
          base64 -d source.b64 > a53v113-source.tar.xz
          echo "2aeec9d8fa486fc7112e9643e0a1628d9d9d9ee85a90dfc80f68cc9d29a0f7ba  a53v113-source.tar.xz" | sha256sum -c -
          tar -xJf a53v113-source.tar.xz

          cat a53v114diff-* > v114diff.b64
          base64 -d v114diff.b64 > v114.diff.xz
          echo "8af44f6f22f7d176638fc92e572022c81fbf324cb117b5ee7cbdb6d98b8c498b  v114.diff.xz" | sha256sum -c -
          xz -dc v114.diff.xz > v114.diff
          patch --batch --forward -p4 -d a53v113 < v114.diff
          mv a53v113 a53v114

          cat a53v1141patch-part-* > v1141patch.b64
          base64 -d v1141patch.b64 > v1141.patch.xz
          xz -dc v1141.patch.xz > v1141.patch
          patch --batch --forward -p1 -d a53v114 < v1141.patch
          mv a53v114 a53v1141

          cat v115part-* > v115.b64
          test "$(wc -c < v115.b64)" -eq 17884
          base64 -d v115.b64 > v115.diff.xz
          echo "7823ced7165575f269992f710a1674ff2a62ff41319e1be160e5989e0c9ba90a  v115.diff.xz" | sha256sum -c -
          xz -dc v115.diff.xz > v115.diff
          patch --batch --forward -p1 -d a53v1141 < v115.diff
          mv a53v1141 a53v115
          grep -q "versionCode 22" a53v115/app/build.gradle
          grep -q "versionName '1.15.0'" a53v115/app/build.gradle
          grep -q "autoAuthorizeShizuku" a53v115/app/src/main/java/com/fer/a53performance/MainActivity.java
          tar -cJf a53v115-source.tar.xz a53v115
          sha256sum a53v115-source.tar.xz > SOURCE_SHA256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.15.0-SOURCE
          retention-days: 1
          path: |
            a53v115-source.tar.xz
            SOURCE_SHA256.txt
          if-no-files-found: error
