name: WA Vault Secure Temporary Build

on:
  push:
    branches:
      - wa-vault-secure-build-20260819
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SOURCE_REF: ${{ github.head_ref || github.ref_name }}

    steps:
      - name: Generate ephemeral encryption key
        shell: bash
        run: |
          set -euo pipefail
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /tmp/wa_private.pem >/dev/null 2>&1
          openssl pkey -in /tmp/wa_private.pem -pubout -out /tmp/wa_public.pem
          echo "WA_VAULT_PUBLIC_KEY_BEGIN"
          base64 -w0 /tmp/wa_public.pem
          echo
          echo "WA_VAULT_PUBLIC_KEY_END"

      - name: Wait for encrypted project payload
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FOUND=0
          for i in $(seq 1 120); do
            if gh api "repos/${GITHUB_REPOSITORY}/contents/.wa-vault-secure/source.enc?ref=${SOURCE_REF}" >/tmp/source_meta.json 2>/dev/null; then
              gh api "repos/${GITHUB_REPOSITORY}/contents/.wa-vault-secure/source.enc?ref=${SOURCE_REF}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/source.enc
              gh api "repos/${GITHUB_REPOSITORY}/contents/.wa-vault-secure/key.enc?ref=${SOURCE_REF}" --jq '.content' | tr -d '\n' | base64 -d > /tmp/key.enc
              FOUND=1
              break
            fi
            sleep 5
          done
          test "$FOUND" = "1"
          test -s /tmp/source.enc
          test -s /tmp/key.enc

          openssl pkeyutl -decrypt \
            -inkey /tmp/wa_private.pem \
            -in /tmp/key.enc \
            -out /tmp/wa_aes.key \
            -pkeyopt rsa_padding_mode:oaep \
            -pkeyopt rsa_oaep_md:sha256

          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
            -in /tmp/source.enc \
            -out /tmp/wa-vault-source.zip \
            -pass file:/tmp/wa_aes.key

          mkdir -p "$RUNNER_TEMP/wa-vault-src"
          unzip -q /tmp/wa-vault-source.zip -d "$RUNNER_TEMP/wa-vault-src"
          test -f "$RUNNER_TEMP/wa-vault-src/WA-Vault/settings.gradle.kts"

          shred -u /tmp/wa_private.pem /tmp/wa_aes.key /tmp/source.enc /tmp/key.enc || true

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'

      - name: Gradle configuration check
        working-directory: ${{ runner.temp }}/wa-vault-src/WA-Vault
        run: gradle --no-daemon help

      - name: Unit tests
        working-directory: ${{ runner.temp }}/wa-vault-src/WA-Vault
        run: gradle --no-daemon testDebugUnitTest

      - name: Android lint
        working-directory: ${{ runner.temp }}/wa-vault-src/WA-Vault
        run: gradle --no-daemon lintDebug

      - name: Assemble debug APK
        working-directory: ${{ runner.temp }}/wa-vault-src/WA-Vault
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-debug-apk
          path: ${{ runner.temp }}/wa-vault-src/WA-Vault/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 1

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-build-reports
          path: |
            ${{ runner.temp }}/wa-vault-src/WA-Vault/app/build/reports/**
            ${{ runner.temp }}/wa-vault-src/WA-Vault/app/build/test-results/**
          if-no-files-found: ignore
          retention-days: 1
