name: A53 v1.15.10 UI Patch
on:
  push:
    branches: [agent/a53-performance-v11510]
    paths: [A53Performance/PATCH_READY_11510]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v11510
      - run: python3 A53Performance/patch11510.py
      - run: |
          git config user.name "Damián Crispo"
          git config user.email "116601726+TiagoCrispo@users.noreply.github.com"
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git commit -m "Apply v1.15.10 device hardening UI"
          git push
