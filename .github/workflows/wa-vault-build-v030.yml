name: WA Vault v0.3.0 build

on:
  push:
    branches: [wa-vault-build-v030]
    paths:
      - 'wa-vault-build/**'
      - '.github/workflows/wa-vault-build-v030.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Verify transport chunks
        run: |
          wc -c wa-vault-build/part-00-0.b64 wa-vault-build/part-00-1.b64 wa-vault-build/part-01.b64 wa-vault-build/part-02.b64 wa-vault-build/part-03-0.b64 wa-vault-build/part-03-1.b64
          echo '1f2f63de628f46f6f20373b90df32ee6e894e56990b1a85cdaefbca4a7af1919  wa-vault-build/part-00-0.b64' | sha256sum -c -
          echo 'a53c9225adca1d3008782e527159bc85aaea1184261772c49a5b6c0b3ea881e6  wa-vault-build/part-00-1.b64' | sha256sum -c -
          echo '0e0c78d0accaaab6a89ae8701e2fbb0b5e46788c90de477fb4735def34107737  wa-vault-build/part-01.b64' | sha256sum -c -
          echo '3850aaf7deced0010dd88159583752d91d1bdcdd9ea0c40b3481b4c91c8476ff  wa-vault-build/part-02.b64' | sha256sum -c -
          echo 'a58acaf6e2c63f80c3e5600af55314b7be9c2c0bdbaf2a1fda32335b1c1a2c02  wa-vault-build/part-03-0.b64' | sha256sum -c -
          echo 'e2eb09215b522e8058f4d9a8594d64378f59e42cf7a528a879956cb1e4513ee2  wa-vault-build/part-03-1.b64' | sha256sum -c -

      - name: Decode project
        run: |
          mkdir -p wa-vault-build/project
          cat \
            wa-vault-build/part-00-0.b64 \
            wa-vault-build/part-00-1.b64 \
            wa-vault-build/part-01.b64 \
            wa-vault-build/part-02.b64 \
            wa-vault-build/part-03-0.b64 \
            wa-vault-build/part-03-1.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          xz -t /tmp/project.tar.xz
          tar -xJf /tmp/project.tar.xz -C wa-vault-build/project

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Verify source invariants
        working-directory: wa-vault-build/project
        run: python3 verify_source.py

      - name: Build debug APK
        working-directory: wa-vault-build/project
        run: gradle :app:assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: WA-Vault-v0.3.0-debug
          path: |
            wa-vault-build/project/app/build/outputs/apk/debug/app-debug.apk
            wa-vault-build/project/ARCHITECTURE.md
            wa-vault-build/project/TEST_MATRIX.md
            wa-vault-build/project/CHANGELOG.md
