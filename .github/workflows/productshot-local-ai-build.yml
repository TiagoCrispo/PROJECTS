name: ProductShot Local AI build

on:
  push:
    branches: [productshot-local-ai]
    paths:
      - 'productshot-local/**'
      - '.github/workflows/productshot-local-ai-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 9.5
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: '9.5.0'
          cache-disabled: true

      - name: Android SDK 36
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Build local APK
        shell: bash
        run: |
          set -euo pipefail
          gradle -p productshot-local :app:clean :app:lintDebug :app:assembleDebug --stacktrace --no-daemon
          APK=productshot-local/app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$APK" | tee /tmp/productshot-local-badging.txt
          grep -q "package: name='com.productshot.local'" /tmp/productshot-local-badging.txt
          grep -q "minSdkVersion:'29'" /tmp/productshot-local-badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/productshot-local-badging.txt
          sha256sum "$APK" | tee /tmp/productshot-local.sha256

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: productshot-local-ai-apk
          path: |
            productshot-local/app/build/outputs/apk/debug/app-debug.apk
            productshot-local/app/build/reports/lint-results-debug.html
            /tmp/productshot-local-badging.txt
            /tmp/productshot-local.sha256
          if-no-files-found: error
          retention-days: 7
