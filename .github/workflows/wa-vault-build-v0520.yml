name: WA Vault v0.5.20 Privacy Durability Final

on:
  push:
    branches: [wa-vault-build-v0520]
    paths:
      - 'wa-vault-build-v0520/**'
      - '.github/workflows/wa-vault-build-v0520.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.19 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0520-project
          gh run download 31922261225 -n WA-Vault-v0.5.19-source -D wa-vault-v0520-project
          grep -q 'versionCode = 69' wa-vault-v0520-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.19"' wa-vault-v0520-project/app/build.gradle.kts

      - name: Apply v0.5.20 hardening and regressions
        run: |
          set -euo pipefail
          git show 70d9242dd1216c517911b5e4328817fc9c874dfc:wa-vault-build-v0520/v0520.patch.gz.b64 | base64 -d | gzip -d > /tmp/v0520.patch
          cd wa-vault-v0520-project
          patch -p1 < /tmp/v0520.patch
          sed -i 's/android\.system\.OsConstants\.O_RDONLY|android\.system\.OsConstants\.O_DIRECTORY/android.system.OsConstants.O_RDONLY/g' app/src/main/java/com/fer/wavault/MediaCrypto.java
          python3 tools/v0520_regression_test.py
          grep -q 'versionCode = 70' app/build.gradle.kts
          grep -q 'versionName = "0.5.20"' app/build.gradle.kts
          test ! -e tools/v0518_regression_test.py
          test ! -e tools/v0519_regression_test.py
          ! grep -R -n -E 'portable_|plainbak|encbak|\.wavb|PortableBackupManager|PORTABLE_BACKUP' app/src/main/java tools

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0520-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore stable signing identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          test -s signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.20
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0520-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0520-output
          PASS="$(cat signing/SIGNING_BACKUP_PASSWORD.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0520-output/WA-Vault-v0.5.20.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0520-output/WA-Vault-v0.5.20.apk > wa-vault-v0520-output/APK_SIGNATURE.txt
          grep -qi 'Verified using v2 scheme.*true' wa-vault-v0520-output/APK_SIGNATURE.txt
          grep -qi 'Verified using v3 scheme.*true' wa-vault-v0520-output/APK_SIGNATURE.txt
          grep -qi '5e142d9605d4d63c8264d013e71a7d5e1aa04ca35438cf973e04c388c85d5be6' wa-vault-v0520-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0520-output/WA-Vault-v0.5.20.apk > wa-vault-v0520-output/APK_SHA256.txt
          cp wa-vault-v0520-project/V0520_NOTES.md wa-vault-v0520-output/
          cp wa-vault-v0520-project/TEST_MATRIX.md wa-vault-v0520-output/
          cp wa-vault-v0520-project/tools/v0520_regression_test.py wa-vault-v0520-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.20-release
          path: |
            wa-vault-v0520-output/WA-Vault-v0.5.20.apk
            wa-vault-v0520-output/APK_SHA256.txt
            wa-vault-v0520-output/APK_SIGNATURE.txt
            wa-vault-v0520-output/V0520_NOTES.md
            wa-vault-v0520-output/TEST_MATRIX.md
            wa-vault-v0520-output/v0520_regression_test.py
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.20-source
          path: wa-vault-v0520-project
          retention-days: 30
