name: ProductShot MagicTouch Model Probe

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/productshot-magictouch-model-probe.yml"
  push:
    branches:
      - productshot-block8-build
    paths:
      - ".github/workflows/productshot-magictouch-model-probe.yml"
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download MediaPipe 0.10.x compatible MagicTouch model
        shell: bash
        run: |
          set -euo pipefail
          URL='https://storage.googleapis.com/mediapipe-models/interactive_segmenter/magic_touch/float32/1/magic_touch.tflite'
          curl --fail --location --retry 3 --retry-delay 2 "$URL" -o magic_touch.tflite
          test -s magic_touch.tflite
          stat -c 'MAGICTOUCH_SIZE_BYTES=%s' magic_touch.tflite
          sha256sum magic_touch.tflite | tee model.sha256
          file magic_touch.tflite

      - name: Upload probe model
        uses: actions/upload-artifact@v4
        with:
          name: MagicTouch-legacy-float32-v1
          path: |
            magic_touch.tflite
            model.sha256
          if-no-files-found: error
