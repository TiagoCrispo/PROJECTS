name: AniFlow RC14 Source Engine 2.0 Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc14-source-engine2
  cancel-in-progress: true

jobs:
  android-rc14-source-engine2:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC14_SOURCE_ENGINE2'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc14-source-engine2

    steps:
      - uses: actions/checkout@v5
      - name: Announce start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC14_SOURCE_ENGINE2_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0", cache-read-only: true }

      - name: Materialize verified RC13
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/rc13-artifact
          mkdir -p "$ANIFLOW_ROOT" /tmp/rc13-artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9419348714/zip" > /tmp/rc13-artifact.zip
          echo "8624e0ef42eb41e7852d955de96337763ae4d5dc0368ba338339e9a846274606  /tmp/rc13-artifact.zip" | sha256sum -c -
          unzip -q /tmp/rc13-artifact.zip -d /tmp/rc13-artifact
          unzip -q /tmp/rc13-artifact/AniFlow-v1.0.12-rc13-source.zip -d "$ANIFLOW_ROOT"
          grep -q 'versionCode = 1000013' "$ANIFLOW_ROOT/app/build.gradle.kts"
          grep -q 'versionName = "1.0.12-rc13"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Apply verified Source Engine 2.0 patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/aniflow-rc14-source-engine2.patch.gz.b64 > /tmp/aniflow-rc14.patch.gz
          echo "a11f1589ab16276e3668636a8a937554d5b72c5701127cc9ba920c4951ee0182  /tmp/aniflow-rc14.patch.gz" | sha256sum -c -
          gzip -dc /tmp/aniflow-rc14.patch.gz > /tmp/aniflow-rc14.patch
          echo "a97db62475e4d0ec2afda0ddc0f811dd28f9a39716ac920e572cd9dae3bb7a5e  /tmp/aniflow-rc14.patch" | sha256sum -c -
          cd "$ANIFLOW_ROOT"
          patch -p1 --forward --batch < /tmp/aniflow-rc14.patch
          grep -q 'versionCode = 1000014' app/build.gradle.kts
          grep -q 'versionName = "1.0.13-rc14"' app/build.gradle.kts
          test -f app/src/main/java/com/aniflow/app/domain/SourceEnginePolicy.kt
          test -f app/src/main/java/com/aniflow/app/data/repository/SourceHealthRegistry.kt
          test -f scripts/validate-block18.py
          python3 scripts/validate-block18.py

      - name: Regression guards Blocks 2-18
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in $(seq 2 18); do test -f "scripts/validate-block${gate}.py"; python3 "scripts/validate-block${gate}.py"; done
          bash scripts/validate-pure-kotlin.sh
          bash scripts/validate-network-kotlin.sh
          bash scripts/validate-data-kotlin.sh
          bash scripts/validate-viewmodels-kotlin.sh
          bash scripts/validate-ui-syntax.sh

      - name: Unit tests and benchmark compile
        run: |
          gradle -p "$ANIFLOW_ROOT" help :app:testDebugUnitTest --stacktrace --no-daemon
          gradle -p "$ANIFLOW_ROOT" :benchmark:assembleProfile :benchmark:assembleBenchmark --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
          STATUS=$?
          find "$ANIFLOW_ROOT/app/build" -iname 'lint-results*.txt' -o -iname 'lint-results*.html' | head -20 || true
          exit "$STATUS"

      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify RC14
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc14.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.13-rc14-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.13-rc14.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-rc14 -keypass aniflow-rc14 -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal RC14, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-rc14 --key-pass pass:aniflow-rc14 --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          unzip -l "$FINAL" | grep -q AndroidManifest.xml
          unzip -l "$FINAL" | grep -q classes.dex
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-rc14"
          mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.13-rc14-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*' 'benchmark/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.13-rc14.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.13-rc14-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          test ! -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" || cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/"

      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.13-rc14-source-engine2-final
          path: ${{ runner.temp }}/aniflow-rc14/*
          if-no-files-found: error
          retention-days: 30

      - name: Announce success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC14_SOURCE_ENGINE2_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.13-rc14-source-engine2-final"
      - name: Announce failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC14_SOURCE_ENGINE2_FAILED run_id=${GITHUB_RUN_ID}"
