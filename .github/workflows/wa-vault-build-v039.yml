name: WA Vault v0.3.9 build

on:
  push:
    branches: [wa-vault-build-v039]
    paths:
      - 'wa-vault-build-v039/**'
      - '.github/workflows/wa-vault-build-v039.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct v0.3.8 base
        shell: bash
        run: |
          set -euo pipefail
          cat wa-vault-build-v032-small/part-000.b64 wa-vault-build-v032-small/part-001.b64 wa-vault-build-v032-small/part-002.b64 wa-vault-build-v032-small/part-003.b64 wa-vault-build-v032-small/part-004.b64 wa-vault-build-v032-small/part-005.b64 wa-vault-build-v032-small/part-006.b64 wa-vault-build-v032-small/part-007a.b64 wa-vault-build-v032-small/part-007b.b64 wa-vault-build-v032-small/part-008a.b64 wa-vault-build-v032-small/part-008b.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          echo 'a5933b2452ec76b37f552a8bb42bb14045de3c3d8b80d5aee27a9526981ac90b  /tmp/project.tar.xz' | sha256sum -c -
          mkdir -p wa-vault-v034-project
          tar -xJf /tmp/project.tar.xz -C wa-vault-v034-project

          cat wa-vault-build-v034/patch-0.b64 wa-vault-build-v034/patch-1.b64 > /tmp/v034.patch.b64
          base64 -d /tmp/v034.patch.b64 > /tmp/v034.patch.xz
          echo 'a0dda46d8de11d2bf341a49a5b4b083fceb7e00701f84b03e4aa5dfef628b9a0  /tmp/v034.patch.xz' | sha256sum -c -
          xz -dc /tmp/v034.patch.xz > /tmp/v034.patch
          cd wa-vault-v034-project
          patch -p4 -F3 --batch < /tmp/v034.patch || true
          cd ..
          python3 wa-vault-build-v034/postfix_v034.py
          rm -f wa-vault-v034-project/app/src/main/java/com/fer/wavault/MainActivity.java.rej
          mv wa-vault-v034-project wa-vault-v039-project

          base64 -d wa-vault-build-v035/patch.b64 > /tmp/v035.patch.xz
          echo '216403d0c4cdea807c20fe088495fa6d49ffaa04f0ffcaa48b39c299f5eaa2f3  /tmp/v035.patch.xz' | sha256sum -c -
          xz -dc /tmp/v035.patch.xz > /tmp/v035.patch
          cd wa-vault-v039-project && patch -p1 --batch < /tmp/v035.patch && cd ..

          base64 -d wa-vault-build-v036/patch.b64 > /tmp/v036.patch.xz
          echo 'a4e2790abb94debe2a9428df4e375e54f32576e70881dbde5e0010a4f2e90aca  /tmp/v036.patch.xz' | sha256sum -c -
          xz -dc /tmp/v036.patch.xz > /tmp/v036.patch
          cd wa-vault-v039-project && patch -p1 --batch < /tmp/v036.patch && cd ..

          cat wa-vault-build-v037/patch-0.b64 wa-vault-build-v037/patch-1.b64 > /tmp/v037.patch.b64
          base64 -d /tmp/v037.patch.b64 > /tmp/v037.patch.xz
          echo '686e85d2c77bf25f3c507a4314bc9011232b5b7eae2d4f48c2e1a26ff13e4e72  /tmp/v037.patch.xz' | sha256sum -c -
          xz -dc /tmp/v037.patch.xz > /tmp/v037.patch
          cd wa-vault-v039-project
          patch -p1 --batch < /tmp/v037.patch || true
          rm -f CHANGELOG.md.rej
          cd ..

          base64 -d wa-vault-build-v037/download-hotfix.b64 > /tmp/v037hotfix.xz
          echo 'c0d55e7f8863b49b583495c7f3e624ce454c7a0c4d182e61a483aa0deafa324e  /tmp/v037hotfix.xz' | sha256sum -c -
          xz -dc /tmp/v037hotfix.xz > /tmp/v037hotfix.patch
          cd wa-vault-v039-project && patch -p1 --batch < /tmp/v037hotfix.patch && cd ..

          cat wa-vault-build-v038/patch-0.b64 wa-vault-build-v038/patch-1.b64 > /tmp/v038.patch.b64
          base64 -d /tmp/v038.patch.b64 > /tmp/v038.patch.xz
          echo 'abd72a21e59df0280a91f80d009c4d87d5b0af0b9f97337b45ed7bcfc808f911  /tmp/v038.patch.xz' | sha256sum -c -
          xz -dc /tmp/v038.patch.xz > /tmp/v038.patch
          cd wa-vault-v039-project && patch -p1 --batch < /tmp/v038.patch && cd ..
          grep -q 'versionCode = 38' wa-vault-v039-project/app/build.gradle.kts

      - name: Apply v0.3.9 Fast Capture patch
        shell: bash
        run: |
          set -euo pipefail
          cat wa-vault-build-v039/patch-00.b64 wa-vault-build-v039/patch-01.b64 wa-vault-build-v039/patch-02.b64 wa-vault-build-v039/patch-03.b64 > /tmp/v039.patch.b64
          base64 -d /tmp/v039.patch.b64 > /tmp/v039.patch.xz
          echo '5f675ca032e7c7a530bb28abf820261ffb73ad708b34af27bb97b0b891eedb1d  /tmp/v039.patch.xz' | sha256sum -c -
          xz -dc /tmp/v039.patch.xz > /tmp/v039.patch
          cd wa-vault-v039-project
          patch -p1 --batch < /tmp/v039.patch || true
          find app -name '*.rej' -print -quit | grep -q . && { echo 'Java/app patch reject found'; find app -name '*.rej' -print; exit 1; } || true
          rm -f BUILD_INFO.md.rej CHANGELOG.md.rej README.md.rej V039_NOTES.md.rej
          grep -q 'versionCode = 39' app/build.gradle.kts
          grep -q 'versionName = "0.3.9"' app/build.gradle.kts
          test -f app/src/main/java/com/fer/wavault/FastCaptureEngine.java
          test -f app/src/main/java/com/fer/wavault/CaptureProcessingEngine.java
          test -f app/src/main/java/com/fer/wavault/MediaValidation.java
          grep -q 'super(c, "wa_vault.db", null, 9)' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'capture_attempts' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'FastCaptureEngine.captureFromFileEvent' app/src/main/java/com/fer/wavault/DirectMediaWatcher.java
          grep -q 'startExtreme60s' app/src/main/java/com/fer/wavault/CaptureMetrics.java

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build release
        working-directory: wa-vault-v039-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Prepare artifact
        shell: bash
        run: |
          APK=wa-vault-v039-project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          sha256sum "$APK" > wa-vault-v039-project/APK_SHA256.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" wa-vault-v039-project/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.3.9-unsigned
          path: |
            wa-vault-v039-project/app/build/outputs/apk/release/app-release-unsigned.apk
            wa-vault-v039-project/apksigner.jar
            wa-vault-v039-project/APK_SHA256.txt
