name: WA Vault v0.5.0 build

on:
  push:
    branches: [wa-vault-build-v050]
    paths:
      - 'wa-vault-build-v050/**'
      - '.github/workflows/wa-vault-build-v050.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.4.1 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v050-project
          gh run download 31870756048 -n WA-Vault-v0.4.1-source -D wa-vault-v050-project
          grep -q 'versionCode = 41' wa-vault-v050-project/app/build.gradle.kts
          grep -q 'versionName = "0.4.1"' wa-vault-v050-project/app/build.gradle.kts

      - name: Apply verified v0.5.0 patch
        run: |
          set -euo pipefail
          cat wa-vault-build-v050/patch-00.b64 wa-vault-build-v050/patch-01.b64 wa-vault-build-v050/patch-02.b64 wa-vault-build-v050/patch-03.b64 wa-vault-build-v050/patch-04.b64 wa-vault-build-v050/patch-05.b64 wa-vault-build-v050/patch-06.b64 wa-vault-build-v050/patch-07.b64 > /tmp/v050.patch.b64
          base64 -d /tmp/v050.patch.b64 > /tmp/v050.patch.xz
          echo '98ecd6d1baa35a823286a947b270bc84fa67f00c6abdca54ef13098d6b34cf74  /tmp/v050.patch.xz' | sha256sum -c -
          xz -dc /tmp/v050.patch.xz > /tmp/v050.patch
          cd wa-vault-v050-project
          patch -p1 --batch < /tmp/v050.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 50' app/build.gradle.kts
          grep -q 'versionName = "0.5.0"' app/build.gradle.kts
          grep -q 'super(c, "wa_vault.db", null, 12)' app/src/main/java/com/fer/wavault/VaultDb.java
          test -s app/src/main/java/com/fer/wavault/RecoveryCenterAdapter.java
          test -s app/src/main/java/com/fer/wavault/PortableBackupManager.java

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v050-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore v0.4.0 signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.0
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v050-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v050-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v050-output/WA-Vault-v0.5.0.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v050-output/WA-Vault-v0.5.0.apk > wa-vault-v050-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v050-output/WA-Vault-v0.5.0.apk > wa-vault-v050-output/APK_SHA256.txt
          cp wa-vault-v050-project/V050_NOTES.md wa-vault-v050-output/
          cp wa-vault-v050-project/TEST_MATRIX.md wa-vault-v050-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.0-release
          path: |
            wa-vault-v050-output/WA-Vault-v0.5.0.apk
            wa-vault-v050-output/APK_SHA256.txt
            wa-vault-v050-output/APK_SIGNATURE.txt
            wa-vault-v050-output/V050_NOTES.md
            wa-vault-v050-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.0-source
          path: wa-vault-v050-project
          retention-days: 30
