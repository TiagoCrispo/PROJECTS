name: ProductShot Block 12 bounded network fix

on:
  pull_request:
    branches: [main]
    paths:
      - ".ci/productshot-block11-runtime-fix/apply_bounded_network_fix.py"
      - ".github/workflows/productshot-block12-network-fix.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c
        with:
          gradle-version: "9.5.0"
          cache-disabled: true
      - name: Reconstruct exact source and apply fixes
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$RUNNER_TEMP/productshot-block12-base.tar.gz"
          PROJECT="$RUNNER_TEMP/productshot-block12"
          cat .ci/productshot-rc1-exact/android.tar.gz.b64.x* | tr -d '\r\n' | base64 -d > "$ARCHIVE"
          echo "0108434bf6b1f4f37e745ac35878e909be4b42e8d38dfd27c3aedde698e2f573  $ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT"
          tar -xzf "$ARCHIVE" -C "$PROJECT"
          patch -d "$PROJECT" -p1 --batch --forward < .ci/productshot-rc1-remediation/warning-remediation.patch
          (cd "$PROJECT" && sha256sum -c "$GITHUB_WORKSPACE/.ci/productshot-rc1-remediation/source.sha256")
          SRC="$PROJECT/app/src/main/java/com/productshot/app/MainActivity.java"
          python3 .ci/productshot-block11-runtime-fix/apply_android35_insets_fix.py "$SRC" | tee "$RUNNER_TEMP/block12-source-fix.txt"
          python3 .ci/productshot-block11-runtime-fix/apply_bounded_network_fix.py "$SRC" | tee -a "$RUNNER_TEMP/block12-source-fix.txt"
          grep -q 'MAX_CREATE_NETWORK_FAILURES = 3' "$SRC"
          grep -q 'DEFAULT_API_BASE.contains(".invalid")' "$SRC"
          grep -q 'networkFailures >= MAX_CREATE_NETWORK_FAILURES' "$SRC"
          test "$(grep -c 'main.postDelayed(this::startJob, delay)' "$SRC")" -eq 1
          sha256sum "$SRC" | tee -a "$RUNNER_TEMP/block12-source-fix.txt"
      - name: Ensure Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
      - name: Lint and build optimized RC
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/productshot-block12"
          gradle -p "$PROJECT" :app:clean :app:lintRc :app:assembleRc --stacktrace --no-daemon
          APK="$PROJECT/app/build/outputs/apk/rc/app-rc.apk"
          test -s "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/block12-badging.txt"
          grep -q "package: name='com.productshot.app.rc'" "$RUNNER_TEMP/block12-badging.txt"
          grep -q "minSdkVersion:'29'" "$RUNNER_TEMP/block12-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/block12-badging.txt"
          mkdir -p "$RUNNER_TEMP/block12-artifact"
          cp "$APK" "$RUNNER_TEMP/block12-artifact/ProductShot-v0.1.0-rc1-Block12-network-fix.apk"
          cp "$RUNNER_TEMP/block12-badging.txt" "$RUNNER_TEMP/block12-artifact/"
          cp "$RUNNER_TEMP/block12-source-fix.txt" "$RUNNER_TEMP/block12-artifact/"
          if [[ -f "$PROJECT/app/build/reports/lint-results-rc.txt" ]]; then cp "$PROJECT/app/build/reports/lint-results-rc.txt" "$RUNNER_TEMP/block12-artifact/"; fi
          if [[ -f "$PROJECT/app/build/reports/lint-results.txt" ]]; then cp "$PROJECT/app/build/reports/lint-results.txt" "$RUNNER_TEMP/block12-artifact/"; fi
          sha256sum "$RUNNER_TEMP/block12-artifact/ProductShot-v0.1.0-rc1-Block12-network-fix.apk" | tee "$RUNNER_TEMP/block12-artifact/ProductShot-v0.1.0-rc1-Block12-network-fix.sha256"
      - name: Upload corrected APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: productshot-block12-network-fix
          path: ${{ runner.temp }}/block12-artifact/*
          if-no-files-found: error
          retention-days: 7
