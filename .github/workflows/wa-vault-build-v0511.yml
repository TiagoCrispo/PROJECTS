name: WA Vault v0.5.11 mixed deletion cohort fix

on:
  push:
    branches: [wa-vault-build-v0511]
    paths:
      - 'wa-vault-build-v0511/**'
      - '.github/workflows/wa-vault-build-v0511.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.10 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0511-project
          gh run download 31907776310 -n WA-Vault-v0.5.10-source -D wa-vault-v0511-project
          grep -q 'versionCode = 60' wa-vault-v0511-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.10"' wa-vault-v0511-project/app/build.gradle.kts

      - name: Apply verified v0.5.11 patch
        run: |
          set -euo pipefail
          gzip -dc wa-vault-build-v0511/full.patch.gz > /tmp/v0511.patch
          echo '9633a8f7332c3f40da0656cfbfdf2db6a28a0c7a8066541eb0661db2c3425837  /tmp/v0511.patch' | sha256sum -c -
          cd wa-vault-v0511-project
          patch -p1 --batch < /tmp/v0511.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 61' app/build.gradle.kts
          grep -q 'versionName = "0.5.11"' app/build.gradle.kts
          grep -q 'DELETE_MIXED_COHORT_EXPANDED' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'MIXED_BACKFILL_MAX_GAP_MS = 35_000L' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'MIXED_BACKFILL_MAX_SPAN_MS = 120_000L' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'listConfirmedDeletedMessages' app/src/main/java/com/fer/wavault/MainActivity.java
          grep -q 'MENSAJE BORRADO' app/src/main/java/com/fer/wavault/MainActivity.java
          test -s V0511_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0511-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.11
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0511-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0511-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0511-output/WA-Vault-v0.5.11.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0511-output/WA-Vault-v0.5.11.apk > wa-vault-v0511-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0511-output/WA-Vault-v0.5.11.apk > wa-vault-v0511-output/APK_SHA256.txt
          cp wa-vault-v0511-project/V0511_NOTES.md wa-vault-v0511-output/
          cp wa-vault-v0511-project/TEST_MATRIX.md wa-vault-v0511-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.11-release
          path: |
            wa-vault-v0511-output/WA-Vault-v0.5.11.apk
            wa-vault-v0511-output/APK_SHA256.txt
            wa-vault-v0511-output/APK_SIGNATURE.txt
            wa-vault-v0511-output/V0511_NOTES.md
            wa-vault-v0511-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.11-source
          path: wa-vault-v0511-project
          retention-days: 30
