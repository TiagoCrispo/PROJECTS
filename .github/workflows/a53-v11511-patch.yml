name: A53 v1.15.11 Source Patch
on:
  push:
    branches: [agent/a53-performance-v11511]
    paths: [A53Performance/PATCH_READY_11511]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v11511
      - name: Apply source patch
        run: python3 A53Performance/tools/patch_v11511.py
      - name: Commit patched source
        run: |
          printf '%s\n' 'build v1.15.11 safe cleaner visual accuracy' > A53Performance/BUILD_READY_11511
          git config user.name "Damián Crispo"
          git config user.email "116601726+TiagoCrispo@users.noreply.github.com"
          git add A53Performance/app A53Performance/BUILD_READY_11511
          git commit -m "Apply A53 Performance v1.15.11 hardening"
          git push
