name: WA Vault v0.5.13 mixed-media regression fix

on:
  push:
    branches: [wa-vault-build-v0513]
    paths:
      - 'wa-vault-v0513.patch.gz.b64'
      - '.github/workflows/wa-vault-build-v0513.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.12 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0513-project
          gh run download 31910460947 -n WA-Vault-v0.5.12-source -D wa-vault-v0513-project
          grep -q 'versionCode = 62' wa-vault-v0513-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.12"' wa-vault-v0513-project/app/build.gradle.kts

      - name: Apply and test v0.5.13 patch
        run: |
          set -euo pipefail
          tr -d '\r\n' < wa-vault-v0513.patch.gz.b64 | base64 -d | gzip -dc > /tmp/v0513.patch
          echo '0a0ba0726002b3223dc2032c8b4d5f9a91e871bbfd2d7585e81747d2d6a08fa0  /tmp/v0513.patch' | sha256sum -c -
          cd wa-vault-v0513-project
          patch -p1 --batch < /tmp/v0513.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'versionName = "0.5.13"' app/build.gradle.kts
          python3 - <<'PY'
          from pathlib import Path
          root=Path('.')
          listener=(root/'app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java').read_text()
          media=(root/'app/src/main/java/com/fer/wavault/MediaArchiver.java').read_text()
          db=(root/'app/src/main/java/com/fer/wavault/VaultDb.java').read_text()
          assert 'if(armCapture && !mediaKind.isEmpty())' in listener
          assert 'long linkId = newestAudioMessageId > 0 ? newestAudioMessageId : 0L;' in listener
          assert 'db.isMessageConfirmedDeleted(m.linkedMessageId)' in media
          assert 'finalizePendingForConfirmedMessage' in db
          msgs=[('aa','text',1000),('bb','text',2000),('cc','text',3000),('foto','image',4000),('video','video',5000),('audio1','audio',6000),('audio2','audio',7000)]
          rows=[['image',4100,None],['video',5050,None],['audio',6080,None],['audio',7090,None]]
          for name,kind,t in reversed(msgs):
              if kind=='text': continue
              cand=[r for r in rows if r[0]==kind and r[2] is None and abs(r[1]-t)<=10000]
              cand.sort(key=lambda r: abs(r[1]-t))
              assert cand, (name,'missing')
              if len(cand)>1:
                  d0=abs(cand[0][1]-t); d1=abs(cand[1][1]-t)
                  assert d0<=2500 and d1-d0>=700,(name,d0,d1)
              cand[0][2]=name
          assert {r[2] for r in rows}=={'foto','video','audio1','audio2'}
          print('v0.5.13 mixed-media regression: PASS')
          PY

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0513-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.13
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0513-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0513-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0513-output/WA-Vault-v0.5.13.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0513-output/WA-Vault-v0.5.13.apk > wa-vault-v0513-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0513-output/WA-Vault-v0.5.13.apk > wa-vault-v0513-output/APK_SHA256.txt
          cat > wa-vault-v0513-output/V0513_NOTES.md <<'EOF'
          # WA Vault v0.5.13
          - Fix mixed-media regression from v0.5.12.
          - Only DELETE_CONFIRMED can release quarantined media.
          - Text messages no longer arm generic media capture.
          - Early audio never falls back to a text message.
          - Confirmed deletion performs a final conservative reconciliation for preserved image/video/audio.
          EOF

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.13-release
          path: |
            wa-vault-v0513-output/WA-Vault-v0.5.13.apk
            wa-vault-v0513-output/APK_SHA256.txt
            wa-vault-v0513-output/APK_SIGNATURE.txt
            wa-vault-v0513-output/V0513_NOTES.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.13-source
          path: wa-vault-v0513-project
          retention-days: 30
