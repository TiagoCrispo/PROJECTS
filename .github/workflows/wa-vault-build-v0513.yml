name: WA Vault v0.5.13 mixed-media regression fix

on:
  push:
    branches: [wa-vault-build-v0513]
    paths:
      - 'wa-vault-v0513.patch.gz.b64'
      - '.github/workflows/wa-vault-build-v0513.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.12 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0513-project
          gh run download 31910460947 -n WA-Vault-v0.5.12-source -D wa-vault-v0513-project
          grep -q 'versionCode = 62' wa-vault-v0513-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.12"' wa-vault-v0513-project/app/build.gradle.kts

      - name: Apply and test v0.5.13 patch
        run: |
          set -euo pipefail
          tr -d '\r\n' < wa-vault-v0513.patch.gz.b64 | base64 -d | gzip -dc > /tmp/v0513.patch
          echo '0a0ba0726002b3223dc2032c8b4d5f9a91e871bbfd2d7585e81747d2d6a08fa0  /tmp/v0513.patch' | sha256sum -c -
          cd wa-vault-v0513-project
          patch -p1 --batch < /tmp/v0513.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 63' app/build.gradle.kts
          grep -q 'versionName = "0.5.13"' app/build.gradle.kts
          python3 tools/v0513_regression_test.py

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0513-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.13
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0513-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0513-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0513-output/WA-Vault-v0.5.13.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0513-output/WA-Vault-v0.5.13.apk > wa-vault-v0513-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0513-output/WA-Vault-v0.5.13.apk > wa-vault-v0513-output/APK_SHA256.txt
          cp wa-vault-v0513-project/V0513_NOTES.md wa-vault-v0513-output/
          cp wa-vault-v0513-project/tools/v0513_regression_test.py wa-vault-v0513-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.13-release
          path: |
            wa-vault-v0513-output/WA-Vault-v0.5.13.apk
            wa-vault-v0513-output/APK_SHA256.txt
            wa-vault-v0513-output/APK_SIGNATURE.txt
            wa-vault-v0513-output/V0513_NOTES.md
            wa-vault-v0513-output/v0513_regression_test.py
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.13-source
          path: wa-vault-v0513-project
          retention-days: 30
