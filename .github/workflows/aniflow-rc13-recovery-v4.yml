name: AniFlow RC13 Recovered PLAYER-X10 V4

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc13-recovery-v4
  cancel-in-progress: true

jobs:
  android-rc13-recovery-v4:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC13_RECOVERY_V4'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc13-recovery-v4

    steps:
      - uses: actions/checkout@v5
      - name: Announce start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_RECOVERY_V4_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0", cache-read-only: true }

      - name: Materialize verified RC8
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/rc8-artifact-v4
          mkdir -p "$ANIFLOW_ROOT" /tmp/rc8-artifact-v4
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9375678214/zip" > /tmp/rc8-artifact-v4.zip
          echo "67075e5eda087f82ad5e871947e02c5cf59e75ebea63e183e6c2e6dd1b8e936d  /tmp/rc8-artifact-v4.zip" | sha256sum -c -
          unzip -q /tmp/rc8-artifact-v4.zip -d /tmp/rc8-artifact-v4
          unzip -q /tmp/rc8-artifact-v4/AniFlow-v1.0.7-rc8-source.zip -d "$ANIFLOW_ROOT"
          grep -q 'versionName = "1.0.7-rc8"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Apply verified RC9 and RC10
        shell: bash
        run: |
          set -euo pipefail
          cat .ci/rc9v4/part01.b64 | base64 -d | gzip -dc > /tmp/aniflow-rc9-v4.patch
          echo "03f194e7bb0990fcfab591233ad140ee8d1a36e795e3f3214da7f5f450609736  /tmp/aniflow-rc9-v4.patch" | sha256sum -c -
          cd "$ANIFLOW_ROOT"
          patch -p1 --forward --batch < /tmp/aniflow-rc9-v4.patch
          cd "$GITHUB_WORKSPACE"
          cat .ci/rc10/part01.b64 .ci/rc10/part02.b64 | base64 -d | gzip -dc > /tmp/aniflow-rc10-v4.patch
          echo "5d961aa778892658c05122be7d0ccec7ece798ba399ef64d8f7941531d36320c  /tmp/aniflow-rc10-v4.patch" | sha256sum -c -
          cd "$ANIFLOW_ROOT"
          patch -p1 --forward --batch < /tmp/aniflow-rc10-v4.patch
          grep -q 'versionName = "1.0.9-rc10"' app/build.gradle.kts
          grep -q 'onRenderedFirstFrame' app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt

      - name: Recover 1080p intelligence and native PLAYER-X10
        shell: bash
        run: |
          set -euo pipefail
          cd "$GITHUB_WORKSPACE"
          python3 tools/aniflow_rc11_recovery.py "$ANIFLOW_ROOT"
          python3 tools/aniflow_rc13_recovery_patch_v4.py "$ANIFLOW_ROOT"
          grep -q 'versionCode = 1000013' "$ANIFLOW_ROOT/app/build.gradle.kts"
          grep -q 'versionName = "1.0.12-rc13"' "$ANIFLOW_ROOT/app/build.gradle.kts"
          ! grep -R -q 'WebView(\|WebViewClient\|WebChromeClient\|\.loadUrl(\|evaluateJavascript(' "$ANIFLOW_ROOT/app/src/main/java"
          grep -q 'actualVideoBitrate = measured?.bitrate' "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt"
          grep -q 'Siguiente episodio en' "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt"

      - name: Regression guards Blocks 2-17
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in $(seq 2 17); do test -f "scripts/validate-block${gate}.py"; python3 "scripts/validate-block${gate}.py"; done
          bash scripts/validate-pure-kotlin.sh
          bash scripts/validate-network-kotlin.sh
          bash scripts/validate-data-kotlin.sh
          bash scripts/validate-viewmodels-kotlin.sh
          bash scripts/validate-ui-syntax.sh

      - name: Unit tests and benchmark compile
        run: |
          gradle -p "$ANIFLOW_ROOT" help :app:testDebugUnitTest --stacktrace --no-daemon
          gradle -p "$ANIFLOW_ROOT" :benchmark:assembleProfile :benchmark:assembleBenchmark --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
          STATUS=$?
          find "$ANIFLOW_ROOT/app/build" -iname 'lint-results*.txt' -o -iname 'lint-results*.html' | head -20 || true
          exit "$STATUS"

      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify RC13
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc13-v4.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.12-rc13-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.12-rc13.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-rc13-v4 -keypass aniflow-rc13-v4 -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal RC13, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-rc13-v4 --key-pass pass:aniflow-rc13-v4 --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          unzip -l "$FINAL" | grep -q AndroidManifest.xml
          unzip -l "$FINAL" | grep -q classes.dex
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-rc13-v4"
          mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.12-rc13-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*' 'benchmark/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.12-rc13.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.12-rc13-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          test ! -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" || cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/"

      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.12-rc13-recovered-v4-final
          path: ${{ runner.temp }}/aniflow-rc13-v4/*
          if-no-files-found: error
          retention-days: 30

      - name: Announce success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_RECOVERY_V4_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.12-rc13-recovered-v4-final"
      - name: Announce failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_RECOVERY_V4_FAILED run_id=${GITHUB_RUN_ID}"
