name: FurnitureShot AI v0.8.1 hotfix1

on:
  pull_request:
    paths:
      - "projects/furnitureshot-ai-overlays/v0.8.1-hotfix1/**"
      - ".github/workflows/furnitureshot-ai-hotfix.yml"
  workflow_dispatch:

jobs:
  build-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Assemble hotfix source tree
        shell: bash
        run: |
          set -euo pipefail
          BUILD_DIR="$RUNNER_TEMP/furnitureshot-ai-hotfix"
          cp -a projects/furnitureshot-ai "$BUILD_DIR"
          PROCESSING="$BUILD_DIR/app/src/main/java/com/tiagocrispo/furnitureshot/processing"
          BETA22="projects/furnitureshot-ai-overlays/v0.7.1-beta22"
          BETA23="projects/furnitureshot-ai-overlays/v0.7.2-beta23"

          rm -f "$PROCESSING/HighFidelityEnhancementEngine.kt"
          cp "$BETA22/LocalEnhancementEngine.kt" "$PROCESSING/LocalEnhancementEngine.kt"
          cp "$BETA22/FinishPassEngine.kt" "$PROCESSING/FinishPassEngine.kt"
          cp "$BETA22/PromptPolicy.kt" "$PROCESSING/PromptPolicy.kt"
          python3 "$BETA23/transform_beta22_to_beta23.py" "$PROCESSING/LocalEnhancementEngine.kt"
          cp "$BETA23/PromptPolicy.kt" "$PROCESSING/PromptPolicy.kt"

          PATCH_B64="$RUNNER_TEMP/final.patch.b64"
          PATCH_FILE="$RUNNER_TEMP/final.patch"
          cat projects/furnitureshot-ai-overlays/v0.8.0-final/patch-b64/chunk*.txt > "$PATCH_B64"
          base64 -d "$PATCH_B64" > "$PATCH_FILE"
          patch --batch --forward -p1 -d "$BUILD_DIR" < "$PATCH_FILE"

          python3 projects/furnitureshot-ai-overlays/v0.8.1-hotfix1/runtime_hotfix.py "$PROCESSING/LocalEnhancementEngine.kt"

          python3 - "$BUILD_DIR/app/build.gradle.kts" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          text = path.read_text()
          text = re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 41', text)
          text = re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "0.8.1-hotfix1"', text)
          path.write_text(text)
          PY

      - name: Runtime regression guards
        shell: bash
        run: |
          set -euo pipefail
          SRC="$RUNNER_TEMP/furnitureshot-ai-hotfix/app/src/main/java/com/tiagocrispo/furnitureshot/processing/LocalEnhancementEngine.kt"
          grep -q "for (y in 3 until height - 3)" "$SRC"
          grep -q "for (x in 3 until width - 3)" "$SRC"
          ! grep -q "in 193..256 -> 3600" "$SRC"
          grep -q "in 193..256 -> 2600" "$SRC"
          grep -q "Final experimental refiners must never make the whole photo fail" "$SRC"
          grep -q "SEGMENTATION_LONG_EDGE = 1792" "$SRC"
          ! grep -q "drawOval" "$SRC"

      - name: Build debug APK
        run: gradle -p "$RUNNER_TEMP/furnitureshot-ai-hotfix" :app:assembleDebug --stacktrace --no-daemon

      - name: Verify APK
        shell: bash
        run: |
          set -euo pipefail
          APK="$RUNNER_TEMP/furnitureshot-ai-hotfix/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q "AndroidManifest.xml"
          unzip -l "$APK" | grep -q "classes.dex"
          unzip -l "$APK" | grep -q "resources.arsc"
          sha256sum "$APK" | tee "$RUNNER_TEMP/furnitureshot-ai-hotfix/apk-sha256.txt"

      - name: Package source
        shell: bash
        run: |
          cd "$RUNNER_TEMP/furnitureshot-ai-hotfix"
          zip -qr "$RUNNER_TEMP/FurnitureShotAI-v0.8.1-hotfix1-source.zip" . -x 'app/build/*' '.gradle/*' '.kotlin/*'

      - name: Stage deliverables
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/hotfix-deliverables"
          cp "$RUNNER_TEMP/furnitureshot-ai-hotfix/app/build/outputs/apk/debug/app-debug.apk" "$RUNNER_TEMP/hotfix-deliverables/FurnitureShotAI-v0.8.1-hotfix1.apk"
          cp "$RUNNER_TEMP/FurnitureShotAI-v0.8.1-hotfix1-source.zip" "$RUNNER_TEMP/hotfix-deliverables/"
          cp "$RUNNER_TEMP/furnitureshot-ai-hotfix/apk-sha256.txt" "$RUNNER_TEMP/hotfix-deliverables/"

      - name: Upload hotfix deliverables
        uses: actions/upload-artifact@v4
        with:
          name: FurnitureShotAI-v0.8.1-hotfix1
          path: ${{ runner.temp }}/hotfix-deliverables/*
          if-no-files-found: error
