name: WA Vault v0.4.0 build

on:
  push:
    branches: [wa-vault-build-v040]
    paths:
      - 'wa-vault-build-v040/**'
      - '.github/workflows/wa-vault-build-v040.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct v0.3.9 base
        shell: bash
        run: |
          set -euo pipefail
          cat wa-vault-build-v032-small/part-000.b64 wa-vault-build-v032-small/part-001.b64 wa-vault-build-v032-small/part-002.b64 wa-vault-build-v032-small/part-003.b64 wa-vault-build-v032-small/part-004.b64 wa-vault-build-v032-small/part-005.b64 wa-vault-build-v032-small/part-006.b64 wa-vault-build-v032-small/part-007a.b64 wa-vault-build-v032-small/part-007b.b64 wa-vault-build-v032-small/part-008a.b64 wa-vault-build-v032-small/part-008b.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          echo 'a5933b2452ec76b37f552a8bb42bb14045de3c3d8b80d5aee27a9526981ac90b  /tmp/project.tar.xz' | sha256sum -c -
          mkdir -p wa-vault-v034-project
          tar -xJf /tmp/project.tar.xz -C wa-vault-v034-project

          cat wa-vault-build-v034/patch-0.b64 wa-vault-build-v034/patch-1.b64 > /tmp/v034.patch.b64
          base64 -d /tmp/v034.patch.b64 > /tmp/v034.patch.xz
          xz -dc /tmp/v034.patch.xz > /tmp/v034.patch
          cd wa-vault-v034-project
          patch -p4 -F3 --batch < /tmp/v034.patch || true
          cd ..
          python3 wa-vault-build-v034/postfix_v034.py
          rm -f wa-vault-v034-project/app/src/main/java/com/fer/wavault/MainActivity.java.rej
          mv wa-vault-v034-project wa-vault-v040-project

          base64 -d wa-vault-build-v035/patch.b64 > /tmp/v035.patch.xz
          xz -dc /tmp/v035.patch.xz > /tmp/v035.patch
          cd wa-vault-v040-project && patch -p1 --batch < /tmp/v035.patch && cd ..

          base64 -d wa-vault-build-v036/patch.b64 > /tmp/v036.patch.xz
          xz -dc /tmp/v036.patch.xz > /tmp/v036.patch
          cd wa-vault-v040-project && patch -p1 --batch < /tmp/v036.patch && cd ..

          cat wa-vault-build-v037/patch-0.b64 wa-vault-build-v037/patch-1.b64 > /tmp/v037.patch.b64
          base64 -d /tmp/v037.patch.b64 > /tmp/v037.patch.xz
          xz -dc /tmp/v037.patch.xz > /tmp/v037.patch
          cd wa-vault-v040-project
          patch -p1 --batch < /tmp/v037.patch || true
          rm -f CHANGELOG.md.rej
          cd ..

          base64 -d wa-vault-build-v037/download-hotfix.b64 > /tmp/v037hotfix.xz
          xz -dc /tmp/v037hotfix.xz > /tmp/v037hotfix.patch
          cd wa-vault-v040-project && patch -p1 --batch < /tmp/v037hotfix.patch && cd ..

          cat wa-vault-build-v038/patch-0.b64 wa-vault-build-v038/patch-1.b64 > /tmp/v038.patch.b64
          base64 -d /tmp/v038.patch.b64 > /tmp/v038.patch.xz
          xz -dc /tmp/v038.patch.xz > /tmp/v038.patch
          cd wa-vault-v040-project && patch -p1 --batch < /tmp/v038.patch && cd ..

          cat wa-vault-build-v039/patch-00.b64 wa-vault-build-v039/patch-01.b64 wa-vault-build-v039/patch-02.b64 wa-vault-build-v039/patch-03.b64 > /tmp/v039.patch.b64
          base64 -d /tmp/v039.patch.b64 > /tmp/v039.patch.xz
          xz -dc /tmp/v039.patch.xz > /tmp/v039.patch
          cd wa-vault-v040-project
          patch -p1 --batch < /tmp/v039.patch || true
          find app -name '*.rej' -print -quit | grep -q . && { find app -name '*.rej' -print; exit 1; } || true
          rm -f BUILD_INFO.md.rej CHANGELOG.md.rej README.md.rej V039_NOTES.md.rej
          grep -q 'versionCode = 39' app/build.gradle.kts

      - name: Apply v0.4.0 Recovery Center patch
        shell: bash
        run: |
          set -euo pipefail
          cat wa-vault-build-v040/patch-00.b64 wa-vault-build-v040/patch-01.b64 wa-vault-build-v040/patch-02.b64 wa-vault-build-v040/patch-03.b64 > /tmp/v040.patch.b64
          base64 -d /tmp/v040.patch.b64 > /tmp/v040.patch.xz
          echo '214fa8fc4739a0f9b17f3274975c4a69423ca4e182d75ef3cac5e88d67375713  /tmp/v040.patch.xz' | sha256sum -c -
          xz -dc /tmp/v040.patch.xz > /tmp/v040.patch
          cd wa-vault-v040-project
          patch -p1 --batch < /tmp/v040.patch
          find app -name '*.rej' -print -quit | grep -q . && { echo 'Patch reject'; find app -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 40' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          grep -q 'super(c, "wa_vault.db", null, 10)' app/src/main/java/com/fer/wavault/VaultDb.java
          test -f app/src/main/java/com/fer/wavault/RecoveryLedger.java
          test -f app/src/main/java/com/fer/wavault/RecoveryScanner.java
          test -f app/src/main/java/com/fer/wavault/StorageAnalyzer.java

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v040-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Sign v0.4.0
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v040-project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          mkdir -p wa-vault-v040-output
          KEYSTORE=wa-vault-v040-output/WA-Vault-v0.4.0-signing-backup.jks
          PASS="WAVault-v040-2026"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass "$PASS" -keypass "$PASS" -alias wavault -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=WA Vault, OU=Personal, O=WA Vault, L=Mendoza, C=AR"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign --ks "$KEYSTORE" --ks-key-alias wavault --ks-pass pass:"$PASS" --key-pass pass:"$PASS" --out wa-vault-v040-output/WA-Vault-v0.4.0.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v040-output/WA-Vault-v0.4.0.apk > wa-vault-v040-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v040-output/WA-Vault-v0.4.0.apk > wa-vault-v040-output/APK_SHA256.txt
          printf '%s\n' "$PASS" > wa-vault-v040-output/SIGNING_BACKUP_PASSWORD.txt
          cp wa-vault-v040-project/V040_NOTES.md wa-vault-v040-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.4.0-release
          path: |
            wa-vault-v040-output/WA-Vault-v0.4.0.apk
            wa-vault-v040-output/APK_SHA256.txt
            wa-vault-v040-output/APK_SIGNATURE.txt
            wa-vault-v040-output/V040_NOTES.md

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.4.0-signing-backup
          path: |
            wa-vault-v040-output/WA-Vault-v0.4.0-signing-backup.jks
            wa-vault-v040-output/SIGNING_BACKUP_PASSWORD.txt
          retention-days: 90
