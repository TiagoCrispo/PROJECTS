name: WA Vault v0.5.15 compile diagnostic

on:
  push:
    branches: [wa-vault-build-v0515]
    paths:
      - '.github/workflows/wa-vault-v0515-diagnostic.yml'

permissions:
  contents: read
  actions: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore and patch v0.5.15
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0515-project
          gh run download 31915356284 -n WA-Vault-v0.5.14-source -D wa-vault-v0515-project
          cat wa-vault-build-v0515/bin/part00 wa-vault-build-v0515/bin/part01 wa-vault-build-v0515/bin/part02 wa-vault-build-v0515/bin/part03 wa-vault-build-v0515/bin/part04 wa-vault-build-v0515/bin/part05 wa-vault-build-v0515/bin/part06 > /tmp/v0515.patch.gz
          echo 'a79851c70e0a52e166d83ef6ff358a806c47645de6f874b062f4b8d4dd24416c  /tmp/v0515.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v0515.patch.gz > /tmp/v0515.patch
          echo '5fad086e19fecb21fc710bf709a3c34d6b1f2006c8a9082891ad3e5b685ae0f2  /tmp/v0515.patch' | sha256sum -c -
          cd wa-vault-v0515-project
          patch -p1 --batch < /tmp/v0515.patch
          find . -name '*.orig' -delete
          python3 tools/v0515_regression_test.py

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile and capture log
        id: compile
        continue-on-error: true
        working-directory: wa-vault-v0515-project
        run: |
          set -o pipefail
          gradle :app:assembleRelease --stacktrace --console=plain 2>&1 | tee ../v0515-compile.log

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WA-Vault-v0.5.15-compile-log
          path: v0515-compile.log
          retention-days: 7

      - name: Propagate compile result
        if: steps.compile.outcome == 'failure'
        run: exit 1
