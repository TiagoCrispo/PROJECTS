name: A53 v1.15.7 Refactor Patch
on:
  push:
    paths:
      - 'A53Performance/PATCH_READY_1157'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1157
      - name: Refactor MainActivity wiring
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java')
          s=p.read_text()
          s=s.replace('    private SystemOptimizer optimizer;\n','    private SystemOptimizer optimizer;\n    private PermissionController permissionController;\n    private DiagnosticsStore diagnosticsStore;\n',1)
          s=s.replace('shell=new ShizukuShell(this);storage=new StorageRepository(this);analyzer=new StorageAnalyzer(this);thumbnails=new ThumbnailLoader(this);optimizer=new SystemOptimizer(this,shell);','shell=new ShizukuShell(this);storage=new StorageRepository(this);analyzer=new StorageAnalyzer(this);thumbnails=new ThumbnailLoader(this);optimizer=new SystemOptimizer(this,shell);permissionController=new PermissionController(this,shell);diagnosticsStore=new DiagnosticsStore(this);',1)
          old='''        String q=search==null?"":search.getText().toString().trim().toLowerCase(Locale.ROOT);int f=filterSpinner==null?0:filterSpinner.getSelectedItemPosition();int sort=sortSpinner==null?0:sortSpinner.getSelectedItemPosition();\n        filtered.clear();for(StorageItem x:storage.snapshot()){\n            boolean type=switch(f){case 1->x.isImage();case 2->x.isVideo();case 3->x.isAudio();case 4->x.isLarge();case 5->duplicateKeys.contains(x.stableKey());case 6->similarKeys.contains(x.stableKey());default->true;};\n            if(!type)continue;if(!q.isEmpty()&&!x.name.toLowerCase(Locale.ROOT).contains(q)&&!x.path.toLowerCase(Locale.ROOT).contains(q))continue;filtered.add(x);\n        }\n        Comparator<StorageItem> cmp=switch(sort){case 1->Comparator.comparingLong((StorageItem x)->x.size).reversed();case 2->Comparator.comparingLong(x->x.size);case 3->Comparator.comparing(x->x.name.toLowerCase(Locale.ROOT));default->Comparator.comparingLong((StorageItem x)->x.modified).reversed();};filtered.sort(cmp);\n'''
          new='''        String q=search==null?"":search.getText().toString();int f=filterSpinner==null?0:filterSpinner.getSelectedItemPosition();int sort=sortSpinner==null?0:sortSpinner.getSelectedItemPosition();\n        filtered.clear();filtered.addAll(CleanerController.filterAndSort(storage.snapshot(),q,f,sort,duplicateKeys,similarKeys));\n'''
          assert old in s, 'filter block not found'
          s=s.replace(old,new,1)
          start=s.index('    private String permissionStatus(){')
          end=s.index('    private void saveListAnchor()', start)
          s=s[:start]+'    private String permissionStatus(){return permissionController.status();}\n\n'+s[end:]
          needle='''        LinearLayout diagnostics=card();diagnostics.addView(text("Diagnóstico de permisos",16,Color.WHITE,true));TextView diagnosticText=text(permissionStatus(),13,MUTED,false);diagnostics.addView(diagnosticText);Button repair=button("Reparar permisos faltantes");repair.setOnClickListener(v->{prefs.edit().putBoolean("permission_flow_v1154",false).apply();startPermissionFlow();diagnosticText.setText(permissionStatus());});diagnostics.addView(repair);box.addView(diagnostics);\n'''
          extra=needle+'''        LinearLayout runtimeDiag=card();runtimeDiag.addView(text("Diagnóstico interno",16,Color.WHITE,true));runtimeDiag.addView(text(permissionController.status()+"\\n"+diagnosticsStore.summary(),12,MUTED,false));box.addView(runtimeDiag);\n'''
          assert needle in s, 'diagnostic block not found'
          s=s.replace(needle,extra,1)
          s=s.replace('text("v1.15.6 HARDENED",16,ACCENT,true)','text("v1.15.7 THERMAL / ANALYSIS",16,ACCENT,true)',1)
          s=s.replace('"Shizuku con operaciones cerradas, menos mantenimiento, duplicados con prefiltro rápido, similitud indexada, IDs 64-bit y diagnóstico reparable de permisos."','"Análisis completo por bloques, doble hash perceptual, pausa térmica con progreso guardado, Shizuku con reconexión controlada y diagnóstico local."',1)
          s=s.replace('scanStatus.setText(duplicateGroups+" grupos duplicados");','diagnosticsStore.record("analysis",duplicateGroups+" grupos duplicados");scanStatus.setText(duplicateGroups+" grupos duplicados");',1)
          s=s.replace('scanStatus.setText(similarGroups+" grupos de fotos similares");','diagnosticsStore.record("analysis",similarGroups+" grupos de fotos similares");scanStatus.setText(similarGroups+" grupos de fotos similares");',1)
          s=s.replace('scanStatus.setText(deleted.size()+" eliminados definitivamente"+(failed.isEmpty()?"":" · "+failed.size()+" no pudieron borrarse"));','diagnosticsStore.record("operation",failed.isEmpty()?deleted.size()+" eliminados correctamente":failed.size()+" fallos al eliminar");scanStatus.setText(deleted.size()+" eliminados definitivamente"+(failed.isEmpty()?"":" · "+failed.size()+" no pudieron borrarse"));',1)
          p.write_text(s)
          PY
          git config user.name 'ChatGPT Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git commit -m 'Refactor v1.15.7 controllers and diagnostics'
          git push origin HEAD:agent/a53-performance-v1157
