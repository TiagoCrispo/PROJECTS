name: Build Mendoza Meteo v4 APK

on:
  push:
    branches: ["chatgpt/mendoza-meteo-apk-build"]
    paths:
      - ".github/workflows/build-mendoza-v4-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reconstruct source
        run: |
          wc -c mendoza_v4_native_source.part1 mendoza_v4_native_source.part2 mendoza_v4_native_source.part3 mendoza_v4_native_source.part4a mendoza_v4_native_source.part4b
          sha256sum mendoza_v4_native_source.part1 mendoza_v4_native_source.part2 mendoza_v4_native_source.part3 mendoza_v4_native_source.part4a mendoza_v4_native_source.part4b
          test "$(sha256sum mendoza_v4_native_source.part1 | cut -d' ' -f1)" = "843732b5ad7b5624ffd2501e2d0697fe6d8aea8fbe545994ae3181c4729081a3"
          test "$(sha256sum mendoza_v4_native_source.part2 | cut -d' ' -f1)" = "fa9fdeb8de6578c14d7ce211cec8755c899a5699dd2ea7eb026ae2d75d9f3f17"
          test "$(sha256sum mendoza_v4_native_source.part3 | cut -d' ' -f1)" = "229e44f22ad3db3c1236a5a8346cce530130bfbd86c6ed71fd53a5fe91baa85e"
          test "$(sha256sum mendoza_v4_native_source.part4a | cut -d' ' -f1)" = "7b918582994fa6bbf41e94b0db284f9b6641ac61219fd4ccdd65094b72399088"
          test "$(sha256sum mendoza_v4_native_source.part4b | cut -d' ' -f1)" = "71d1b526cf5c113928ea574e2e18e14f6ba62014d32aaef39178a7b9d849cfff"
          cat mendoza_v4_native_source.part1 mendoza_v4_native_source.part2 mendoza_v4_native_source.part3 mendoza_v4_native_source.part4a mendoza_v4_native_source.part4b | base64 -d > source.zip
          sha256sum source.zip
          test "$(sha256sum source.zip | cut -d' ' -f1)" = "c40d24e34be38891a04a1d29aaacae8ec376da48693491edd7e8ccbbb19f0996"
          unzip -t source.zip
          unzip -q source.zip
          test -f mendoza_v4_native/app/src/main/java/com/mendozameteo/pro/MainActivity.java
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" || true
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify weather endpoint
        run: curl -fS --retry 3 'https://api.open-meteo.com/v1/forecast?latitude=-32.8895&longitude=-68.8458&current=temperature_2m,weather_code&timezone=auto' | head -c 500
      - name: Build debug APK
        working-directory: mendoza_v4_native
        run: gradle :app:assembleDebug --stacktrace
      - name: Verify APK
        working-directory: mendoza_v4_native
        run: |
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../MendozaMeteo_PRO_v4.0_Native.apk
      - uses: actions/upload-artifact@v4
        with:
          name: MendozaMeteo-PRO-v4.0-Native-APK
          path: MendozaMeteo_PRO_v4.0_Native.apk

# build-trigger: v4-native-final
