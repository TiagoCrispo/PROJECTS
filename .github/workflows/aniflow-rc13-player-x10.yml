name: AniFlow RC13 PLAYER-X10 Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc13-player-x10
  cancel-in-progress: true

jobs:
  android-rc13:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC13_FINAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc13

    steps:
      - uses: actions/checkout@v5
      - name: Announce start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0", cache-read-only: true }

      - name: Materialize latest successful RC12
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/rc12-artifact
          mkdir -p "$ANIFLOW_ROOT" /tmp/rc12-artifact
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=AniFlow-v1.0.11-rc12-final&per_page=20" --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | reverse | .[0].id // empty')"
          echo "RC12_ARTIFACT_ID=$ART_ID"
          test -n "$ART_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > /tmp/rc12-artifact.zip
          unzip -q /tmp/rc12-artifact.zip -d /tmp/rc12-artifact
          unzip -q /tmp/rc12-artifact/AniFlow-v1.0.11-rc12-source.zip -d "$ANIFLOW_ROOT"
          grep -q 'versionName = "1.0.11-rc12"' "$ANIFLOW_ROOT/app/build.gradle.kts"
          grep -R -q 'PlayerView' "$ANIFLOW_ROOT/app/src/main/java/com/aniflow/app/feature/player"
          ! grep -R -q 'WebView(' "$ANIFLOW_ROOT/app/src/main/java"

      - name: Apply RC13 PLAYER-X10
        run: |
          set -euo pipefail
          python3 tools/aniflow_rc13_patch.py "$ANIFLOW_ROOT"
          grep -q 'versionName = "1.0.12-rc13"' "$ANIFLOW_ROOT/app/build.gradle.kts"
          python3 "$ANIFLOW_ROOT/scripts/validate-block17.py"

      - name: Regression guards Blocks 2-17
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in $(seq 2 17); do
            test -f "scripts/validate-block${gate}.py"
            python3 "scripts/validate-block${gate}.py"
          done
          bash scripts/validate-pure-kotlin.sh
          bash scripts/validate-network-kotlin.sh
          bash scripts/validate-data-kotlin.sh
          bash scripts/validate-viewmodels-kotlin.sh
          bash scripts/validate-ui-syntax.sh

      - name: Unit tests
        run: gradle -p "$ANIFLOW_ROOT" :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
          STATUS=$?
          find "$ANIFLOW_ROOT/app/build" -iname 'lint-results*.txt' -o -iname 'lint-results*.html' | head -20 || true
          exit "$STATUS"

      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Verify Baseline Profile
        shell: bash
        run: |
          set -euo pipefail
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          test -s "$UNSIGNED"
          unzip -l "$UNSIGNED" | grep -E 'assets/dexopt/baseline\.(prof|profm)' | tee "$RUNNER_TEMP/baseline-apk-entries.txt"
          test "$(wc -l < "$RUNNER_TEMP/baseline-apk-entries.txt")" -ge 2

      - name: Sign and verify RC13
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc13-release.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.12-rc13-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.12-rc13.apk"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-rc13-ci -keypass aniflow-rc13-ci -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal RC13, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-rc13-ci --key-pass pass:aniflow-rc13-ci --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-rc13-deliverables"
          mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.12-rc13-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.12-rc13.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.12-rc13-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/apk-badging.txt" "$RUNNER_TEMP/baseline-apk-entries.txt" "$OUT/"
          test ! -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" || cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/"

      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.12-rc13-final
          path: ${{ runner.temp }}/aniflow-rc13-deliverables/*
          if-no-files-found: error
          retention-days: 30

      - name: Announce success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.12-rc13-final"

      - name: Announce failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC13_FAILED run_id=${GITHUB_RUN_ID}"
