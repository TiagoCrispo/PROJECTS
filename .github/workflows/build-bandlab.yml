name: Build BandLab APK
on:
  push:
    branches: [ agent/bandlab-apk-build ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build APK
        working-directory: BandLabBuild
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK
        run: |
          test -f BandLabBuild/app/build/outputs/apk/debug/app-debug.apk
          ls -lh BandLabBuild/app/build/outputs/apk/debug/app-debug.apk
          sha256sum BandLabBuild/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BandLab9Active-v0.2-test-apk
          path: BandLabBuild/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
