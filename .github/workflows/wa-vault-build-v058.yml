name: WA Vault v0.5.8 repeated-message deletion fix

on:
  push:
    branches: [wa-vault-build-v058]
    paths:
      - '.github/workflows/wa-vault-build-v058.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.7 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v058-project
          gh run download 31877135651 -n WA-Vault-v0.5.7-source -D wa-vault-v058-project
          grep -q 'versionCode = 57' wa-vault-v058-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.7"' wa-vault-v058-project/app/build.gradle.kts
          grep -q 'MAX_VIDEO_BYTES = 40L' wa-vault-v058-project/app/src/main/java/com/fer/wavault/MediaLimits.java

      - name: Apply verified v0.5.8 patch
        run: |
          set -euo pipefail
          cat > /tmp/v058.patch.gz.b64 <<'EOF'

EOF
          base64 -d /tmp/v058.patch.gz.b64 | gzip -dc > /tmp/v058.patch
          echo '00205ffa3766e13276ee5d71cfb8062080a2dfd50262905f660ecb5112ae8d45  /tmp/v058.patch' | sha256sum -c -
          cd wa-vault-v058-project
          patch -p1 --batch < /tmp/v058.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 58' app/build.gradle.kts
          grep -q 'versionName = "0.5.8"' app/build.gradle.kts
          grep -q 'SNAPSHOT_SHRINK_IGNORED' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'stableTimestamp' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'REMOVE_WAIT_' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'EMPTY_WAIT' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          test -s V058_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v058-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.8
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v058-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v058-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v058-output/WA-Vault-v0.5.8.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v058-output/WA-Vault-v0.5.8.apk > wa-vault-v058-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v058-output/WA-Vault-v0.5.8.apk > wa-vault-v058-output/APK_SHA256.txt
          cp wa-vault-v058-project/V058_NOTES.md wa-vault-v058-output/
          cp wa-vault-v058-project/TEST_MATRIX.md wa-vault-v058-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.8-release
          path: |
            wa-vault-v058-output/WA-Vault-v0.5.8.apk
            wa-vault-v058-output/APK_SHA256.txt
            wa-vault-v058-output/APK_SIGNATURE.txt
            wa-vault-v058-output/V058_NOTES.md
            wa-vault-v058-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.8-source
          path: wa-vault-v058-project
          retention-days: 30
