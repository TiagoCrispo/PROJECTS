name: WA Vault Export Signing Tools

on:
  push:
    branches:
      - agent/wa-vault-v0.5.31-block7
    paths:
      - '.github/workflows/wa-vault-export-signing-tools.yml'

permissions:
  contents: read

jobs:
  export-tools:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v4
        with:
          packages: 'build-tools;35.0.0'
      - name: Package official Android signing tools
        shell: bash
        run: |
          set -euo pipefail
          BT="$ANDROID_HOME/build-tools/35.0.0"
          test -x "$BT/apksigner"
          test -f "$BT/lib/apksigner.jar"
          test -x "$BT/zipalign"
          mkdir -p signing-tools/lib
          cp "$BT/apksigner" signing-tools/apksigner
          cp "$BT/lib/apksigner.jar" signing-tools/lib/apksigner.jar
          cp "$BT/zipalign" signing-tools/zipalign
          sha256sum signing-tools/apksigner signing-tools/lib/apksigner.jar signing-tools/zipalign > signing-tools/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: android-build-tools-35-signing
          path: signing-tools
          if-no-files-found: error
          retention-days: 1
