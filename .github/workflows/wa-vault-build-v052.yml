name: WA Vault v0.5.6 batch-delete cap hotfix

on:
  push:
    branches: [wa-vault-build-v056]
    paths:
      - 'wa-vault-build-v056/**'
      - '.github/workflows/wa-vault-build-v052.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.5 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v056-project
          gh run download 31875639488 -n WA-Vault-v0.5.5-source -D wa-vault-v056-project
          grep -q 'versionCode = 55' wa-vault-v056-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.5"' wa-vault-v056-project/app/build.gradle.kts
          grep -q 'android.useAndroidX=true' wa-vault-v056-project/gradle.properties

      - name: Apply verified v0.5.6 patch
        run: |
          set -euo pipefail
          cp wa-vault-build-v056/v056.patch /tmp/v056.patch
          echo '25eac5207745abb2cdbda735fea16e1003fcf1d9e6be8b71ab0b26f0dfc3ebbb  /tmp/v056.patch' | sha256sum -c -
          cd wa-vault-v056-project
          patch -p1 --batch < /tmp/v056.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 56' app/build.gradle.kts
          grep -q 'versionName = "0.5.6"' app/build.gradle.kts
          grep -q 'DELETE_MARKER_CAP_EXPANDED' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'compactRecentDbBurstCount' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'last_delete_db_burst_count' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          test -s V056_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v056-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.6
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v056-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v056-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v056-output/WA-Vault-v0.5.6.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v056-output/WA-Vault-v0.5.6.apk > wa-vault-v056-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v056-output/WA-Vault-v0.5.6.apk > wa-vault-v056-output/APK_SHA256.txt
          cp wa-vault-v056-project/V056_NOTES.md wa-vault-v056-output/
          cp wa-vault-v056-project/TEST_MATRIX.md wa-vault-v056-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.6-release
          path: |
            wa-vault-v056-output/WA-Vault-v0.5.6.apk
            wa-vault-v056-output/APK_SHA256.txt
            wa-vault-v056-output/APK_SIGNATURE.txt
            wa-vault-v056-output/V056_NOTES.md
            wa-vault-v056-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.6-source
          path: wa-vault-v056-project
          retention-days: 30
