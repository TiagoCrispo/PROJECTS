name: WA Vault v0.5.7 batch >6 + video 40MB

on:
  push:
    branches: [wa-vault-build-v057-video40]
    paths:
      - 'wa-vault-build-v057/**'
      - '.github/workflows/wa-vault-build-v052.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.6 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v057-project
          gh run download 31876081730 -n WA-Vault-v0.5.6-source -D wa-vault-v057-project
          grep -q 'versionCode = 56' wa-vault-v057-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.6"' wa-vault-v057-project/app/build.gradle.kts
          grep -q 'android.useAndroidX=true' wa-vault-v057-project/gradle.properties

      - name: Apply verified v0.5.7 patch
        run: |
          set -euo pipefail
          gzip -dc wa-vault-build-v057/full.patch.gz > /tmp/v057.patch
          echo '9986e63e15b7c572939e1c3f388d1c93f5325c8e2b600d3db2e334288585d7ae  /tmp/v057.patch' | sha256sum -c -
          cd wa-vault-v057-project
          patch -p1 --batch < /tmp/v057.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 57' app/build.gradle.kts
          grep -q 'versionName = "0.5.7"' app/build.gradle.kts
          grep -q 'AGGRESSIVE_BATCH_MAX = 64' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'compute the complete burst BEFORE' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'MAX_VIDEO_BYTES = 40L' app/src/main/java/com/fer/wavault/MediaLimits.java
          grep -q 'VIDEO_LIMIT_PLACEHOLDER' app/src/main/java/com/fer/wavault/MainActivity.java
          test -s V057_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v057-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.7
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v057-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v057-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v057-output/WA-Vault-v0.5.7.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v057-output/WA-Vault-v0.5.7.apk > wa-vault-v057-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v057-output/WA-Vault-v0.5.7.apk > wa-vault-v057-output/APK_SHA256.txt
          cp wa-vault-v057-project/V057_NOTES.md wa-vault-v057-output/
          cp wa-vault-v057-project/TEST_MATRIX.md wa-vault-v057-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.7-release
          path: |
            wa-vault-v057-output/WA-Vault-v0.5.7.apk
            wa-vault-v057-output/APK_SHA256.txt
            wa-vault-v057-output/APK_SIGNATURE.txt
            wa-vault-v057-output/V057_NOTES.md
            wa-vault-v057-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.7-source
          path: wa-vault-v057-project
          retention-days: 30
