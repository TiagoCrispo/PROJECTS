name: WA Vault v0.5.4 super aggressive delete + audio

on:
  push:
    branches: [wa-vault-build-v054]
    paths:
      - 'wa-vault-build-v054/**'
      - '.github/workflows/wa-vault-build-v052.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.3 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v054-project
          gh run download 31873847515 -n WA-Vault-v0.5.3-source -D wa-vault-v054-project
          grep -q 'versionCode = 53' wa-vault-v054-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.3"' wa-vault-v054-project/app/build.gradle.kts
          grep -q 'android.useAndroidX=true' wa-vault-v054-project/gradle.properties

      - name: Apply verified v0.5.4 patch
        run: |
          set -euo pipefail
          base64 -d wa-vault-build-v054/patch.b64 > /tmp/v054.patch.xz
          echo 'd5e97f71408572d1d1e18f15fd5e5d11265c81c66379da2b1553cc5bbf2199dc  /tmp/v054.patch.xz' | sha256sum -c -
          xz -dc /tmp/v054.patch.xz > /tmp/v054.patch
          cd wa-vault-v054-project
          patch -p1 --batch < /tmp/v054.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 54' app/build.gradle.kts
          grep -q 'versionName = "0.5.4"' app/build.gradle.kts
          grep -q 'DELETE_VERIFY_MS = 160L' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'DELETE_BATCH_OPTIMISTIC' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'AGGRESSIVE_BATCH_WINDOW_MS' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'scanRecentAudioAggressive' app/src/main/java/com/fer/wavault/MediaArchiver.java
          grep -q 'MediaStore.Audio.Media.EXTERNAL_CONTENT_URI' app/src/main/java/com/fer/wavault/MediaStoreWatcher.java
          grep -q 'newFixedThreadPool(6' app/src/main/java/com/fer/wavault/DirectVoiceWatcher.java
          test -s V054_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v054-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          test -s signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.4
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v054-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v054-output
          PASS="$(cat signing/SIGNING_BACKUP_PASSWORD.txt)"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v054-output/WA-Vault-v0.5.4.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v054-output/WA-Vault-v0.5.4.apk > wa-vault-v054-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v054-output/WA-Vault-v0.5.4.apk > wa-vault-v054-output/APK_SHA256.txt
          cp wa-vault-v054-project/V054_NOTES.md wa-vault-v054-output/
          cp wa-vault-v054-project/TEST_MATRIX.md wa-vault-v054-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.4-release
          path: |
            wa-vault-v054-output/WA-Vault-v0.5.4.apk
            wa-vault-v054-output/APK_SHA256.txt
            wa-vault-v054-output/APK_SIGNATURE.txt
            wa-vault-v054-output/V054_NOTES.md
            wa-vault-v054-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.4-source
          path: wa-vault-v054-project
          retention-days: 30
