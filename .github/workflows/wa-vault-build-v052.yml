name: WA Vault v0.5.5 dedupe + fast selection

on:
  push:
    branches: [wa-vault-build-v055]
    paths:
      - 'wa-vault-build-v055/**'
      - '.github/workflows/wa-vault-build-v052.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.4 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v055-project
          gh run download 31874568521 -n WA-Vault-v0.5.4-source -D wa-vault-v055-project
          grep -q 'versionCode = 54' wa-vault-v055-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.4"' wa-vault-v055-project/app/build.gradle.kts
          grep -q 'android.useAndroidX=true' wa-vault-v055-project/gradle.properties

      - name: Apply verified v0.5.5 patch
        run: |
          set -euo pipefail
          cat wa-vault-build-v055/diff-00 wa-vault-build-v055/diff-01 wa-vault-build-v055/diff-02 wa-vault-build-v055/diff-03 wa-vault-build-v055/diff-04 wa-vault-build-v055/diff-05 wa-vault-build-v055/diff-06 > /tmp/v055.patch
          echo '263407d456a6696523545806b54cc83423986357ecb3f2a3cda698957026717f  /tmp/v055.patch' | sha256sum -c -
          cd wa-vault-v055-project
          patch -p1 --batch < /tmp/v055.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 55' app/build.gradle.kts
          grep -q 'versionName = "0.5.5"' app/build.gradle.kts
          grep -q 'findExactMessageId' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'MEDIA_INSERT_LOCK' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'DUPLICATE_MEDIA_REPAIRED' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'MIME/URI availability can change' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'shouldOpenDescriptor' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'selectionActive' app/src/main/java/com/fer/wavault/RecoveryCenterAdapter.java
          grep -q 'Seleccionar todo' app/src/main/java/com/fer/wavault/MainActivity.java
          test -s V055_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v055-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.5
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v055-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v055-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v055-output/WA-Vault-v0.5.5.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v055-output/WA-Vault-v0.5.5.apk > wa-vault-v055-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v055-output/WA-Vault-v0.5.5.apk > wa-vault-v055-output/APK_SHA256.txt
          cp wa-vault-v055-project/V055_NOTES.md wa-vault-v055-output/
          cp wa-vault-v055-project/TEST_MATRIX.md wa-vault-v055-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.5-release
          path: |
            wa-vault-v055-output/WA-Vault-v0.5.5.apk
            wa-vault-v055-output/APK_SHA256.txt
            wa-vault-v055-output/APK_SIGNATURE.txt
            wa-vault-v055-output/V055_NOTES.md
            wa-vault-v055-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.5-source
          path: wa-vault-v055-project
          retention-days: 30
