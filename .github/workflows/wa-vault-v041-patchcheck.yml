name: WA Vault v0.4.1 patch integrity
on:
  push:
    branches: [wa-vault-build-v041]
    paths: ['.github/workflows/wa-vault-v041-patchcheck.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check patch fragments
        run: |
          set -u
          for f in patch-000 patch-001 patch-002 patch-003 patch-01 patch-02 patch-03; do wc -c "wa-vault-build-v041/$f.b64"; sha256sum "wa-vault-build-v041/$f.b64"; base64 -d "wa-vault-build-v041/$f.b64" >/dev/null && echo "$f OK" || echo "$f FAIL"; done
          echo 'EXPECTED 000 31f73f26347046e8a68fcd67d070aeb9121dff9498490f1cedfc5b0a181ac3b0'
