name: A53 v1.15.8 Main Patch
on:
  push:
    branches:
      - agent/a53-performance-v1158
    paths:
      - A53Performance/PATCH_READY_1158
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1158
      - name: Patch MainActivity safety UI
        run: python3 A53Performance/patch1158.py
      - name: Commit patched activity
        run: |
          git config user.name "Damián Crispo"
          git config user.email "116601726+TiagoCrispo@users.noreply.github.com"
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git diff --cached --quiet && exit 0
          git commit -m "Integrate v1.15.8 safety and smart cleaner UI"
          git push origin HEAD:agent/a53-performance-v1158
