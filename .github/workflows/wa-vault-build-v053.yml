name: WA Vault v0.5.3 remote-delete + audio hotfix

on:
  push:
    branches: [wa-vault-build-v053]
    paths:
      - 'wa-vault-build-v053/**'
      - '.github/workflows/wa-vault-build-v053.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.2 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v053-project
          gh run download 31873278109 -n WA-Vault-v0.5.2-source -D wa-vault-v053-project
          grep -q 'versionCode = 52' wa-vault-v053-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.2"' wa-vault-v053-project/app/build.gradle.kts
          grep -q 'android.useAndroidX=true' wa-vault-v053-project/gradle.properties

      - name: Apply verified v0.5.3 patch
        run: |
          set -euo pipefail
          base64 -d wa-vault-build-v053/patch.b64 > /tmp/v053.patch.xz
          echo '07cf18a9742af98d9fcf1a41dbc9ec3035331d8e8675ec2511deacc81a240fcd  /tmp/v053.patch.xz' | sha256sum -c -
          xz -dc /tmp/v053.patch.xz > /tmp/v053.patch
          cd wa-vault-v053-project
          patch -p1 --batch < /tmp/v053.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 53' app/build.gradle.kts
          grep -q 'versionName = "0.5.3"' app/build.gradle.kts
          grep -q 'APP_CANCEL_NO_REPLACEMENT' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'EMPTY_STABLE' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'scheduleAudioRescue' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'scanRecentAudio' app/src/main/java/com/fer/wavault/MediaArchiver.java

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v053-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.3
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v053-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v053-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v053-output/WA-Vault-v0.5.3.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v053-output/WA-Vault-v0.5.3.apk > wa-vault-v053-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v053-output/WA-Vault-v0.5.3.apk > wa-vault-v053-output/APK_SHA256.txt
          cp wa-vault-v053-project/V053_NOTES.md wa-vault-v053-output/
          cp wa-vault-v053-project/TEST_MATRIX.md wa-vault-v053-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.3-release
          path: |
            wa-vault-v053-output/WA-Vault-v0.5.3.apk
            wa-vault-v053-output/APK_SHA256.txt
            wa-vault-v053-output/APK_SIGNATURE.txt
            wa-vault-v053-output/V053_NOTES.md
            wa-vault-v053-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.3-source
          path: wa-vault-v053-project
          retention-days: 30
