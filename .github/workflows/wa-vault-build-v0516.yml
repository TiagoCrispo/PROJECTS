name: WA Vault v0.5.16 strict delete evidence

on:
  push:
    branches: [wa-vault-build-v0516]
    paths:
      - 'wa-vault-build-v0516/**'
      - '.github/workflows/wa-vault-build-v0516.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.15 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0516-project
          gh run download 31917396619 -n WA-Vault-v0.5.15-source -D wa-vault-v0516-project
          grep -q 'versionCode = 65' wa-vault-v0516-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.15"' wa-vault-v0516-project/app/build.gradle.kts

      - name: Reconstruct and apply verified v0.5.16 patch
        run: |
          set -euo pipefail
          cat wa-vault-build-v0516/b64/part00 \
              wa-vault-build-v0516/b64/part01 \
              wa-vault-build-v0516/b64/part02 \
              wa-vault-build-v0516/b64/part03 \
              wa-vault-build-v0516/b64/part04 \
              wa-vault-build-v0516/b64/part05 \
            | tr -d '\r\n\t ' | base64 -d > /tmp/v0516.patch.gz
          echo 'eda31c0568e6ef93cfc423d4cab128db087dec6c238cd40ef6a655e5c9c72358  /tmp/v0516.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v0516.patch.gz > /tmp/v0516.patch
          echo 'fea238d24125e88c81a05624277f090a371df630ec76516f682e571becf60564  /tmp/v0516.patch' | sha256sum -c -
          cd wa-vault-v0516-project
          patch -p1 --batch < /tmp/v0516.patch
          mkdir -p tools
          cp ../wa-vault-build-v0516/extra/V0516_NOTES.md V0516_NOTES.md
          cp ../wa-vault-build-v0516/extra/v0516_regression_test.py tools/v0516_regression_test.py
          echo '28b5a6a9fae8d10104251eab05386c81e39a437738d88b96e8ec28d041d9e2f1  V0516_NOTES.md' | sha256sum -c -
          echo '188bffa6631800d36168d334bbbe987b2470d9734ba342dbba9344655509fae6  tools/v0516_regression_test.py' | sha256sum -c -
          find . -name '*.orig' -delete
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print
            exit 1
          fi
          grep -q 'versionCode = 66' app/build.gradle.kts
          grep -q 'versionName = "0.5.16"' app/build.gradle.kts
          python3 tools/v0516_regression_test.py

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0516-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.16
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0516-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0516-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0516-output/WA-Vault-v0.5.16.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0516-output/WA-Vault-v0.5.16.apk > wa-vault-v0516-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0516-output/WA-Vault-v0.5.16.apk > wa-vault-v0516-output/APK_SHA256.txt
          cp wa-vault-v0516-project/V0516_NOTES.md wa-vault-v0516-output/
          cp wa-vault-v0516-project/TEST_MATRIX.md wa-vault-v0516-output/
          cp wa-vault-v0516-project/tools/v0516_regression_test.py wa-vault-v0516-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.16-release
          path: |
            wa-vault-v0516-output/WA-Vault-v0.5.16.apk
            wa-vault-v0516-output/APK_SHA256.txt
            wa-vault-v0516-output/APK_SIGNATURE.txt
            wa-vault-v0516-output/V0516_NOTES.md
            wa-vault-v0516-output/TEST_MATRIX.md
            wa-vault-v0516-output/v0516_regression_test.py
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.16-source
          path: wa-vault-v0516-project
          retention-days: 30
