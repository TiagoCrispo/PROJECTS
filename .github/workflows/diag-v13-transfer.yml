name: Diagnose A53 v1.3 transfer

on:
  push:
    branches: [a53performance-build]

permissions:
  contents: read

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect chunks
        run: |
          wc -c v13ov_05 v13ov_06
          sha256sum v13ov_05 v13ov_06
      - name: Upload chunks
        uses: actions/upload-artifact@v4
        with:
          name: v13-transfer-diagnostic
          path: |
            v13ov_05
            v13ov_06
          if-no-files-found: error
