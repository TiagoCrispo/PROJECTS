name: A53 Performance v1.15.4
on:
  workflow_dispatch:
  push:
    paths:
      - 'A53Performance/BUILD_READY'
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android SDK 35
        run: yes | sdkmanager "platforms;android-35" "build-tools;35.0.0" >/dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build release
        working-directory: A53Performance
        run: gradle --no-daemon clean :app:assembleRelease
      - name: Validate APK
        run: |
          APK=A53Performance/app/build/outputs/apk/release/app-release-unsigned.apk
          test -f "$APK"
          unzip -tq "$APK"
          $ANDROID_HOME/build-tools/35.0.0/aapt dump badging "$APK" | grep "package: name='com.fer.a53performance' versionCode='26' versionName='1.15.4'"
          mkdir -p out
          $ANDROID_HOME/build-tools/35.0.0/zipalign -f -p 4 "$APK" out/A53Performance_v1.15.4_PERFORMANCE_STABILITY_UNSIGNED.apk
          $ANDROID_HOME/build-tools/35.0.0/zipalign -c -v 4 out/A53Performance_v1.15.4_PERFORMANCE_STABILITY_UNSIGNED.apk
          sha256sum out/A53Performance_v1.15.4_PERFORMANCE_STABILITY_UNSIGNED.apk > out/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.15.4-unsigned
          path: out/
          if-no-files-found: error
          retention-days: 7
