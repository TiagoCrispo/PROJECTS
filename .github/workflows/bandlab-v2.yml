name: BandLab 2.x Sequential Verification

on:
  push:
    branches: [ bandlab-v2 ]
  workflow_dispatch:

jobs:
  verify:
    runs-on: macos-15-intel
    timeout-minutes: 55
    env:
      KODO_COMMIT: 8152ffdd3f384e0563a39db7bf77a8b70d3a6e84
      SOURCE_SHA256: 7d696773dea791c0637db14082e71f9e537799e84c46221f6c90b3e4d9455f5a
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct BandLab source
        shell: bash
        run: |
          set -euo pipefail
          cat src_chunks/00.b64 src_chunks/01a.b64 src_chunks/01b.b64 src_chunks/02.b64 src_chunks/03.b64 src_chunks/04.b64 src_chunks/05.b64 src_chunks/06.b64 > /tmp/bandlab.b64
          base64 -D -i /tmp/bandlab.b64 -o /tmp/bandlab.tar.xz
          test "$(shasum -a 256 /tmp/bandlab.tar.xz | awk '{print $1}')" = "$SOURCE_SHA256"
          mkdir -p work
          tar -xJf /tmp/bandlab.tar.xz -C work
          test -f work/app/src/main/java/com/fer/bandlab/MainActivity.kt

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-35;default;x86_64"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Import pinned Xiaomi protocol
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/kidneyweakx/Kodo.git /tmp/Kodo
          git -C /tmp/Kodo checkout "$KODO_COMMIT"
          test "$(git -C /tmp/Kodo rev-parse HEAD)" = "$KODO_COMMIT"
          mkdir -p work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/auth work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/activity work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          mkdir -p work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services work/app/src/main/proto work/third_party/Kodo
          cp /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/SystemCommands.kt work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/
          cp /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/MiBand9DataUploader.kt work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/
          cp /tmp/Kodo/android-port/src/main/proto/xiaomi.proto work/app/src/main/proto/
          cp /tmp/Kodo/LICENSE work/third_party/Kodo/LICENSE
          cp /tmp/Kodo/NOTICE.md work/third_party/Kodo/NOTICE.md
          git -C /tmp/Kodo rev-parse HEAD > work/third_party/Kodo/COMMIT.txt

          python3 - <<'PY'
          from pathlib import Path
          p = Path('work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol/MiBand9BleDriver.kt')
          s = p.read_text()
          old = '''            is XiaomiSppPacketV2.Data -> {
                sendAck(packet.sequenceNumber)
                val plain = packet.decryptedPayload(authSession)
                val cmd = runCatching { XiaomiProto.Command.parseFrom(plain) }.getOrNull()
                if (cmd == null) {
                    Log.w(TAG, "← Data seq=${packet.sequenceNumber} channel=${packet.channel} but Command.parseFrom failed (${plain.size}B)")
                    return
                }
                Log.d(TAG, "← Data seq=${packet.sequenceNumber} channel=${packet.channel} cmd type=${cmd.type} subtype=${cmd.subtype}")
                onCommandReceived(cmd, packet.channel)
            }
'''
          new = '''            is XiaomiSppPacketV2.Data -> {
                sendAck(packet.sequenceNumber)
                val plain = packet.decryptedPayload(authSession)
                if (packet.channel == XiaomiChannel.ACTIVITY) {
                    _activityChunks.tryEmit(plain)
                    return
                }
                val cmd = runCatching { XiaomiProto.Command.parseFrom(plain) }.getOrNull()
                if (cmd == null) {
                    Log.w(TAG, "← Data seq=${packet.sequenceNumber} channel=${packet.channel} but Command.parseFrom failed (${plain.size}B)")
                    return
                }
                Log.d(TAG, "← Data seq=${packet.sequenceNumber} channel=${packet.channel} cmd type=${cmd.type} subtype=${cmd.subtype}")
                onCommandReceived(cmd, packet.channel)
            }
'''
          if old not in s: raise SystemExit('activity patch anchor not found')
          s = s.replace(old, new)
          s = s.replace('''        if (channel == XiaomiChannel.ACTIVITY) {
            _activityChunks.tryEmit(cmd.toByteArray())
            return
        }
''', '')
          p.write_text(s)
          PY
          cat > work/third_party/Kodo/BANDLAB_PATCHES.txt <<'EOF'
          BandLab integration: ACTIVITY payloads are delivered as raw bytes before protobuf parsing.
          EOF

      - name: Build and test 2.0 first
        working-directory: work
        shell: bash
        run: gradle --no-daemon :app:testV20DebugUnitTest :app:assembleV20Debug :app:assembleV20Release

      - name: Sequential emulator gates 2.0 to 2.3
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -no-snapshot-save -no-metrics
          script: |
            set -euo pipefail
            cd work
            mkdir -p ../verification
            smoke() {
              local stage="$1" apk="$2" version="$3"
              adb logcat -c
              if [ "$stage" = v20 ]; then adb install "$apk"; else adb install -r "$apk"; fi
              adb shell am force-stop com.fer.bandlab
              adb shell am start -W -n com.fer.bandlab/.MainActivity | tee "../verification/${stage}-am-start.txt"
              sleep 5
              test -n "$(adb shell pidof com.fer.bandlab | tr -d '\r')"
              adb shell dumpsys activity activities > "../verification/${stage}-activities.txt"
              grep -q "com.fer.bandlab/.MainActivity" "../verification/${stage}-activities.txt"
              adb shell dumpsys package com.fer.bandlab | grep -E "versionCode|versionName" > "../verification/${stage}-package.txt"
              adb logcat -d -t 800 > "../verification/${stage}-logcat.txt"
              if grep -E "FATAL EXCEPTION|Process: com\.fer\.bandlab.*has died|AndroidRuntime.*com\.fer\.bandlab" "../verification/${stage}-logcat.txt"; then exit 1; fi
              echo "$version PASS" | tee "../verification/${stage}-PASS.txt"
            }
            smoke v20 app/build/outputs/apk/v20/debug/app-v20-debug.apk 2.0.0
            gradle --no-daemon :app:testV21DebugUnitTest :app:assembleV21Debug :app:assembleV21Release
            smoke v21 app/build/outputs/apk/v21/debug/app-v21-debug.apk 2.1.0
            gradle --no-daemon :app:testV22DebugUnitTest :app:assembleV22Debug :app:assembleV22Release
            smoke v22 app/build/outputs/apk/v22/debug/app-v22-debug.apk 2.2.0
            gradle --no-daemon :app:testV23DebugUnitTest :app:assembleV23Debug :app:assembleV23Release
            smoke v23 app/build/outputs/apk/v23/debug/app-v23-debug.apk 2.3.0

      - name: Package verified outputs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp work/app/build/outputs/apk/v20/debug/app-v20-debug.apk dist/BandLab9Active_v2.0_CORE_DEBUG_VERIFIED.apk
          cp work/app/build/outputs/apk/v21/debug/app-v21-debug.apk dist/BandLab9Active_v2.1_WATCHFACE_DEBUG_VERIFIED.apk
          cp work/app/build/outputs/apk/v22/debug/app-v22-debug.apk dist/BandLab9Active_v2.2_TRAINING_PRO_DEBUG_VERIFIED.apk
          cp work/app/build/outputs/apk/v23/debug/app-v23-debug.apk dist/BandLab9Active_v2.3_FULL_DEBUG_VERIFIED.apk
          find work/app/build/outputs/apk -name '*release-unsigned.apk' -exec cp {} dist/ \;
          cp -R verification dist/verification
          cat > dist/VERIFICATION_REPORT.txt <<'EOF'
          Gate order: 2.0 -> 2.1 -> 2.2 -> 2.3.
          Each stage passed unit tests/build plus APK install/update, MainActivity launch,
          process-alive, foreground-activity and fatal-crash-log checks before the next stage.
          Physical Xiaomi BLE/watchface behavior requires the actual Smart Band 9 Active.
          EOF
          (cd work && zip -qr ../dist/BandLab9Active_v2.3_SOURCE_COMPLETE.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          shasum -a 256 dist/*.apk dist/*.zip > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BandLab-v2.0-to-v2.3-verified
          path: dist/
          if-no-files-found: error
