name: AniFlow RC12 Source Export

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  export:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC12_EXPORT'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Materialize latest successful RC12 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow aniflow-rc12-final.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId // empty')"
          test -n "$RUN_ID"
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "AniFlow-v1.0.11-rc12-final") | .id' | head -1)"
          test -n "$ART_ID"
          mkdir -p /tmp/rc12
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > /tmp/rc12/artifact.zip
          unzip -q /tmp/rc12/artifact.zip -d /tmp/rc12/out
          test -s /tmp/rc12/out/AniFlow-v1.0.11-rc12-source.zip
          cp /tmp/rc12/out/AniFlow-v1.0.11-rc12-source.zip /tmp/AniFlow-v1.0.11-rc12-source.zip
          gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC12_EXPORT_READY source_run_id=$RUN_ID export_run_id=$GITHUB_RUN_ID"
      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.11-rc12-source-export
          path: /tmp/AniFlow-v1.0.11-rc12-source.zip
          if-no-files-found: error
          retention-days: 7
