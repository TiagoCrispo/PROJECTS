name: ProductShot v1.0 Block 21 Freeze Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-v1-final-pr.yml"
  push:
    branches:
      - productshot-block8-build
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-v1-final-pr.yml"
  workflow_dispatch:

jobs:
  final-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run Block 21 deterministic freeze audit
        shell: bash
        run: |
          test "$(git hash-object projects/ProductShot/block8/run_v1_final_ci_block21.sh)" = "d7993f27a1774145fc466aa752a970ac0d5f4f12"
          bash projects/ProductShot/block8/run_v1_final_ci_block21.sh

      - name: Upload Block 21 diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-BLOCK21-AUDIT-diagnostics
          path: ${{ runner.temp }}/productshot-v1-final/diagnostics
          if-no-files-found: warn

      - name: Upload reconstructed source for failed-gate diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-BLOCK21-FAILED-SOURCE
          path: ${{ runner.temp }}/productshot-v1-src
          if-no-files-found: error

      - name: Upload Block 21 frozen source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-BLOCK21-FROZEN-SOURCE
          path: ${{ runner.temp }}/productshot-v1-final/source
          if-no-files-found: error
