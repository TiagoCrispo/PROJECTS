name: ProductShot v1.0 Final Release PR Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-v1-final-pr.yml"
  push:
    branches:
      - productshot-block8-build
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-v1-final-pr.yml"
  workflow_dispatch:

jobs:
  final-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Run final deterministic release gates
        shell: bash
        run: |
          echo "ad3cb553ff2c1de600663c5e4491512fd151b691577d6f3882be75220e1ca705  projects/ProductShot/block8/run_v1_final_ci_block17b.sh" | sha256sum -c -
          bash projects/ProductShot/block8/run_v1_final_ci_block17b.sh

      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FINAL-diagnostics
          path: ${{ runner.temp }}/productshot-v1-final/diagnostics
          if-no-files-found: warn

      - name: Upload reconstructed source for failed-gate diagnosis
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FAILED-GATE-SOURCE
          path: ${{ runner.temp }}/productshot-v1-src
          if-no-files-found: error

      - name: Upload final APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FINAL-APK
          path: ${{ runner.temp }}/productshot-v1-final/apk
          if-no-files-found: error

      - name: Upload final recovery source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FINAL-SOURCE
          path: ${{ runner.temp }}/productshot-v1-final/source
          if-no-files-found: error
