name: ProductShot v1.0 Final Release PR Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-v1-final-pr.yml"
  push:
    branches:
      - productshot-block8-build
    paths:
      - "projects/ProductShot/block8/**"
      - ".github/workflows/productshot-v1-final-pr.yml"
  workflow_dispatch:

jobs:
  final-release-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-36" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Canonicalize Block 16 Base64 transport
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('projects/ProductShot/block8/block16-v1-final.patch.gz.b64')
          p.write_text(''.join(p.read_text().split()), encoding='utf-8')
          PY
          echo "316fba4d5afd10d465e0766c50738d074a6fd15409aee43f02e95a4d1e673c48  projects/ProductShot/block8/block16-v1-final.patch.gz.b64" | sha256sum -c -

      - name: Run final deterministic release gates
        shell: bash
        run: bash projects/ProductShot/block8/run_v1_final_ci.sh

      - name: Upload final diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FINAL-diagnostics
          path: ${{ runner.temp }}/productshot-v1-final/diagnostics
          if-no-files-found: warn

      - name: Upload final APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FINAL-APK
          path: ${{ runner.temp }}/productshot-v1-final/apk
          if-no-files-found: error

      - name: Upload final recovery source
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ProductShot-v1.0.0-FINAL-SOURCE
          path: ${{ runner.temp }}/productshot-v1-final/source
          if-no-files-found: error
