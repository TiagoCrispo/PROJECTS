name: BandLab v2.6.3 temp build

on:
  push:
    branches: [ bandlab-v263-temp-build ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Reconstruct BandLab source
        run: |
          set -euxo pipefail
          cat bandlab-ci/p*.b64 | tr -d '\n\r' | base64 -d | xz -d > /tmp/bandlab.zip
          mkdir work
          unzip -q /tmp/bandlab.zip -d work

      - name: Import Xiaomi Smart Band 9 Active protocol source
        run: |
          set -euxo pipefail
          git clone https://github.com/kidneyweakx/Kodo.git /tmp/Kodo
          git -C /tmp/Kodo checkout 8152ffdd3f384e0563a39db7bf77a8b70d3a6e84
          cd work
          mkdir -p app/src/main/java/com/kidneyweakx/miband9active/xiaomi app/src/main/proto third_party/Kodo
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/auth app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/activity app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          mkdir -p app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services
          cp /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/SystemCommands.kt app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/
          cp /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/MiBand9DataUploader.kt app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/
          cp /tmp/Kodo/android-port/src/main/proto/xiaomi.proto app/src/main/proto/
          cp /tmp/Kodo/LICENSE third_party/Kodo/LICENSE
          cp /tmp/Kodo/NOTICE.md third_party/Kodo/NOTICE.md
          git -C /tmp/Kodo rev-parse HEAD > third_party/Kodo/COMMIT.txt

          DRIVER=app/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol/MiBand9BleDriver.kt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol/MiBand9BleDriver.kt')
          s=p.read_text()
          s=s.replace('fun connect(device: BluetoothDevice) {', 'fun connect(device: BluetoothDevice, autoConnect: Boolean = false) {')
          s=s.replace('device.connectGatt(context, false, cb, BluetoothDevice.TRANSPORT_LE)', 'device.connectGatt(context, autoConnect, cb, BluetoothDevice.TRANSPORT_LE)')
          s=s.replace('device.connectGatt(context, false, cb)', 'device.connectGatt(context, autoConnect, cb)')
          p.write_text(s)
          assert 'autoConnect: Boolean = false' in s
          PY

      - name: Compile and unit-test
        run: |
          cd work
          gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease

      - name: Prepare build artifact
        run: |
          set -eux
          mkdir -p dist
          cp work/app/build/outputs/apk/release/app-release-unsigned.apk dist/BandLab9Active_v2.6.3_unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/* > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BandLab-v2.6.3-build
          path: dist/
          if-no-files-found: error
