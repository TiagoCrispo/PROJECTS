name: BandLab v2.6.3 temp build
on:
  push:
    branches: [ bandlab-v263-temp-build ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.13'}
      - name: Reconstruct source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64,hashlib,lzma
          r=Path('bandlab-ci'); exp='8fc4bb39cd28b6103da1a3107da536c2486c36cf'; p7=(r/'p07.b64').read_text().strip()
          def sha(s):
            b=s.encode(); return hashlib.sha1(f'blob {len(b)}\0'.encode()+b).hexdigest()
          if sha(p7)!=exp:
            p7=next(c for i in range(len(p7)) if sha(c:=p7[:i]+p7[i+1:])==exp)
          s=''.join(p7 if i==7 else (r/f'p{i:02d}.b64').read_text().strip() for i in range(11))
          Path('/tmp/bandlab.zip').write_bytes(lzma.decompress(base64.b64decode(s,validate=True)))
          PY
          mkdir work && unzip -q /tmp/bandlab.zip -d work
      - name: Import pinned Xiaomi protocol
        run: |
          git clone -q https://github.com/kidneyweakx/Kodo.git /tmp/Kodo
          git -C /tmp/Kodo checkout -q 8152ffdd3f384e0563a39db7bf77a8b70d3a6e84
          cd work
          mkdir -p app/src/main/java/com/kidneyweakx/miband9active/xiaomi app/src/main/proto third_party/Kodo app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services
          cp -R /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/{auth,protocol,activity} app/src/main/java/com/kidneyweakx/miband9active/xiaomi/
          cp /tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/{SystemCommands.kt,MiBand9DataUploader.kt} app/src/main/java/com/kidneyweakx/miband9active/xiaomi/services/
          cp /tmp/Kodo/android-port/src/main/proto/xiaomi.proto app/src/main/proto/
          cp /tmp/Kodo/{LICENSE,NOTICE.md} third_party/Kodo/
          git -C /tmp/Kodo rev-parse HEAD > third_party/Kodo/COMMIT.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol/MiBand9BleDriver.kt'); s=p.read_text()
          s=s.replace('fun connect(device: BluetoothDevice) {','fun connect(device: BluetoothDevice, autoConnect: Boolean = false) {')
          s=s.replace('device.connectGatt(context, false, cb, BluetoothDevice.TRANSPORT_LE)','device.connectGatt(context, autoConnect, cb, BluetoothDevice.TRANSPORT_LE)').replace('device.connectGatt(context, false, cb)','device.connectGatt(context, autoConnect, cb)')
          p.write_text(s)
          PY
      - name: Apply source compile fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/app/src/main/java/com/fer/bandlab/ui/screens/HistoryScreen.kt'); s=p.read_text()
          p.write_text(s.replace('heartRateZoneTimes.sumOf { it.elapsedMs }','heartRateZoneTimes.sumOf { it.durationMs }').replace('formatDuration(it.elapsedMs)) }','formatDuration(it.durationMs)) }'))
          PY
      - name: Test and build
        run: cd work && gradle --no-daemon :app:testDebugUnitTest :app:assembleRelease
      - name: Prepare artifact
        run: |
          mkdir -p dist
          cp work/app/build/outputs/apk/release/app-release-unsigned.apk dist/BandLab9Active_v2.6.3_unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" dist/apksigner.jar
          sha256sum dist/* > dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with: {name: BandLab-v2.6.3-build, path: dist/, if-no-files-found: error}
