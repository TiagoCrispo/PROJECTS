name: A53 v1.15.5 Source Patch
on:
  push:
    paths:
      - 'A53Performance/PATCH_V1155_READY'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1155
      - name: Apply v1.15.5 integration
        run: python3 A53Performance/tools/patch_v1155.py
      - name: Commit patch
        run: |
          git config user.name 'ChatGPT Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git commit -m 'Integrate v1.15.5 stability core UI'
          git push origin HEAD:agent/a53-performance-v1155
