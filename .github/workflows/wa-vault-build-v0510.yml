name: WA Vault v0.5.10 verified deletion feed

on:
  push:
    branches: [wa-vault-build-v0510d]
    paths:
      - 'wa-vault-build-v0510/**'
      - '.github/workflows/wa-vault-build-v0510.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.9 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0510-project
          gh run download 31906597546 -n WA-Vault-v0.5.9-source -D wa-vault-v0510-project
          grep -q 'versionCode = 59' wa-vault-v0510-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.9"' wa-vault-v0510-project/app/build.gradle.kts

      - name: Apply verified v0.5.10 patch
        run: |
          set -euo pipefail
          base64 -d wa-vault-build-v0510/v0510.patch.gz.b64 | gzip -dc > /tmp/v0510.patch
          echo '67e583f801d05377bb1585396c0417bc58c1c751b74066953792ae224fef7378  /tmp/v0510.patch' | sha256sum -c -
          cd wa-vault-v0510-project
          patch -p1 --batch < /tmp/v0510.patch
          find . -name '*.rej' -print -quit | grep -q . && { find . -name '*.rej' -print; exit 1; } || true
          grep -q 'versionCode = 60' app/build.gradle.kts
          grep -q 'versionName = "0.5.10"' app/build.gradle.kts
          grep -q 'APP_CANCEL_VERIFIED' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'APP_CANCEL_ALL_IGNORED' app/src/main/java/com/fer/wavault/WhatsAppNotificationListener.java
          grep -q 'listConfirmedDeletedMessages' app/src/main/java/com/fer/wavault/MainActivity.java
          grep -q 'MENSAJE BORRADO' app/src/main/java/com/fer/wavault/MainActivity.java
          test -s V0510_NOTES.md

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0510-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks
          grep -q 'WAVault-v040-2026' signing/SIGNING_BACKUP_PASSWORD.txt

      - name: Sign and verify v0.5.10
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0510-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0510-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0510-output/WA-Vault-v0.5.10.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0510-output/WA-Vault-v0.5.10.apk > wa-vault-v0510-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0510-output/WA-Vault-v0.5.10.apk > wa-vault-v0510-output/APK_SHA256.txt
          cp wa-vault-v0510-project/V0510_NOTES.md wa-vault-v0510-output/
          cp wa-vault-v0510-project/TEST_MATRIX.md wa-vault-v0510-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.10-release
          path: |
            wa-vault-v0510-output/WA-Vault-v0.5.10.apk
            wa-vault-v0510-output/APK_SHA256.txt
            wa-vault-v0510-output/APK_SIGNATURE.txt
            wa-vault-v0510-output/V0510_NOTES.md
            wa-vault-v0510-output/TEST_MATRIX.md
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.10-source
          path: wa-vault-v0510-project
          retention-days: 30
