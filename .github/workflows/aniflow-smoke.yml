name: AniFlow Android Gate

on:
  pull_request:
    branches: [main]
    paths:
      - "projects/aniflow/**"

jobs:
  android-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Materialize and normalize AniFlow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aniflow-src"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          if [ -f projects/aniflow/settings.gradle.kts ]; then
            cp -a projects/aniflow/. "$ROOT/"
          else
            test -s .ci/aniflow-src-rc1.b64.part-00
            cat .ci/aniflow-src-rc1.b64.part-* | base64 -d > "$RUNNER_TEMP/aniflow-src-rc1.tgz"
            tar -xzf "$RUNNER_TEMP/aniflow-src-rc1.tgz" -C "$ROOT"
          fi
          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import sys
          root = Path(sys.argv[1])
          build = root / "build.gradle.kts"
          app_build = root / "app/build.gradle.kts"
          application = root / "app/src/main/java/com/aniflow/app/AniFlowApplication.kt"

          text = build.read_text()
          text = text.replace('id("com.android.application") version "9.3.0"', 'id("com.android.application") version "9.3.1"')
          build.write_text(text)

          text = app_build.read_text()
          text = text.replace('androidx.core:core:1.19.0', 'androidx.core:core:1.17.0')
          text = text.replace('androidx.activity:activity-compose:1.13.0', 'androidx.activity:activity-compose:1.12.4')
          app_build.write_text(text)

          text = application.read_text()
          text = text.replace('import coil3.crossfade', 'import coil3.request.crossfade')
          if 'import coil3.disk.directory' not in text:
              text = text.replace('import coil3.disk.DiskCache\n', 'import coil3.disk.DiskCache\nimport coil3.disk.directory\n')
          application.write_text(text)
          PY
          grep -q 'id("com.android.application") version "9.3.1"' "$ROOT/build.gradle.kts"
          grep -q 'androidx.core:core:1.17.0' "$ROOT/app/build.gradle.kts"
          grep -q 'androidx.activity:activity-compose:1.12.4' "$ROOT/app/build.gradle.kts"
          grep -q 'import coil3.request.crossfade' "$ROOT/app/src/main/java/com/aniflow/app/AniFlowApplication.kt"
          grep -q 'import coil3.disk.directory' "$ROOT/app/src/main/java/com/aniflow/app/AniFlowApplication.kt"

      - name: Regression guards
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/aniflow-src"
          for gate in 2 3 4 5 6 7; do python3 "scripts/validate-block${gate}.py"; done

      - name: Gradle configuration
        run: gradle -p "$RUNNER_TEMP/aniflow-src" help --stacktrace --no-daemon

      - name: Unit tests
        run: gradle -p "$RUNNER_TEMP/aniflow-src" :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        run: gradle -p "$RUNNER_TEMP/aniflow-src" :app:lintDebug --stacktrace --no-daemon

      - name: Assemble debug and release
        run: gradle -p "$RUNNER_TEMP/aniflow-src" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aniflow-src"
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-v1-release.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.0-rc1-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.0-rc1.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-ci-v1 -keypass aniflow-ci-v1 -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-ci-v1 --key-pass pass:aniflow-ci-v1 --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          unzip -l "$FINAL" | grep -q AndroidManifest.xml
          unzip -l "$FINAL" | grep -q classes.dex
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/aniflow-src"
          OUT="$RUNNER_TEMP/aniflow-deliverables"
          mkdir -p "$OUT"
          (cd "$ROOT" && zip -qr "$OUT/AniFlow-v1.0.0-rc1-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.0-rc1.apk" "$OUT/"
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.0-rc1-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$OUT/"
          cp "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          if [ -f "$ROOT/app/build/reports/lint-results-debug.html" ]; then cp "$ROOT/app/build/reports/lint-results-debug.html" "$OUT/lint-results-debug.html"; fi

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.0-rc1
          path: ${{ runner.temp }}/aniflow-deliverables/*
          if-no-files-found: error
