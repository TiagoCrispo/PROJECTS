name: AniFlow Android Gate

on:
  pull_request:
    branches:
      - main
    paths:
      - "projects/aniflow/**"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: read

concurrency:
  group: aniflow-final-autobuild
  cancel-in-progress: false

jobs:
  android-final:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ANIFLOW_ROOT: /tmp/aniflow-src

    steps:
      - name: Announce scheduled run
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/34/comments" \
            -f body="ANIFLOW_AUTOBUILD_START run_id=$GITHUB_RUN_ID sha=$GITHUB_SHA"

      - name: Checkout
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-read-only: true

      - name: Materialize and normalize AniFlow
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$ANIFLOW_ROOT"
          rm -rf "$ROOT"
          mkdir -p "$ROOT"
          if [ -f projects/aniflow/settings.gradle.kts ]; then
            cp -a projects/aniflow/. "$ROOT/"
          else
            test -s .ci/aniflow-src-rc1.b64.part-00
            cat .ci/aniflow-src-rc1.b64.part-* | base64 -d > "$RUNNER_TEMP/aniflow-src-rc1.tgz"
            tar -xzf "$RUNNER_TEMP/aniflow-src-rc1.tgz" -C "$ROOT"
          fi

          python3 - "$ROOT" <<'PY'
          from pathlib import Path
          import re
          import shutil
          import sys

          root = Path(sys.argv[1])

          def read(rel):
              return (root / rel).read_text()

          def write(rel, text):
              (root / rel).write_text(text)

          def replace(rel, old, new):
              text = read(rel)
              if old in text:
                  text = text.replace(old, new)
              write(rel, text)

          # Build toolchain/release metadata. Regex assignments make this step idempotent.
          replace("build.gradle.kts", 'id("com.android.application") version "9.3.0"', 'id("com.android.application") version "9.3.1"')
          app_rel = "app/build.gradle.kts"
          text = read(app_rel)
          text = re.sub(r'(?m)^(\s*)versionCode\s*=\s*\d+\s*$', r'\1versionCode = 1000001', text)
          text = re.sub(r'(?m)^(\s*)versionName\s*=\s*"[^"]+"\s*$', r'\1versionName = "1.0.0-rc1"', text)
          text = text.replace('androidx.core:core:1.19.0', 'androidx.core:core-ktx:1.17.0')
          text = text.replace('androidx.core:core:1.17.0', 'androidx.core:core-ktx:1.17.0')
          text = text.replace('androidx.activity:activity-compose:1.13.0', 'androidx.activity:activity-compose:1.12.4')
          if 'androidx.annotation:annotation-experimental:1.6.0' not in text:
              anchor = '    implementation("androidx.core:core-ktx:1.17.0")\n'
              text = text.replace(anchor, anchor + '    implementation("androidx.annotation:annotation-experimental:1.6.0")\n')
          write(app_rel, text)

          # Coil 3 API compatibility.
          application_rel = "app/src/main/java/com/aniflow/app/AniFlowApplication.kt"
          text = read(application_rel).replace('import coil3.crossfade', 'import coil3.request.crossfade')
          if 'import coil3.disk.directory' not in text:
              text = text.replace('import coil3.disk.DiskCache\n', 'import coil3.disk.DiskCache\nimport coil3.disk.directory\n')
          write(application_rel, text)

          # Block 7 guard must accept release semantic versions and current Coil imports.
          validator_rel = "scripts/validate-block7.py"
          text = read(validator_rel)
          text = text.replace('"import coil3.crossfade",', '"import coil3.request.crossfade",\n        "import coil3.disk.directory",')
          text = text.replace(
              'require(\'versionName = "0.7.0-block7"\' in build, "Block 7 version checkpoint missing")',
              'm_version = re.search(r\'versionName\\s*=\\s*"(\\d+)\\.(\\d+)\\.(\\d+)(?:-[^"]+)?"\', build)\n    require(m_version is not None and tuple(map(int, m_version.groups())) >= (0, 7, 0), "Block 7 version checkpoint missing")'
          )
          write(validator_rel, text)

          # Manifest / backup / PiP lint fixes.
          manifest_rel = "app/src/main/AndroidManifest.xml"
          text = read(manifest_rel)
          if '<uses-feature android:name="android.software.picture_in_picture"' not in text:
              text = text.replace(
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n',
                  '    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-feature android:name="android.software.picture_in_picture" android:required="false" />\n'
              )
          text = text.replace('android:fullBackupContent="true"', 'android:fullBackupContent="@xml/backup_rules"\n        android:dataExtractionRules="@xml/data_extraction_rules"')
          text = text.replace('android:label="AniFlow"', 'android:label="@string/app_name"')
          text = text.replace('            android:screenOrientation="unspecified"\n', '')
          if 'android:resizeableActivity="true"' not in text:
              text = text.replace('            android:supportsPictureInPicture="true"\n', '            android:supportsPictureInPicture="true"\n            android:resizeableActivity="true"\n')
          write(manifest_rel, text)

          xml = root / "app/src/main/res/xml"
          xml.mkdir(parents=True, exist_ok=True)
          (xml / "backup_rules.xml").write_text('''<full-backup-content>\n    <include domain="database" path="." />\n    <include domain="sharedpref" path="." />\n    <include domain="file" path="datastore/" />\n</full-backup-content>\n''')
          (xml / "data_extraction_rules.xml").write_text('''<data-extraction-rules>\n    <cloud-backup>\n        <include domain="database" path="." />\n        <include domain="sharedpref" path="." />\n        <include domain="file" path="datastore/" />\n    </cloud-backup>\n    <device-transfer>\n        <include domain="database" path="." />\n        <include domain="sharedpref" path="." />\n        <include domain="file" path="datastore/" />\n    </device-transfer>\n</data-extraction-rules>\n''')

          theme_rel = "app/src/main/res/values/themes.xml"
          text = read(theme_rel).replace('        <item name="android:windowLightNavigationBar">false</item>\n', '')
          write(theme_rel, text)
          theme_v27 = root / "app/src/main/res/values-v27/themes.xml"
          theme_v27.parent.mkdir(parents=True, exist_ok=True)
          theme_v27.write_text('''<resources>\n    <style name="Theme.AniFlow" parent="android:style/Theme.Material.NoActionBar">\n        <item name="android:windowLightNavigationBar">false</item>\n    </style>\n</resources>\n''')

          colors_rel = "app/src/main/res/values/colors.xml"
          write(colors_rel, read(colors_rel).replace('    <color name="aniflow_orange">#FF6A00</color>\n', ''))
          shutil.rmtree(root / "app/src/main/res/mipmap-anydpi-v26", ignore_errors=True)

          # Auto-mirrored back icon lint fixes.
          for rel in [
              "app/src/main/java/com/aniflow/app/feature/detail/AnimeDetailScreen.kt",
              "app/src/main/java/com/aniflow/app/feature/search/SearchScreen.kt",
              "app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt",
          ]:
              text = read(rel)
              text = text.replace('import androidx.compose.material.icons.filled.ArrowBack', 'import androidx.compose.material.icons.automirrored.filled.ArrowBack')
              text = text.replace('Icons.Default.ArrowBack', 'Icons.AutoMirrored.Filled.ArrowBack')
              write(rel, text)

          # Compose API ordering lint fix.
          components_rel = "app/src/main/java/com/aniflow/app/ui/components/AniFlowComponents.kt"
          text = read(components_rel)
          text = text.replace(
              '''fun EmptyState(\n    title: String,\n    subtitle: String? = null,\n    icon: ImageVector = Icons.Default.Inbox,\n    actionLabel: String? = null,\n    onAction: (() -> Unit)? = null,\n    modifier: Modifier = Modifier,\n)''',
              '''fun EmptyState(\n    title: String,\n    modifier: Modifier = Modifier,\n    subtitle: String? = null,\n    icon: ImageVector = Icons.Default.Inbox,\n    actionLabel: String? = null,\n    onAction: (() -> Unit)? = null,\n)'''
          )
          write(components_rel, text)

          # Media3 + PiP + URI + orientation lint/API fixes.
          player_rel = "app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt"
          text = read(player_rel)
          text = text.replace('@file:OptIn(androidx.media3.common.util.UnstableApi::class)', '@file:androidx.annotation.OptIn(androidx.media3.common.util.UnstableApi::class)')
          text = text.replace('import android.content.pm.ActivityInfo\n', '')
          text = text.replace('import android.net.Uri\n', '')
          if 'import android.graphics.Rect\n' not in text:
              text = text.replace('import android.content.Intent\n', 'import android.content.Intent\nimport android.graphics.Rect\n')
          if 'import android.os.Build\n' not in text:
              text = text.replace('import android.graphics.Rect\n', 'import android.graphics.Rect\nimport android.os.Build\n')
          if 'import androidx.core.net.toUri\n' not in text:
              text = text.replace('import androidx.core.view.WindowCompat\n', 'import androidx.core.net.toUri\nimport androidx.core.view.WindowCompat\n')
          text = text.replace('setUri(Uri.parse(uri))', 'setUri(uri.toUri())')
          text = text.replace(
              '''        ExoPlayer.Builder(context)\n            .setAudioAttributes(audioAttributes, true)\n            .setHandleAudioBecomingNoisy(true)\n            .build()\n    }\n    var isPlaying by remember { mutableStateOf(false) }''',
              '''        ExoPlayer.Builder(context)\n            .setAudioAttributes(audioAttributes, true)\n            .setHandleAudioBecomingNoisy(true)\n            .build()\n    }\n    val playerViewHolder = remember { arrayOfNulls<PlayerView>(1) }\n    var isPlaying by remember { mutableStateOf(false) }'''
          )
          text = text.replace(
              '''    DisposableEffect(fullscreen, activity) {\n        if (activity != null) applyFullscreen(activity, fullscreen)\n        onDispose {\n            if (activity != null && fullscreen) applyFullscreen(activity, false)\n        }\n    }\n\n    Box(''',
              '''    DisposableEffect(fullscreen, activity) {\n        if (activity != null) applyFullscreen(activity, fullscreen)\n        onDispose {\n            if (activity != null && fullscreen) applyFullscreen(activity, false)\n        }\n    }\n\n    DisposableEffect(activity, state.mediaId, state.episode) {\n        onDispose {\n            activity?.let { updatePictureInPictureParams(it, null, autoEnter = false) }\n        }\n    }\n\n    Box('''
          )
          text = text.replace(
              '''                    layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)\n                    this.player = player\n                }\n            },\n            update = { it.player = player },''',
              '''                    layoutParams = ViewGroup.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.MATCH_PARENT)\n                    this.player = player\n                    playerViewHolder[0] = this\n                    activity?.let { owner -> updatePictureInPictureParams(owner, this, autoEnter = true) }\n                }\n            },\n            update = { view ->\n                view.player = player\n                playerViewHolder[0] = view\n                activity?.let { owner -> updatePictureInPictureParams(owner, view, autoEnter = true) }\n            },'''
          )
          text = text.replace(
              '''                onPip = {\n                    activity?.enterPictureInPictureMode(\n                        PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9)).build()\n                    )\n                },''',
              '''                onPip = {\n                    activity?.let { owner ->\n                        owner.enterPictureInPictureMode(buildPictureInPictureParams(playerViewHolder[0], autoEnter = true))\n                    }\n                },'''
          )
          text = text.replace('        activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_SENSOR_LANDSCAPE\n', '')
          text = text.replace('        activity.requestedOrientation = ActivityInfo.SCREEN_ORIENTATION_UNSPECIFIED\n', '')
          helper = '''private fun buildPictureInPictureParams(playerView: PlayerView?, autoEnter: Boolean): PictureInPictureParams {\n    val builder = PictureInPictureParams.Builder().setAspectRatio(Rational(16, 9))\n    val sourceRect = Rect()\n    if (playerView?.getGlobalVisibleRect(sourceRect) == true && !sourceRect.isEmpty) {\n        builder.setSourceRectHint(sourceRect)\n    }\n    if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.S) {\n        builder.setAutoEnterEnabled(autoEnter)\n    }\n    return builder.build()\n}\n\nprivate fun updatePictureInPictureParams(activity: Activity, playerView: PlayerView?, autoEnter: Boolean) {\n    activity.setPictureInPictureParams(buildPictureInPictureParams(playerView, autoEnter))\n}\n\n'''
          marker = 'private fun applyFullscreen(activity: Activity, fullscreen: Boolean) {\n'
          if helper not in text:
              text = text.replace(marker, helper + marker)
          write(player_rel, text)
          package_info = root / "app/src/main/java/com/aniflow/app/feature/player/package-info.kt"
          if package_info.exists():
              package_info.unlink()
          PY

          grep -q 'versionCode = 1000001' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "1.0.0-rc1"' "$ROOT/app/build.gradle.kts"
          grep -q 'id("com.android.application") version "9.3.1"' "$ROOT/build.gradle.kts"
          grep -q 'androidx.core:core-ktx:1.17.0' "$ROOT/app/build.gradle.kts"
          grep -q 'androidx.annotation:annotation-experimental:1.6.0' "$ROOT/app/build.gradle.kts"
          grep -q '@file:androidx.annotation.OptIn' "$ROOT/app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt"
          grep -q 'setAutoEnterEnabled' "$ROOT/app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt"
          grep -q 'android:dataExtractionRules' "$ROOT/app/src/main/AndroidManifest.xml"
          ! grep -q 'screenOrientation' "$ROOT/app/src/main/AndroidManifest.xml"

      - name: Regression guards Blocks 2-7
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in 2 3 4 5 6 7; do python3 "scripts/validate-block${gate}.py"; done

      - name: Gradle configuration
        run: gradle -p "$ANIFLOW_ROOT" help --stacktrace --no-daemon

      - name: Unit tests
        run: gradle -p "$ANIFLOW_ROOT" :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
          STATUS=$?
          REPORT="$ANIFLOW_ROOT/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== FULL LINT REPORT ====="
            cat "$REPORT"
            echo "===== END LINT REPORT ====="
          fi
          exit "$STATUS"

      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify release candidate
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-v1-release.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.0-rc1-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.0-rc1.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-ci-v1 -keypass aniflow-ci-v1 -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-ci-v1 --key-pass pass:aniflow-ci-v1 --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          unzip -l "$FINAL" | grep -q AndroidManifest.xml
          unzip -l "$FINAL" | grep -q classes.dex
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-deliverables"
          mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.0-rc1-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.0-rc1.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.0-rc1-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$OUT/"
          cp "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          if [ -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" ]; then cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/lint-results-debug.html"; fi

      - name: Upload deliverables
        uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.0-rc1-final
          path: ${{ runner.temp }}/aniflow-deliverables/*
          if-no-files-found: error

      - name: Publish scheduled result
        if: always() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/34/comments" \
            -f body="ANIFLOW_AUTOBUILD_DONE run_id=$GITHUB_RUN_ID status=$JOB_STATUS artifact=AniFlow-v1.0.0-rc1-final"
