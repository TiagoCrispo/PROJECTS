name: WA Vault v0.5.28 strict APP_CANCEL recovery

on:
  push:
    branches: [wa-vault-build-v0528]
    paths:
      - 'wa-vault-build-v0528/TRIGGER'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore exact verified v0.5.27 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0528-project
          gh run download 31929789590 -n WA-Vault-v0.5.27-source -D wa-vault-v0528-project
          grep -q 'versionCode = 77' wa-vault-v0528-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.27"' wa-vault-v0528-project/app/build.gradle.kts

      - name: Apply verified v0.5.28 hotfix
        run: |
          set -euo pipefail
          tr -d '\r\n\t ' < wa-vault-build-v0528/v0528.patch.gz.b64 | base64 -d > /tmp/v0528.patch.gz
          echo '9ef7bfc80e3aca64d474157f5d1d4a8e26a52cf5c6ba50e2a7cf34923b206dd5  /tmp/v0528.patch.gz' | sha256sum -c -
          gzip -dc /tmp/v0528.patch.gz > /tmp/v0528.patch
          echo '77f2d7ae850209a795f5b0b0090efca1ae1d64eb5cf176fb28daec4a8a668219  /tmp/v0528.patch' | sha256sum -c -
          cd wa-vault-v0528-project
          patch -p1 --batch < /tmp/v0528.patch
          find . -name '*.orig' -delete
          if find . -name '*.rej' -print -quit | grep -q .; then
            find . -name '*.rej' -print
            exit 1
          fi
          grep -q 'versionCode = 78' app/build.gradle.kts
          grep -q 'versionName = "0.5.28"' app/build.gradle.kts
          python3 tools/v0528_regression_test.py
          zip -qr /tmp/WA-Vault-v0.5.28-source.zip . -x './build/*' './app/build/*' './.gradle/*'
          sha256sum /tmp/WA-Vault-v0.5.28-source.zip > /tmp/SOURCE_SHA256.txt

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0528-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore stable WA Vault signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks

      - name: Sign and verify v0.5.28
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0528-project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          mkdir -p wa-vault-v0528-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0528-output/WA-Vault-v0.5.28-COMPLETED_VERIFIED.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            wa-vault-v0528-output/WA-Vault-v0.5.28-COMPLETED_VERIFIED.apk \
            > wa-vault-v0528-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0528-output/WA-Vault-v0.5.28-COMPLETED_VERIFIED.apk \
            > wa-vault-v0528-output/APK_SHA256.txt
          cp wa-vault-v0528-project/V0528_NOTES.md wa-vault-v0528-output/
          cp wa-vault-v0528-project/TEST_MATRIX.md wa-vault-v0528-output/
          cp wa-vault-v0528-project/tools/v0528_regression_test.py wa-vault-v0528-output/
          cp /tmp/WA-Vault-v0.5.28-source.zip wa-vault-v0528-output/
          cp /tmp/SOURCE_SHA256.txt wa-vault-v0528-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.28-release
          path: wa-vault-v0528-output/
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.28-source
          path: |
            /tmp/WA-Vault-v0.5.28-source.zip
            /tmp/SOURCE_SHA256.txt
          retention-days: 30
