name: WA Vault v0.5.28 strict APP_CANCEL recovery

on:
  push:
    branches: [wa-vault-build-v0528]
    paths:
      - 'wa-vault-build-v0528/TRIGGER'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified v0.5.28 source
        run: |
          set -euo pipefail
          cat wa-vault-build-v0528/b64/part00 \
              wa-vault-build-v0528/b64/part01 \
              wa-vault-build-v0528/b64/part02 \
              wa-vault-build-v0528/b64/part03 \
              wa-vault-build-v0528/b64/part04 \
              wa-vault-build-v0528/b64/part05 \
              wa-vault-build-v0528/b64/part06 \
            | tr -d '\r\n\t ' | base64 -d > /tmp/WA-Vault-v0.5.28-source.zip
          echo '813f1cb948edd414dd5ac53960f7f818e67bd3f6abea9bbbfaabebc1e47ff0f8  /tmp/WA-Vault-v0.5.28-source.zip' | sha256sum -c -
          mkdir wa-vault-v0528-project
          unzip -q /tmp/WA-Vault-v0.5.28-source.zip -d wa-vault-v0528-project
          grep -q 'versionCode = 78' wa-vault-v0528-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.28"' wa-vault-v0528-project/app/build.gradle.kts
          python3 wa-vault-v0528-project/tools/v0528_regression_test.py

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0528-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore stable WA Vault signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks

      - name: Sign and verify v0.5.28
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0528-project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$UNSIGNED"
          mkdir -p wa-vault-v0528-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0528-output/WA-Vault-v0.5.28-COMPLETED_VERIFIED.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs \
            wa-vault-v0528-output/WA-Vault-v0.5.28-COMPLETED_VERIFIED.apk \
            > wa-vault-v0528-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0528-output/WA-Vault-v0.5.28-COMPLETED_VERIFIED.apk \
            > wa-vault-v0528-output/APK_SHA256.txt
          cp wa-vault-v0528-project/V0528_NOTES.md wa-vault-v0528-output/
          cp wa-vault-v0528-project/TEST_MATRIX.md wa-vault-v0528-output/
          cp wa-vault-v0528-project/tools/v0528_regression_test.py wa-vault-v0528-output/
          cp /tmp/WA-Vault-v0.5.28-source.zip wa-vault-v0528-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.28-release
          path: wa-vault-v0528-output/
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.28-source
          path: /tmp/WA-Vault-v0.5.28-source.zip
          retention-days: 30
