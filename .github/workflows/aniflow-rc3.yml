name: AniFlow RC3 1080p Build

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: aniflow-rc3-build
  cancel-in-progress: true

jobs:
  android-rc3:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc3

    steps:
      - name: Checkout CI assets
        uses: actions/checkout@v5

      - name: JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"
          cache-read-only: true

      - name: Materialize exact successful RC2 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/aniflow-rc2-artifact
          mkdir -p "$ANIFLOW_ROOT" /tmp/aniflow-rc2-artifact
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9351315836/zip" > /tmp/aniflow-rc2-artifact.zip
          unzip -q /tmp/aniflow-rc2-artifact.zip -d /tmp/aniflow-rc2-artifact
          test -s /tmp/aniflow-rc2-artifact/AniFlow-v1.0.1-rc2-source.zip
          unzip -q /tmp/aniflow-rc2-artifact/AniFlow-v1.0.1-rc2-source.zip -d "$ANIFLOW_ROOT"
          grep -q 'versionName = "1.0.1-rc2"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Apply RC3 1080p and provider-resolution patch
        shell: bash
        run: |
          set -euo pipefail
          base64 -d .ci/aniflow-rc3.patch.gz.b64 | gzip -d > /tmp/aniflow-rc3.patch
          cd "$ANIFLOW_ROOT"
          patch -p1 --forward --batch < /tmp/aniflow-rc3.patch
          grep -q 'versionCode = 1000003' app/build.gradle.kts
          grep -q 'versionName = "1.0.2-rc3"' app/build.gradle.kts
          grep -q 'preferred_video_height_v2' app/src/main/java/com/aniflow/app/data/preferences/PlayerPreferencesRepository.kt
          grep -q 'DEFAULT_PREFERRED_VIDEO_HEIGHT = 1080' app/src/main/java/com/aniflow/app/data/preferences/PlayerPreferencesRepository.kt
          grep -q 'externalLinks { site url type language isDisabled }' app/src/main/java/com/aniflow/app/data/network/AniListApi.kt
          grep -q 'actualVideoHeight' app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt
          grep -q 'AniFlow ${BuildConfig.VERSION_NAME}' app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt
          ! grep -q 'Elegir vídeo' app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt
          ! grep -q 'OpenDocument' app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt

      - name: Regression guards Blocks 2-7
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in 2 3 4 5 6 7; do python3 "scripts/validate-block${gate}.py"; done

      - name: Live AniList One Piece provider diagnostic
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/anilist-one-piece-query.json <<'JSON'
          {"query":"query { Media(id: 21, type: ANIME) { id title { romaji english } streamingEpisodes { title url site } externalLinks { site url type language isDisabled } } }"}
          JSON
          curl --fail-with-body --silent --show-error \
            -H 'Content-Type: application/json' \
            -H 'Accept: application/json' \
            -H 'User-Agent: AniFlow/1.0 Android CI' \
            --data-binary @/tmp/anilist-one-piece-query.json \
            https://graphql.anilist.co > /tmp/anilist-one-piece.json
          jq -e '.data.Media.id == 21' /tmp/anilist-one-piece.json >/dev/null
          echo "ONE_PIECE_STREAMING_EPISODES=$(jq '.data.Media.streamingEpisodes | length' /tmp/anilist-one-piece.json)"
          echo "ONE_PIECE_EXTERNAL_LINKS=$(jq '.data.Media.externalLinks | length' /tmp/anilist-one-piece.json)"
          echo 'ONE_PIECE_STREAMING_SITES:'
          jq -r '.data.Media.streamingEpisodes[]? | "episode-link | \(.site // "unknown") | \(.title // "") | \(.url // "")"' /tmp/anilist-one-piece.json | head -20
          echo 'ONE_PIECE_EXTERNAL_STREAMING_PROVIDERS:'
          jq -r '.data.Media.externalLinks[]? | select(.isDisabled != true) | select(.type == "STREAMING") | "provider | \(.site) | \(.url)"' /tmp/anilist-one-piece.json | head -20

      - name: Gradle configuration
        run: gradle -p "$ANIFLOW_ROOT" help --stacktrace --no-daemon

      - name: Unit tests
        run: gradle -p "$ANIFLOW_ROOT" :app:testDebugUnitTest --stacktrace --no-daemon

      - name: Android lint
        shell: bash
        run: |
          set +e
          gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
          STATUS=$?
          REPORT="$ANIFLOW_ROOT/app/build/intermediates/lint_intermediate_text_report/debug/lintReportDebug/lint-results-debug.txt"
          if [ -f "$REPORT" ]; then
            echo "===== FULL LINT REPORT ====="
            cat "$REPORT"
            echo "===== END LINT REPORT ====="
          fi
          exit "$STATUS"

      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify RC3 release APK
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc3-release.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.2-rc3-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.2-rc3.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass aniflow-rc3-ci \
            -keypass aniflow-rc3-ci \
            -alias aniflow \
            -keyalg RSA -keysize 3072 -validity 3650 \
            -dname "CN=AniFlow Personal RC3, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-key-alias aniflow \
            --ks-pass pass:aniflow-rc3-ci \
            --key-pass pass:aniflow-rc3-ci \
            --out "$FINAL" \
            "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          unzip -l "$FINAL" | grep -q AndroidManifest.xml
          unzip -l "$FINAL" | grep -q classes.dex
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package RC3 deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-rc3-deliverables"
          mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.2-rc3-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.2-rc3.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.2-rc3-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$OUT/"
          cp "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          cp /tmp/anilist-one-piece.json "$OUT/anilist-one-piece-diagnostic.json"
          if [ -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" ]; then
            cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/lint-results-debug.html"
          fi

      - name: Upload RC3 deliverables
        uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.2-rc3
          path: ${{ runner.temp }}/aniflow-rc3-deliverables/*
          if-no-files-found: error
          retention-days: 30
