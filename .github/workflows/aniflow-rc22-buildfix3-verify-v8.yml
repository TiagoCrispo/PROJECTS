name: AniFlow RC22 Buildfix3 Verify V8
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: aniflow-rc22-buildfix3-verify-v8
  cancel-in-progress: true
jobs:
  verify:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC22_BUILDFIX3_VERIFY_V8'
    runs-on: ubuntu-24.04
    timeout-minutes: 70
    env:
      ROOT: /tmp/aniflow-rc22
    steps:
      - uses: actions/checkout@v5
      - name: Start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC22_BUILDFIX3_VERIFY_V8_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0', cache-read-only: true }

      - name: Reconstruct verified RC22 + buildfixes 1-3
        env: { GH_TOKEN: "${{ github.token }}" }
        run: bash "$GITHUB_WORKSPACE/.ci/rc22/reconstruct-buildfix3.sh"

      - name: Unit tests and Android Lint
        run: gradle -p "$ROOT" :app:testDebugUnitTest :app:lintDebug --stacktrace --no-daemon

      - name: Verify lint security gate
        shell: bash
        run: |
          set -euo pipefail
          REPORT="$ROOT/app/build/reports/lint-results-debug.txt"
          test -f "$REPORT"
          ! grep -q ': Error:' "$REPORT"
          ! grep -q '\[RequiresFeature\]' "$REPORT"
          ! grep -q 'addWebMessageListener should only be called if the feature WEB_MESSAGE_LISTENER is present' "$REPORT"
          ERRORS=$(grep -Ec '^[^ ].*:.*: Error:' "$REPORT" || true)
          WARNINGS=$(grep -Ec '^[^ ].*:.*: Warning:' "$REPORT" || true)
          echo "LINT_COUNTS errors=${ERRORS} warnings=${WARNINGS}"
          tail -n 100 "$REPORT"

      - name: Verify tests count
        shell: bash
        run: |
          set -euo pipefail
          XML_DIR="$ROOT/app/build/test-results/testDebugUnitTest"
          test -d "$XML_DIR"
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          files=glob.glob('/tmp/aniflow-rc22/app/build/test-results/testDebugUnitTest/TEST-*.xml')
          if not files: raise SystemExit('no junit xml files')
          tests=failures=errors=skipped=0
          for f in files:
              r=ET.parse(f).getroot()
              tests += int(r.attrib.get('tests',0))
              failures += int(r.attrib.get('failures',0))
              errors += int(r.attrib.get('errors',0))
              skipped += int(r.attrib.get('skipped',0))
          print(f'TEST_COUNTS tests={tests} failures={failures} errors={errors} skipped={skipped}')
          if tests != 64 or failures or errors:
              raise SystemExit(1)
          PY

      - name: Success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC22_BUILDFIX3_VERIFY_V8_OK run_id=${GITHUB_RUN_ID} tests=64/64 lint_errors=0 requires_feature=0"
      - name: Failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC22_BUILDFIX3_VERIFY_V8_FAILED run_id=${GITHUB_RUN_ID}"
