name: AniFlow RC11 1080p Intelligence Gate

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: aniflow-rc11-final
  cancel-in-progress: true

jobs:
  android-rc11-final:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC11_FINAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANIFLOW_ROOT: /tmp/aniflow-rc11

    steps:
      - name: Announce run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC11_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "9.5.0", cache-read-only: true }

      - name: Materialize latest RC10
        shell: bash
        env: { GH_TOKEN: "${{ github.token }}" }
        run: |
          set -euo pipefail
          rm -rf "$ANIFLOW_ROOT" /tmp/aniflow-rc10-artifact
          mkdir -p "$ANIFLOW_ROOT" /tmp/aniflow-rc10-artifact
          RUN_ID="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow aniflow-rc10-final.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$RUN_ID"
          ART_ID="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN_ID/artifacts" --jq '.artifacts[] | select(.name == "AniFlow-v1.0.9-rc10-final") | .id' | head -1)"
          test -n "$ART_ID"
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$ART_ID/zip" > /tmp/aniflow-rc10-artifact.zip
          unzip -q /tmp/aniflow-rc10-artifact.zip -d /tmp/aniflow-rc10-artifact
          unzip -q /tmp/aniflow-rc10-artifact/AniFlow-v1.0.9-rc10-source.zip -d "$ANIFLOW_ROOT"
          grep -q 'versionName = "1.0.9-rc10"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Apply RC11 1080p intelligence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$ANIFLOW_ROOT" <<'PY'
          from pathlib import Path
          import re, sys
          root=Path(sys.argv[1])

          policy=root/'app/src/main/java/com/aniflow/app/domain/VideoQualityPolicy.kt'
          policy.write_text('''package com.aniflow.app.domain

object VideoQualityPolicy {
    const val AUTO = 0
    const val P1080 = 1080
    const val P720 = 720
    const val P480 = 480
    val manualHeights = listOf(P1080, P720, P480)

    fun preferredMaxHeight(requestedHeight: Int): Int = when {
        requestedHeight <= 0 -> P1080
        requestedHeight >= P1080 -> P1080
        requestedHeight >= P720 -> P720
        else -> P480
    }

    fun labelForActualHeight(height: Int): String = when {
        height >= 2160 -> "2160p"
        height >= 1440 -> "1440p"
        height >= 1080 -> "1080p"
        height >= 720 -> "720p"
        height >= 480 -> "480p"
        height > 0 -> "${height}p"
        else -> "Auto"
    }
}
''')
          test=root/'app/src/test/java/com/aniflow/app/domain/VideoQualityPolicyTest.kt'
          test.parent.mkdir(parents=True,exist_ok=True)
          test.write_text('''package com.aniflow.app.domain

import org.junit.Assert.assertEquals
import org.junit.Test

class VideoQualityPolicyTest {
    @Test fun autoStillCapsAt1080ForDefaultPreference() {
        assertEquals(1080, VideoQualityPolicy.preferredMaxHeight(VideoQualityPolicy.AUTO))
    }
    @Test fun clampsManualRequestsToKnownQualityLevels() {
        assertEquals(1080, VideoQualityPolicy.preferredMaxHeight(1440))
        assertEquals(720, VideoQualityPolicy.preferredMaxHeight(900))
        assertEquals(480, VideoQualityPolicy.preferredMaxHeight(360))
    }
    @Test fun reportsActualResolutionWithoutPretending() {
        assertEquals("1080p", VideoQualityPolicy.labelForActualHeight(1080))
        assertEquals("720p", VideoQualityPolicy.labelForActualHeight(720))
        assertEquals("Auto", VideoQualityPolicy.labelForActualHeight(0))
    }
}
''')
          player=root/'app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt'
          source=player.read_text()
          helper='''\nprivate fun applyAniFlowVideoQuality(player: ExoPlayer, preferredHeight: Int) {\n    val maxHeight = com.aniflow.app.domain.VideoQualityPolicy.preferredMaxHeight(preferredHeight)\n    player.trackSelectionParameters = player.trackSelectionParameters\n        .buildUpon()\n        .setMaxVideoSize(Int.MAX_VALUE, maxHeight)\n        .setForceHighestSupportedBitrate(true)\n        .build()\n}\n'''
          if 'private fun applyAniFlowVideoQuality(' not in source:
              source += helper
          if 'applyAniFlowVideoQuality(player,' not in source.replace(helper,''):
              inserted=False
              for pattern in [
                  r'(var\s+isPlaying\s+by\s+remember\s*\{\s*mutableStateOf\(false\)\s*\}\s*\n)',
                  r'(var\s+isPlaying\s+by\s+remember\s*\{[^\n]+\}\s*\n)',
              ]:
                  if re.search(pattern,source):
                      source=re.sub(pattern, r'''\1\n    LaunchedEffect(player, state.preferredVideoHeight) {\n        applyAniFlowVideoQuality(player, state.preferredVideoHeight)\n    }\n''', source, count=1)
                      inserted=True; break
              if not inserted:
                  match=re.search(r'(val\s+playerViewHolder\s*=.*?\n)',source)
                  if match and 'state.preferredVideoHeight' in source:
                      pos=match.end()
                      source=source[:pos]+'\n    LaunchedEffect(player, state.preferredVideoHeight) {\n        applyAniFlowVideoQuality(player, state.preferredVideoHeight)\n    }\n'+source[pos:]
                      inserted=True
              if not inserted:
                  raise SystemExit('Could not wire RC11 video-quality preference')
          player.write_text(source)

          build=root/'app/build.gradle.kts'
          b=build.read_text()
          b=re.sub(r'(?m)^(\s*)versionCode\s*=\s*\d+\s*$', r'\1versionCode = 1000011', b)
          b=re.sub(r'(?m)^(\s*)versionName\s*=\s*"[^"]+"\s*$', r'\1versionName = "1.0.10-rc11"', b)
          build.write_text(b)

          validator=root/'scripts/validate-block15.py'
          validator.write_text('''#!/usr/bin/env python3
from pathlib import Path
ROOT=Path(__file__).resolve().parents[1]
PLAYER=(ROOT/"app/src/main/java/com/aniflow/app/feature/player/PlayerScreen.kt").read_text()
POLICY=(ROOT/"app/src/main/java/com/aniflow/app/domain/VideoQualityPolicy.kt").read_text()

def req(ok,msg):
    if not ok: raise SystemExit("BLOCK15_FAIL: "+msg)
req("setMaxVideoSize(Int.MAX_VALUE, maxHeight)" in PLAYER, "Media3 1080p cap missing")
req("setForceHighestSupportedBitrate(true)" in PLAYER, "highest bitrate preference missing")
req("state.preferredVideoHeight" in PLAYER, "quality preference not wired")
req("P1080 = 1080" in POLICY, "1080p policy missing")
req("labelForActualHeight" in POLICY, "actual resolution labels missing")
req("NATIVE_WEB_FALLBACK_ENABLED = false" in PLAYER, "native-only guarantee regressed")
print("BLOCK15_1080P_INTELLIGENCE_OK")
''')
          validator.chmod(0o755)
          PY
          grep -q 'versionName = "1.0.10-rc11"' "$ANIFLOW_ROOT/app/build.gradle.kts"

      - name: Regression guards Blocks 2-15
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANIFLOW_ROOT"
          for gate in $(seq 2 15); do test -f "scripts/validate-block${gate}.py"; python3 "scripts/validate-block${gate}.py"; done
          bash scripts/validate-pure-kotlin.sh
          bash scripts/validate-network-kotlin.sh
          bash scripts/validate-data-kotlin.sh
          bash scripts/validate-viewmodels-kotlin.sh
          bash scripts/validate-ui-syntax.sh

      - name: Unit tests
        run: gradle -p "$ANIFLOW_ROOT" :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Android lint
        run: gradle -p "$ANIFLOW_ROOT" :app:lintDebug --stacktrace --no-daemon
      - name: Assemble debug and release
        run: gradle -p "$ANIFLOW_ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon

      - name: Sign and verify RC11
        shell: bash
        run: |
          set -euo pipefail
          TOOLS="$ANDROID_HOME/build-tools/36.0.0"
          UNSIGNED="$ANIFLOW_ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"
          KEYSTORE="$RUNNER_TEMP/aniflow-rc11-release.jks"
          ALIGNED="$RUNNER_TEMP/AniFlow-v1.0.10-rc11-aligned.apk"
          FINAL="$RUNNER_TEMP/AniFlow-v1.0.10-rc11.apk"
          test -s "$UNSIGNED"
          keytool -genkeypair -v -keystore "$KEYSTORE" -storepass aniflow-rc11-ci -keypass aniflow-rc11-ci -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow Personal RC11, OU=Android, O=AniFlow, L=Mendoza, C=AR"
          "$TOOLS/zipalign" -p -f 4 "$UNSIGNED" "$ALIGNED"
          "$TOOLS/apksigner" sign --ks "$KEYSTORE" --ks-key-alias aniflow --ks-pass pass:aniflow-rc11-ci --key-pass pass:aniflow-rc11-ci --out "$FINAL" "$ALIGNED"
          "$TOOLS/apksigner" verify --verbose --print-certs "$FINAL"
          unzip -t "$FINAL" >/dev/null
          "$TOOLS/aapt" dump badging "$FINAL" | tee "$RUNNER_TEMP/apk-badging.txt"
          sha256sum "$FINAL" | tee "$RUNNER_TEMP/apk-sha256.txt"

      - name: Package deliverables
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/aniflow-rc11-deliverables"; mkdir -p "$OUT"
          (cd "$ANIFLOW_ROOT" && zip -qr "$OUT/AniFlow-v1.0.10-rc11-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*')
          cp "$RUNNER_TEMP/AniFlow-v1.0.10-rc11.apk" "$OUT/"
          cp "$ANIFLOW_ROOT/app/build/outputs/apk/debug/app-debug.apk" "$OUT/AniFlow-v1.0.10-rc11-debug.apk"
          cp "$RUNNER_TEMP/apk-sha256.txt" "$RUNNER_TEMP/apk-badging.txt" "$OUT/"
          test ! -f "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" || cp "$ANIFLOW_ROOT/app/build/reports/lint-results-debug.html" "$OUT/"
      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.10-rc11-final
          path: ${{ runner.temp }}/aniflow-rc11-deliverables/*
          if-no-files-found: error
          retention-days: 30
      - name: Announce success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC11_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.10-rc11-final"
