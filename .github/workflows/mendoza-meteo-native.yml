name: Mendoza Meteo Native X10

on:
  push:
    branches: [mendoza-meteo-native-v6]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Provider contract smoke
        run: python3 mendoza-meteo-native/tools/provider_smoke.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 36
        run: yes | sdkmanager --licenses >/dev/null && sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.5.0'
      - name: Unit tests, lint and clean builds
        run: gradle -p mendoza-meteo-native clean testDebugUnitTest lintRelease assembleDebug assembleRelease --stacktrace
      - name: Inspect release output
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p -v 4 \
            mendoza-meteo-native/app/build/outputs/apk/release/app-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            mendoza-meteo-native/app/build/outputs/apk/release/app-release-unsigned.apk \
            | grep -E "package:|sdkVersion:|targetSdkVersion:"
          unzip -t mendoza-meteo-native/app/build/outputs/apk/release/app-release-unsigned.apk
