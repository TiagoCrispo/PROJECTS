name: Mendoza Meteo Native X10

on:
  push:
    branches: [mendoza-meteo-native-v6]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  provider-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Provider contract smoke
        run: python3 mendoza-meteo-native/tools/provider_smoke.py

  official-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Official alert source smoke
        run: python3 mendoza-meteo-native/tools/official_alert_smoke.py

  release-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Static release hardening contract
        run: python3 mendoza-meteo-native/tools/release_contract.py

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
        with:
          packages: ''
      - name: Install Android SDK 36
        run: sdkmanager "platform-tools" "platforms;android-36" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
        with:
          cache-provider: basic
      - name: Verify committed Gradle Wrapper
        run: |
          test -x mendoza-meteo-native/gradlew
          grep -F 'gradle-9.5.0-bin.zip' mendoza-meteo-native/gradle/wrapper/gradle-wrapper.properties
          grep -F 'distributionSha256Sum=553c78f50dafcd54d65b9a444649057857469edf836431389695608536d6b746' mendoza-meteo-native/gradle/wrapper/gradle-wrapper.properties
          (cd mendoza-meteo-native && ./gradlew --version)
      - name: Unit tests, lint and warning-clean builds
        run: (cd mendoza-meteo-native && ./gradlew clean testDebugUnitTest lintRelease assembleDebug assembleRelease --stacktrace --warning-mode fail)
      - name: Inspect release output
        run: |
          APK=mendoza-meteo-native/app/build/outputs/apk/release/app-release-unsigned.apk
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -p -v 4 "$APK"
          BADGING="$($AAPT dump badging "$APK")"
          echo "$BADGING" | grep -E "package:|sdkVersion:|targetSdkVersion:"
          echo "$BADGING" | grep "versionCode='66'"
          echo "$BADGING" | grep "versionName='6.6-native-dev'"
          "$AAPT" dump permissions "$APK" | grep "android.permission.POST_NOTIFICATIONS"
          ! "$AAPT" dump permissions "$APK" | grep -q "android.permission.ACCESS_BACKGROUND_LOCATION"
          ! "$AAPT" dump permissions "$APK" | grep -q "android.permission.SCHEDULE_EXACT_ALARM"
          "$AAPT" dump xmltree "$APK" AndroidManifest.xml | grep "com.mendozameteo.x10.LauncherActivity"
          unzip -t "$APK"
