name: Build BandLab v0.9

on:
  push:
    branches: ['agent/bandlab-v09-build']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reconstruct project
        run: |
          sha256sum v09/part_*.b64
          cat v09/part_00.b64 v09/part_01.b64 v09/part_02.b64 v09/part_03.b64 v09/part_04.b64 v09/part_05.b64 v09/part_06.b64 v09/part_07.b64 | base64 -d > /tmp/BandLabNative_v09_project.zip
          echo "80887ff56ae0d35b91f4706da8c83df193f2c19da31341190e9aafb46067116b  /tmp/BandLabNative_v09_project.zip" | sha256sum -c -
          unzip -q /tmp/BandLabNative_v09_project.zip
          grep -q "0.9.0-test" BandLabNative_v09/app/build.gradle
      - name: Build APK
        working-directory: BandLabNative_v09
        run: gradle --no-daemon :app:assembleDebug --stacktrace
      - name: Verify APK
        run: |
          test -f BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
          file BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
          sha256sum BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        with:
          name: BandLab9Active-v0.9-test-apk
          path: BandLabNative_v09/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 1
