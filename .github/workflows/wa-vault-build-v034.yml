name: WA Vault v0.3.4 build

on:
  push:
    branches: [wa-vault-build-v034]
    paths:
      - 'wa-vault-build-v034/**'
      - '.github/workflows/wa-vault-build-v034.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Reconstruct verified v0.3.2 base
        shell: bash
        run: |
          set -euo pipefail
          cat \
            wa-vault-build-v032-small/part-000.b64 \
            wa-vault-build-v032-small/part-001.b64 \
            wa-vault-build-v032-small/part-002.b64 \
            wa-vault-build-v032-small/part-003.b64 \
            wa-vault-build-v032-small/part-004.b64 \
            wa-vault-build-v032-small/part-005.b64 \
            wa-vault-build-v032-small/part-006.b64 \
            wa-vault-build-v032-small/part-007a.b64 \
            wa-vault-build-v032-small/part-007b.b64 \
            wa-vault-build-v032-small/part-008a.b64 \
            wa-vault-build-v032-small/part-008b.b64 > /tmp/project.b64
          base64 -d /tmp/project.b64 > /tmp/project.tar.xz
          echo 'a5933b2452ec76b37f552a8bb42bb14045de3c3d8b80d5aee27a9526981ac90b  /tmp/project.tar.xz' | sha256sum -c -
          xz -t /tmp/project.tar.xz
          rm -rf wa-vault-v034-project
          mkdir -p wa-vault-v034-project
          tar -xJf /tmp/project.tar.xz -C wa-vault-v034-project
          grep -q 'versionCode = 32' wa-vault-v034-project/app/build.gradle.kts

      - name: Apply verified v0.3.4 patch
        shell: bash
        run: |
          set -euo pipefail
          cat wa-vault-build-v034/patch-0.b64 wa-vault-build-v034/patch-1.b64 > /tmp/v034.patch.xz.b64
          base64 -d /tmp/v034.patch.xz.b64 > /tmp/v034.patch.xz
          echo 'a0dda46d8de11d2bf341a49a5b4b083fceb7e00701f84b03e4aa5dfef628b9a0  /tmp/v034.patch.xz' | sha256sum -c -
          xz -t /tmp/v034.patch.xz
          xz -dc /tmp/v034.patch.xz > /tmp/v034.patch
          cd wa-vault-v034-project
          set +e
          patch -p4 -F3 --batch < /tmp/v034.patch
          patch_rc=$?
          set -e
          python3 - <<'PY'
          from pathlib import Path
          p=Path('app/src/main/java/com/fer/wavault/MainActivity.java')
          s=p.read_text()
          rej=Path('app/src/main/java/com/fer/wavault/MainActivity.java.rej')
          if rej.exists():
              lines=rej.read_text().splitlines(True)
              desired=[]
              in_hunk=False
              for line in lines:
                  if line.startswith('@@'):
                      in_hunk=True
                      continue
                  if not in_hunk or line.startswith(('---','+++')):
                      continue
                  if line.startswith('+') or line.startswith(' '):
                      desired.append(line[1:])
                  elif line.startswith('\\'):
                      continue
              block=''.join(desired)
              anchor='        LinearLayout capture=card();'
              start=s.index(anchor, s.index('    private void showSettings(){'))
              end=s.index('    private boolean hasAllMediaPermissions()', start)
              s=s[:start]+block+s[end:]
          s=s.replace('    private boolean openedBatterySettings = false;\n        openedSamsungSettings = false;\n    private boolean openedSamsungSettings = false;', '    private boolean openedBatterySettings = false;\n    private boolean openedSamsungSettings = false;')
          s=s.replace('        openedBatterySettings = false;\n        if (cameBack) {', '        openedBatterySettings = false;\n        openedSamsungSettings = false;\n        if (cameBack) {')
          # Repair Java strings that the original large patch represented across physical lines.
          import re
          s=re.sub(r'private TextView diagRow\(String label,String value\)\{return text\(label\+"\s*"\+\(value==null\|\|value\.isEmpty\(\)\?"Sin datos":value\),12,muted,false\);\}', 'private TextView diagRow(String label,String value){return text(label+"\\n"+(value==null||value.isEmpty()?"Sin datos":value),12,muted,false);}', s)
          start=s.index('    private void showStorageManager(){')
          end=s.index('    private void confirmDeleteUnlinkedMedia(){',start)
          storage='''    private void showStorageManager(){
              VaultDb.Stats st;try{st=db.getStats();}catch(Throwable t){st=new VaultDb.Stats();}
              String msg="WA Vault usa "+human(st.totalBytes)+"\\n\\n"
                      +"Fotos  "+human(st.imageBytes)+"\\n"
                      +"Videos  "+human(st.videoBytes)+"\\n"
                      +"Audio  "+human(st.audioBytes)+"\\n\\n"
                      +st.media+" archivos guardados"
                      +(st.unlinkedMedia>0?"\\n"+st.unlinkedMedia+" sin mensaje asociado":"")
                      +"\\n\\nEstas limpiezas solo borran copias de WA Vault; no modifican WhatsApp.";
              String[] opts={"Borrar archivos sin mensaje asociado","Borrar archivos >30 días","Borrar archivos >90 días","Limpiar caché de miniaturas","Borrar todos los archivos"};
              new AlertDialog.Builder(this).setTitle("Almacenamiento recuperado").setMessage(msg).setItems(opts,(d,w)->{
                  if(w==0)confirmDeleteUnlinkedMedia();
                  else if(w==1)confirmDeleteOldMedia(30);
                  else if(w==2)confirmDeleteOldMedia(90);
                  else if(w==3){MediaThumbnailLoader.clearDiskCache(this);Toast.makeText(this,"Caché de miniaturas limpiada",Toast.LENGTH_SHORT).show();}
                  else if(w==4)confirmClear(true);
              }).setNegativeButton("Cerrar",null).show();
          }

          '''
          s=s[:start]+storage+s[end:]
          p.write_text(s)
          PY
          grep -q 'versionCode = 34' app/build.gradle.kts
          grep -q 'versionName = "0.3.4"' app/build.gradle.kts
          grep -q 'class VaultUiNotifier' app/src/main/java/com/fer/wavault/VaultUiNotifier.java
          grep -q 'ingestGrowingDirectMedia' app/src/main/java/com/fer/wavault/MediaArchiver.java
          grep -q 'getStats()' app/src/main/java/com/fer/wavault/VaultDb.java
          grep -q 'private void showDiagnostics()' app/src/main/java/com/fer/wavault/MainActivity.java
          grep -q 'private void confirmDeleteUnlinkedMedia()' app/src/main/java/com/fer/wavault/MainActivity.java

      - uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build unsigned release APK
        working-directory: wa-vault-v034-project
        shell: bash
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Verify build output
        shell: bash
        run: |
          set -euo pipefail
          APK=wa-vault-v034-project/app/build/outputs/apk/release/app-release-unsigned.apk
          test -s "$APK"
          sha256sum "$APK" | tee wa-vault-v034-project/APK_UNSIGNED_SHA256.txt
          cp "$ANDROID_HOME/build-tools/35.0.0/lib/apksigner.jar" wa-vault-v034-project/apksigner.jar
          test -s wa-vault-v034-project/apksigner.jar

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.3.4-unsigned
          path: |
            wa-vault-v034-project/app/build/outputs/apk/release/app-release-unsigned.apk
            wa-vault-v034-project/apksigner.jar
            wa-vault-v034-project/APK_UNSIGNED_SHA256.txt
            wa-vault-v034-project/CHANGELOG.md
            wa-vault-v034-project/README.md
