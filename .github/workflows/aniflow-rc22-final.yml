name: AniFlow RC22 Final APK
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  actions: read
  issues: write
concurrency:
  group: aniflow-rc22-final
  cancel-in-progress: true
jobs:
  build:
    if: github.event.issue.number == 37 && github.event.comment.body == 'RUN_ANIFLOW_RC22_FINAL'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      ROOT: /tmp/aniflow-rc22
    steps:
      - uses: actions/checkout@v5
      - name: Start
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC22_FINAL_STARTED run_id=${GITHUB_RUN_ID}"
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '9.5.0', cache-read-only: true }
      - name: Reconstruct RC22 exactly
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf "$ROOT" /tmp/base && mkdir -p "$ROOT" /tmp/base
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/9454593341/zip" > /tmp/base.zip
          echo "5c6f820cdeec2fc5c3ef0e8b41bf30109e641e1aa7cb385afbf979bc57b7ac3c  /tmp/base.zip" | sha256sum -c -
          unzip -q /tmp/base.zip -d /tmp/base
          unzip -q /tmp/base/AniFlow-v1.0.16-rc17-source.zip -d "$ROOT"

          echo '--- RC21 patch parts ---'
          ls -l "$GITHUB_WORKSPACE/.ci/rc21/parts"
          cat "$GITHUB_WORKSPACE"/.ci/rc21/parts/part-* > /tmp/rc21.b64
          wc -c /tmp/rc21.b64
          test "$(wc -c < /tmp/rc21.b64)" = 46872
          base64 -d /tmp/rc21.b64 > /tmp/rc21.gz
          echo "3fb3cbd791c64044f456b131d04dcc7f2d94069d0922b7b5fe9a2472bdcfd889  /tmp/rc21.gz" | sha256sum -c -
          gzip -dc /tmp/rc21.gz > /tmp/rc21.patch
          echo "495f31394da8ea022d37b4ae67bce8358e8901b46b5067bf294f91319cbef466  /tmp/rc21.patch" | sha256sum -c -
          (cd "$ROOT" && patch -p1 --forward --batch < /tmp/rc21.patch)
          grep -q 'versionCode = 1000021' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "1.0.20-rc21"' "$ROOT/app/build.gradle.kts"

          echo '--- RC22 patch parts ---'
          ls -l "$GITHUB_WORKSPACE/.ci/rc22/parts"
          cat "$GITHUB_WORKSPACE"/.ci/rc22/parts/part-* > /tmp/rc22.b64
          wc -c /tmp/rc22.b64
          sha256sum /tmp/rc22.b64
          test "$(wc -c < /tmp/rc22.b64)" = 71320
          echo "4241bfd76ce3b6b165f38c028ac7fb5b4c1496c8b84077e537763bdd0df717fe  /tmp/rc22.b64" | sha256sum -c -
          base64 -d /tmp/rc22.b64 > /tmp/rc22.gz
          sha256sum /tmp/rc22.gz
          echo "d2595eba913d2f6d6a1f38f41b2550401bafd7ce6675f6125d7bd47d709d4035  /tmp/rc22.gz" | sha256sum -c -
          gzip -dc /tmp/rc22.gz > /tmp/rc22.patch
          sha256sum /tmp/rc22.patch
          echo "155d5649ab70d3310baf9e4eff9282b3d5759d728d7411c05522f533580ab89e  /tmp/rc22.patch" | sha256sum -c -
          (cd "$ROOT" && patch -p1 --forward --batch < /tmp/rc22.patch)
          grep -q 'versionCode = 1000022' "$ROOT/app/build.gradle.kts"
          grep -q 'versionName = "1.0.21-rc22"' "$ROOT/app/build.gradle.kts"
      - name: Source gates
        shell: bash
        run: |
          set -euxo pipefail
          cd "$ROOT"
          python3 scripts/validate-block22.py
          python3 scripts/validate-block23.py
          python3 scripts/validate-block24.py
          python3 scripts/validate-block25.py
          python3 scripts/validate-block26.py
          python3 scripts/validate-block27.py
          python3 scripts/validate-block28.py
          bash scripts/validate-network-kotlin.sh
          bash scripts/validate-data-kotlin.sh
          bash scripts/validate-viewmodels-kotlin.sh
          bash scripts/validate-catalog-client-kotlin.sh
          bash scripts/validate-resolver-kotlin.sh
          bash scripts/validate-ui-syntax.sh
          cd playback-catalog
          npm test
          node scripts/validate-catalog.js
      - name: Unit tests
        run: gradle -p "$ROOT" :app:testDebugUnitTest --stacktrace --no-daemon
      - name: Lint
        run: gradle -p "$ROOT" :app:lintDebug --stacktrace --no-daemon
      - name: Assemble
        run: gradle -p "$ROOT" :app:assembleDebug :app:assembleRelease --stacktrace --no-daemon
      - name: Sign and verify
        shell: bash
        run: |
          set -euxo pipefail
          T="$ANDROID_HOME/build-tools/36.0.0"; U="$ROOT/app/build/outputs/apk/release/app-release-unsigned.apk"; D="$ROOT/app/build/outputs/apk/debug/app-debug.apk"
          K="$RUNNER_TEMP/rc22.jks"; A="$RUNNER_TEMP/rc22-aligned.apk"; F="$RUNNER_TEMP/AniFlow-v1.0.21-rc22.apk"
          test -s "$U"; test -s "$D"
          keytool -genkeypair -keystore "$K" -storepass aniflow-rc22 -keypass aniflow-rc22 -alias aniflow -keyalg RSA -keysize 3072 -validity 3650 -dname "CN=AniFlow RC22,OU=Android,O=AniFlow,L=Mendoza,C=AR"
          "$T/zipalign" -p -f 4 "$U" "$A"
          "$T/apksigner" sign --ks "$K" --ks-key-alias aniflow --ks-pass pass:aniflow-rc22 --key-pass pass:aniflow-rc22 --out "$F" "$A"
          "$T/apksigner" verify --verbose --print-certs "$F" | tee "$RUNNER_TEMP/apksigner.txt"
          "$T/aapt" dump badging "$F" | tee "$RUNNER_TEMP/badging.txt"
          grep -q "package: name='com.aniflow.app'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionCode='1000022'" "$RUNNER_TEMP/badging.txt"
          grep -q "versionName='1.0.21-rc22'" "$RUNNER_TEMP/badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/badging.txt"
          unzip -t "$F" >/dev/null
          sha256sum "$F" "$D" | tee "$RUNNER_TEMP/sha256.txt"
      - name: Package
        shell: bash
        run: |
          set -euxo pipefail
          O="$RUNNER_TEMP/out"; mkdir -p "$O"
          cp "$RUNNER_TEMP/AniFlow-v1.0.21-rc22.apk" "$O/"
          cp "$ROOT/app/build/outputs/apk/debug/app-debug.apk" "$O/AniFlow-v1.0.21-rc22-debug.apk"
          cp "$RUNNER_TEMP/apksigner.txt" "$RUNNER_TEMP/badging.txt" "$RUNNER_TEMP/sha256.txt" "$O/"
          (cd "$ROOT" && zip -qr "$O/AniFlow-v1.0.21-rc22-source.zip" . -x '.gradle/*' '.idea/*' '.kotlin/*' 'app/build/*' '**/build/*' 'playback-catalog/node_modules/*')
      - uses: actions/upload-artifact@v4
        with:
          name: AniFlow-v1.0.21-rc22-final
          path: ${{ runner.temp }}/out/*
          if-no-files-found: error
          retention-days: 30
      - name: Success
        if: success()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC22_FINAL_SUCCESS run_id=${GITHUB_RUN_ID} artifact=AniFlow-v1.0.21-rc22-final"
      - name: Failure
        if: failure()
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh issue comment 37 --repo "$GITHUB_REPOSITORY" --body "ANIFLOW_RC22_FINAL_FAILED run_id=${GITHUB_RUN_ID}"
