name: WA Vault Android CI

on:
  push:
    paths:
      - 'projects/wa-vault/**'
  pull_request:
    paths:
      - 'projects/wa-vault/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/wa-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate pinned Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          ./gradlew --version
      - name: Build and verify
        shell: bash
        run: |
          set +e
          tools/build_and_verify.sh > "$RUNNER_TEMP/wavault-build.log" 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo '--- WA Vault compact Gradle failure ---'
            grep -E -i 'FAILURE:|What went wrong|Execution failed|error:|ERROR:|Caused by:|Exception|Could not|failed' "$RUNNER_TEMP/wavault-build.log" | tail -n 180 || true
            echo '--- tail ---'
            tail -n 80 "$RUNNER_TEMP/wavault-build.log" || true
          else
            tail -n 80 "$RUNNER_TEMP/wavault-build.log" || true
          fi
          exit $rc
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-vault-v0.5.31-build-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            projects/wa-vault/app/build/outputs/apk/debug/*.apk
            projects/wa-vault/app/build/outputs/apk/androidTest/debug/*.apk
            projects/wa-vault/app/build/outputs/apk/release/*.apk
            projects/wa-vault/app/build/outputs/bundle/release/*.aab
            projects/wa-vault/app/build/outputs/mapping/release/**
            projects/wa-vault/app/build/outputs/wavault-release-evidence/**
            projects/wa-vault/app/build/reports/lint-results-*.xml
            projects/wa-vault/app/build/reports/tests/**
            projects/wa-vault/app/build/test-results/**
            ${{ runner.temp }}/wavault-build.log

  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/wa-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reproducible optimized release
        shell: bash
        run: |
          set +e
          tools/verify_reproducible_release.sh > "$RUNNER_TEMP/wavault-repro.log" 2>&1
          rc=$?
          if [[ $rc -ne 0 ]]; then
            echo '--- WA Vault compact reproducibility failure ---'
            grep -E -i 'FAILURE:|What went wrong|Execution failed|error:|ERROR:|Caused by:|Exception|Could not|failed|REPRO' "$RUNNER_TEMP/wavault-repro.log" | tail -n 180 || true
            echo '--- tail ---'
            tail -n 80 "$RUNNER_TEMP/wavault-repro.log" || true
          else
            tail -n 80 "$RUNNER_TEMP/wavault-repro.log" || true
          fi
          exit $rc
      - name: Upload reproducibility log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-vault-v0.5.31-repro-log
          if-no-files-found: warn
          retention-days: 14
          path: ${{ runner.temp }}/wavault-repro.log

  emulator:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate pinned Gradle wrapper
        working-directory: projects/wa-vault
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          ./gradlew --version
      - name: Android 15 instrumented acceptance
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          script: cd projects/wa-vault && ./gradlew connectedDebugAndroidTest --stacktrace
      - name: Upload emulator evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-vault-v0.5.31-emulator-evidence
          if-no-files-found: warn
          retention-days: 14
          path: |
            projects/wa-vault/app/build/reports/androidTests/connected/**
            projects/wa-vault/app/build/outputs/androidTest-results/**
            projects/wa-vault/app/build/outputs/apk/debug/*.apk
            projects/wa-vault/app/build/outputs/apk/androidTest/debug/*.apk
