name: WA Vault Android CI

on:
  push:
    paths:
      - 'projects/wa-vault/**'
  pull_request:
    paths:
      - 'projects/wa-vault/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wa-vault-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    defaults:
      run:
        working-directory: projects/wa-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Generate pinned Gradle wrapper
        run: |
          gradle wrapper --gradle-version 8.13 --distribution-type bin
          ./gradlew --version
      - name: Build and verify
        run: tools/build_and_verify.sh
      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wa-vault-v0.5.31-build-evidence
          if-no-files-found: error
          retention-days: 14
          path: |
            projects/wa-vault/app/build/outputs/apk/debug/*.apk
            projects/wa-vault/app/build/outputs/apk/androidTest/debug/*.apk
            projects/wa-vault/app/build/outputs/apk/release/*.apk
            projects/wa-vault/app/build/outputs/bundle/release/*.aab
            projects/wa-vault/app/build/outputs/mapping/release/**
            projects/wa-vault/app/build/outputs/wavault-release-evidence/**
            projects/wa-vault/app/build/reports/lint-results-*.xml
            projects/wa-vault/app/build/reports/tests/**
            projects/wa-vault/app/build/test-results/**

  reproducibility:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    defaults:
      run:
        working-directory: projects/wa-vault
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Reproducible optimized release
        run: tools/verify_reproducible_release.sh