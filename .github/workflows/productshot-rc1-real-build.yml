name: ProductShot RC1 real Android build

on:
  pull_request:
    branches:
      - main
    paths:
      - ".ci/productshot-rc1-clean/**"
      - ".github/workflows/productshot-rc1-real-build.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-rc:
    name: lint + R8 + signed internal RC
    runs-on: ubuntu-24.04
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 17
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5 release line
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          gradle-version: "9.5.0"
          cache-disabled: true

      - name: Reconstruct verified ProductShot source
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE="$GITHUB_WORKSPACE/.ci/productshot-rc1-clean/android.tar.gz"
          PROJECT="$RUNNER_TEMP/productshot-rc1"
          echo "930cfa0c2a9471e449e95e3f6628555fdd5392f482fd5be83c12bb05b6846022  $ARCHIVE" | sha256sum -c -
          mkdir -p "$PROJECT"
          tar -xzf "$ARCHIVE" -C "$PROJECT"
          test -s "$PROJECT/app/src/main/java/com/productshot/app/MainActivity.java"
          grep -q "com.android.application.*9.3.1" "$PROJECT/build.gradle"
          grep -q "compileSdk 36" "$PROJECT/app/build.gradle"
          grep -q "targetSdk 36" "$PROJECT/app/build.gradle"
          grep -q "minSdk 29" "$PROJECT/app/build.gradle"
          grep -q 'android:authorities="${applicationId}.files"' "$PROJECT/app/src/main/AndroidManifest.xml"
          grep -q 'BuildConfig.APPLICATION_ID + ".files"' "$PROJECT/app/src/main/java/com/productshot/app/ShareFileProvider.java"
          test -s "$PROJECT/app/src/main/res/xml/full_backup_rules.xml"
          test -s "$PROJECT/app/src/main/res/xml/data_extraction_rules.xml"
          grep -q '<monochrome' "$PROJECT/app/src/main/res/mipmap-anydpi/ic_launcher.xml"

      - name: Ensure Android API 36 and Build Tools 36.0.0
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          test -n "$SDK_ROOT"
          SDKMANAGER="$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          if [[ ! -x "$SDKMANAGER" ]]; then SDKMANAGER="$(command -v sdkmanager || true)"; fi
          test -x "$SDKMANAGER"
          # No automatic license acceptance. The hosted runner must already be licensed.
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;36.0.0"
          test -f "$SDK_ROOT/platforms/android-36/android.jar"
          test -x "$SDK_ROOT/build-tools/36.0.0/aapt2"
          test -x "$SDK_ROOT/build-tools/36.0.0/apksigner"

      - name: Confirm toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          gradle --version | grep -q 'Gradle 9.5.0'

      - name: Lint and build optimized internal RC
        shell: bash
        run: |
          set -euo pipefail
          PROJECT="$RUNNER_TEMP/productshot-rc1"
          gradle -p "$PROJECT" :app:clean :app:lintRc :app:assembleRc --stacktrace --no-daemon

      - name: Verify APK metadata, archive and signature
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-}}"
          PROJECT="$RUNNER_TEMP/productshot-rc1"
          APK="$PROJECT/app/build/outputs/apk/rc/app-rc.apk"
          OUT="$RUNNER_TEMP/productshot-rc1-deliverables"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          unzip -l "$APK" | grep -q 'AndroidManifest.xml'
          unzip -l "$APK" | grep -q 'classes.dex'
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose "$APK"
          "$SDK_ROOT/build-tools/36.0.0/aapt2" dump badging "$APK" | tee "$RUNNER_TEMP/productshot-badging.txt"
          grep -q "package: name='com.productshot.app.rc'" "$RUNNER_TEMP/productshot-badging.txt"
          grep -q "minSdkVersion:'29'" "$RUNNER_TEMP/productshot-badging.txt"
          grep -q "targetSdkVersion:'36'" "$RUNNER_TEMP/productshot-badging.txt"
          mkdir -p "$OUT"
          cp "$APK" "$OUT/ProductShot-v0.1.0-rc1-internal.apk"
          cp "$RUNNER_TEMP/productshot-badging.txt" "$OUT/"
          sha256sum "$OUT/ProductShot-v0.1.0-rc1-internal.apk" | tee "$OUT/ProductShot-v0.1.0-rc1-internal.sha256"
          if [[ -f "$PROJECT/app/build/reports/lint-results-rc.txt" ]]; then
            cp "$PROJECT/app/build/reports/lint-results-rc.txt" "$OUT/"
          elif [[ -f "$PROJECT/app/build/reports/lint-results.txt" ]]; then
            cp "$PROJECT/app/build/reports/lint-results.txt" "$OUT/"
          fi
          if [[ -f "$PROJECT/app/build/reports/lint-results-rc.html" ]]; then
            cp "$PROJECT/app/build/reports/lint-results-rc.html" "$OUT/"
          fi

      - name: Upload internal validation artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4 release line
        with:
          name: ProductShot-v0.1.0-rc1-real-build
          path: ${{ runner.temp }}/productshot-rc1-deliverables/*
          if-no-files-found: error
          retention-days: 7
