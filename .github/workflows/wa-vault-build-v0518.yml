name: WA Vault v0.5.18 no-backup diagnostics

on:
  push:
    branches: [wa-vault-build-v0518]
    paths:
      - 'wa-vault-build-v0518/**'
      - '.github/workflows/wa-vault-build-v0518.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Restore verified v0.5.17 source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir wa-vault-v0518-project
          gh run download 31919783305 -n WA-Vault-v0.5.17-source -D wa-vault-v0518-project
          grep -q 'versionCode = 67' wa-vault-v0518-project/app/build.gradle.kts
          grep -q 'versionName = "0.5.17"' wa-vault-v0518-project/app/build.gradle.kts

      - name: Apply v0.5.18 transformation and regressions
        run: |
          set -euo pipefail
          cp wa-vault-build-v0518/apply_v0518.py wa-vault-v0518-project/apply_v0518.py
          cd wa-vault-v0518-project
          sed -i '/exec(compile(reg/d' apply_v0518.py
          python3 apply_v0518.py
          python3 -c 'from pathlib import Path; p=Path("app/src/main/java/com/fer/wavault/MainActivity.java"); s=p.read_text(); a=s.index("private String buildTechnicalDiagnostics()"); b=s.index("private void showPartialAttemptsDialog",a); p.write_text(s[:a]+s[a:b].replace("\\\\n","\\n")+s[b:])'
          python3 tools/v0518_regression_test.py
          grep -q 'versionCode = 68' app/build.gradle.kts
          grep -q 'versionName = "0.5.18"' app/build.gradle.kts
          test ! -e app/src/main/java/com/fer/wavault/PortableBackupManager.java
          ! grep -R -n -E 'PORTABLE_BACKUP_CREATE_REQ|PORTABLE_BACKUP_RESTORE_REQ|pendingPortableBackupPassword|showCreatePortableBackupDialog|choosePortableBackupToRestore|runPortableBackup|runPortableRestore|listMediaForPortableBackup|\.wavb' app/src/main/java
          rm -f apply_v0518.py

      - uses: android-actions/setup-android@v3
      - name: Install Android SDK 35
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Compile release
        working-directory: wa-vault-v0518-project
        run: gradle :app:assembleRelease --stacktrace --console=plain

      - name: Restore stable signing key
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p signing
          gh run download 31869556369 -n WA-Vault-v0.4.0-signing-backup-fixed -D signing
          test -s signing/WA-Vault-v0.4.0-signing-backup.jks

      - name: Sign and verify v0.5.18
        run: |
          set -euo pipefail
          UNSIGNED=wa-vault-v0518-project/app/build/outputs/apk/release/app-release-unsigned.apk
          mkdir -p wa-vault-v0518-output
          PASS='WAVault-v040-2026'
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks signing/WA-Vault-v0.4.0-signing-backup.jks \
            --ks-key-alias wavault \
            --ks-pass pass:"$PASS" \
            --key-pass pass:"$PASS" \
            --out wa-vault-v0518-output/WA-Vault-v0.5.18.apk "$UNSIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose --print-certs wa-vault-v0518-output/WA-Vault-v0.5.18.apk > wa-vault-v0518-output/APK_SIGNATURE.txt
          sha256sum wa-vault-v0518-output/WA-Vault-v0.5.18.apk > wa-vault-v0518-output/APK_SHA256.txt
          cp wa-vault-v0518-project/V0518_NOTES.md wa-vault-v0518-output/
          cp wa-vault-v0518-project/TEST_MATRIX.md wa-vault-v0518-output/
          cp wa-vault-v0518-project/tools/v0518_regression_test.py wa-vault-v0518-output/

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.18-release
          path: |
            wa-vault-v0518-output/WA-Vault-v0.5.18.apk
            wa-vault-v0518-output/APK_SHA256.txt
            wa-vault-v0518-output/APK_SIGNATURE.txt
            wa-vault-v0518-output/V0518_NOTES.md
            wa-vault-v0518-output/TEST_MATRIX.md
            wa-vault-v0518-output/v0518_regression_test.py
          retention-days: 90

      - uses: actions/upload-artifact@v4
        with:
          name: WA-Vault-v0.5.18-source
          path: wa-vault-v0518-project
          retention-days: 30
