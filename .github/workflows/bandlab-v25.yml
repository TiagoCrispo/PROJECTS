name: BandLab 2.5 Offline Training Resilience Verification

on:
  push:
    branches: [ bandlab-v2 ]
  workflow_dispatch:

concurrency:
  group: bandlab-v25
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 65
    env:
      SOURCE_SHA256: 7d696773dea791c0637db14082e71f9e537799e84c46221f6c90b3e4d9455f5a
      V22_PATCH_SHA256: a18aba0039255ea2b19ae5cf5c4de286161c82dcd85f2c0b1867e6dd982e4b5b
      V23_PATCH_SHA256: 5820a5a20a39db7d80ebe11b3342102a06cb12f816931d7f29b192c52009fa8
      V24_PATCH_SHA256: e7684fcb4dbdc7a97bfd2a66a6fdd6385353824939334a028af94675a4424cbc
      V25_PATCH_SHA256: a8c666c116711500457690f088b61a18845bce3c0fa294b7e8d268da1fb9c2cb
      V25_XZ_SHA256: 6f0ef1a6a494206a9ed4489e344310f7d54f1d35c6811238c23d1cfbc1c933af
      KODO_COMMIT: 8152ffdd3f384e0563a39db7bf77a8b70d3a6e84
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct verified 2.4 and apply 2.5 patch
        shell: bash
        run: |
          set -euo pipefail
          cat src_chunks/00.b64 src_chunks/01a.b64 src_chunks/01b.b64 src_chunks/02.b64 src_chunks/03.b64 src_chunks/04.b64 src_chunks/05.b64 src_chunks/06.b64 | base64 -d > /tmp/base.tar.xz
          echo "$SOURCE_SHA256  /tmp/base.tar.xz" | sha256sum -c -
          mkdir work && tar -xJf /tmp/base.tar.xz -C work
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/app/build.gradle.kts')
          p.write_text(p.read_text().replace('builtins { named("java") { option("lite") } }','builtins { maybeCreate("java").apply { option("lite") } }'))
          p=Path('work/app/src/main/java/com/fer/bandlab/ui/BandLabApp.kt')
          s=p.read_text()
          if 'import androidx.compose.foundation.layout.RowScope' not in s:
              s=s.replace('import androidx.compose.foundation.layout.WindowInsets\n','import androidx.compose.foundation.layout.WindowInsets\nimport androidx.compose.foundation.layout.RowScope\n')
          s=s.replace('private fun NavItem(current: AppTab, target: AppTab, icon: ImageVector, onClick: (AppTab) -> Unit) {','private fun RowScope.NavItem(current: AppTab, target: AppTab, icon: ImageVector, onClick: (AppTab) -> Unit) {')
          p.write_text(s)
          p=Path('work/app/src/main/java/com/fer/bandlab/ui/screens/HealthScreen.kt')
          p.write_text(p.read_text().replace('import androidx.compose.material.icons.rounded.Walk\n',''))
          PY
          python3 ci/patch_v21.py work
          cat ci/patch_v22_0*.txt > /tmp/patch_v22.py
          echo "$V22_PATCH_SHA256  /tmp/patch_v22.py" | sha256sum -c -
          python3 /tmp/patch_v22.py work
          cat ci/v23_patch_00.b64 ci/v23_patch_01.b64 ci/v23_patch_02.b64 ci/v23_patch_03.b64 ci/v23_patch_04.b64 ci/v23_patch_05.b64 ci/v23_patch_06.b64 | base64 -d > /tmp/v23.patch
          echo "$V23_PATCH_SHA256  /tmp/v23.patch" | sha256sum -c -
          patch -d work -p4 --batch < /tmp/v23.patch
          printf 'versionName=2.3.0\nversionCode=230\nstage=DynamicHomeRecovery\n' > work/bandlab-version.properties
          cat ci/patch_v24_0*.txt > /tmp/v24.patch
          echo "$V24_PATCH_SHA256  /tmp/v24.patch" | sha256sum -c -
          patch -d work -p1 --batch < /tmp/v24.patch
          cat ci/v25_patch_xz_00.b64 ci/v25_patch_xz_01.b64 ci/v25_patch_xz_02.b64 ci/v25_patch_xz_03.b64 | base64 -d > /tmp/v25.patch.xz
          echo "$V25_XZ_SHA256  /tmp/v25.patch.xz" | sha256sum -c -
          xz -dc /tmp/v25.patch.xz > /tmp/v25.patch
          echo "$V25_PATCH_SHA256  /tmp/v25.patch" | sha256sum -c -
          patch -d work -p4 --batch < /tmp/v25.patch
          grep -q 'versionName = "2.5.0"' work/app/build.gradle.kts
          grep -q 'versionCode = 250' work/app/build.gradle.kts
          grep -q 'WorkoutRecoveryStore' work/app/src/main/java/com/fer/bandlab/training/WorkoutService.kt
          grep -q 'HeartRateZones' work/app/src/main/java/com/fer/bandlab/ui/screens/SettingsScreen.kt
          grep -q 'TrainingPreflightChecker' work/app/src/main/java/com/fer/bandlab/BandLabViewModel.kt
          grep -q 'BandLabBackupManager' work/app/src/main/java/com/fer/bandlab/BandLabViewModel.kt
          grep -q 'GpsAccuracyMode' work/app/src/main/java/com/fer/bandlab/training/GpsQuality.kt
          ! find work -type f \( -iname '*.p12' -o -iname '*.jks' -o -iname '*.pem' -o -iname '*.key' \) | grep -q .

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" "emulator" "system-images;android-30;default;x86_64"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Import pinned Xiaomi protocol
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/kidneyweakx/Kodo.git /tmp/Kodo
          git -C /tmp/Kodo checkout "$KODO_COMMIT"
          test "$(git -C /tmp/Kodo rev-parse HEAD)" = "$KODO_COMMIT"
          X=/tmp/Kodo/android-port/src/main/java/com/kidneyweakx/miband9active/xiaomi
          D=work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi
          mkdir -p "$D" "$D/services" work/app/src/main/proto work/third_party/Kodo
          cp -R "$X/auth" "$X/protocol" "$X/activity" "$D/"
          cp "$X/services/SystemCommands.kt" "$X/services/MiBand9DataUploader.kt" "$D/services/"
          cp /tmp/Kodo/android-port/src/main/proto/xiaomi.proto work/app/src/main/proto/
          cp /tmp/Kodo/LICENSE /tmp/Kodo/NOTICE.md work/third_party/Kodo/
          echo "$KODO_COMMIT" > work/third_party/Kodo/COMMIT.txt
          python3 - <<'PY'
          from pathlib import Path
          p=Path('work/app/src/main/java/com/kidneyweakx/miband9active/xiaomi/protocol/MiBand9BleDriver.kt')
          s=p.read_text()
          old='''            is XiaomiSppPacketV2.Data -> {\n                sendAck(packet.sequenceNumber)\n                val plain = packet.decryptedPayload(authSession)\n                val cmd = runCatching { XiaomiProto.Command.parseFrom(plain) }.getOrNull()\n'''
          new='''            is XiaomiSppPacketV2.Data -> {\n                sendAck(packet.sequenceNumber)\n                val plain = packet.decryptedPayload(authSession)\n                if (packet.channel == XiaomiChannel.ACTIVITY) {\n                    _activityChunks.tryEmit(plain)\n                    return\n                }\n                val cmd = runCatching { XiaomiProto.Command.parseFrom(plain) }.getOrNull()\n'''
          if old not in s: raise SystemExit('activity patch anchor missing')
          s=s.replace(old,new,1)
          s=s.replace('''        if (channel == XiaomiChannel.ACTIVITY) {\n            _activityChunks.tryEmit(cmd.toByteArray())\n            return\n        }\n''','')
          p.write_text(s)
          PY
          printf '%s\n' 'BandLab patch: raw ACTIVITY chunks bypass protobuf parsing.' > work/third_party/Kodo/BANDLAB_PATCHES.txt

      - name: Gate 2.5 - unit tests and builds
        working-directory: work
        run: gradle --no-daemon :app:assembleV24Debug :app:testV25DebugUnitTest :app:assembleV25Debug :app:assembleV25Release

      - name: Validate 2.5 APK metadata
        shell: bash
        run: |
          set -euo pipefail
          D=work/app/build/outputs/apk/v25/debug/app-v25-debug.apk
          R=work/app/build/outputs/apk/v25/release/app-v25-release-unsigned.apk
          test -s "$D"; test -s "$R"
          unzip -t "$D" >/dev/null; unzip -t "$R" >/dev/null
          "$ANDROID_HOME/build-tools/36.0.0/aapt2" dump badging "$D" | tee /tmp/badging-v25.txt
          grep -q "package: name='com.fer.bandlab'" /tmp/badging-v25.txt
          grep -q "versionCode='250'" /tmp/badging-v25.txt
          grep -q "versionName='2.5.0'" /tmp/badging-v25.txt

      - name: Upgrade smoke test 2.4 to 2.5
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_AVD_HOME="$RUNNER_TEMP/android-avd"
          mkdir -p "$ANDROID_AVD_HOME" verification
          echo no | avdmanager create avd -n bandlab_ci -k "system-images;android-30;default;x86_64" --device pixel_4 --force
          nohup "$ANDROID_HOME/emulator/emulator" -avd bandlab_ci -no-window -noaudio -no-boot-anim -gpu swiftshader_indirect -accel off -no-snapshot -no-metrics -memory 2048 -cores 2 >/tmp/emulator.log 2>&1 &
          timeout 180s adb wait-for-device
          for i in $(seq 1 180); do
            [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r')" = 1 ] && break
            sleep 2
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = 1
          V24=work/app/build/outputs/apk/v24/debug/app-v24-debug.apk
          V25=work/app/build/outputs/apk/v25/debug/app-v25-debug.apk
          timeout 240s adb install "$V24"
          timeout 60s adb shell am start -n com.fer.bandlab/.MainActivity | tee verification/v24-start.txt
          sleep 5
          test -n "$(adb shell pidof com.fer.bandlab | tr -d '\r')"
          timeout 240s adb install -r "$V25"
          adb shell am force-stop com.fer.bandlab
          adb logcat -c
          timeout 60s adb shell am start -n com.fer.bandlab/.MainActivity | tee verification/v25-start.txt
          sleep 8
          PID="$(adb shell pidof com.fer.bandlab | tr -d '\r')"
          test -n "$PID"
          echo "PID=$PID" > verification/v25-process.txt
          adb shell dumpsys activity activities > verification/v25-activities.txt
          grep -q 'com.fer.bandlab/.MainActivity' verification/v25-activities.txt
          adb shell dumpsys package com.fer.bandlab | grep -E 'versionCode|versionName|WorkoutService' > verification/v25-package.txt
          grep -q 'versionCode=250' verification/v25-package.txt
          grep -q 'versionName=2.5.0' verification/v25-package.txt
          adb logcat -d -t 1800 > verification/v25-logcat.txt
          ! grep -E 'FATAL EXCEPTION|Process: com\.fer\.bandlab.*has died|AndroidRuntime.*com\.fer\.bandlab' verification/v25-logcat.txt
          echo '2.4 -> 2.5 UPGRADE + STARTUP PASS' > verification/v25-PASS.txt

      - name: Package BandLab 2.5
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp work/app/build/outputs/apk/v25/debug/app-v25-debug.apk dist/BandLab9Active_v2.5_OFFLINE_TRAINING_DEBUG_VERIFIED.apk
          cp work/app/build/outputs/apk/v25/release/app-v25-release-unsigned.apk dist/BandLab9Active_v2.5_OFFLINE_TRAINING_RELEASE_UNSIGNED.apk
          cp -R verification dist/verification
          cp /tmp/emulator.log dist/emulator.log || true
          cat > dist/VERIFICATION_REPORT.txt <<'REPORT'
          BandLab 2.5 Offline Training Resilience.
          Verified: full base/v2.2/v2.3/v2.4/v2.5 hash chain, unit tests, debug+release builds,
          package/version metadata, Android emulator upgrade 2.4 -> 2.5, MainActivity foreground/process,
          WorkoutService packaging, and fatal-crash scan.
          2.5 adds offline preflight, configurable GNSS quality profiles, pace smoothing/outlier rejection,
          persistent workout recovery/autosave, notification workout actions, smarter auto-pause,
          advanced workout summary/history/local comparisons, HR zone engine and in-app explanations,
          strength progression/routine flow, dashboard sizes, Band status, backups excluding Xiaomi secrets,
          and local-first privacy guidance.
          Emulator cannot physically validate satellite GNSS acquisition or live HR/BLE behavior of the user's M2435B1.
          HR zone durations are only shown when real live HR samples exist; no zone time is fabricated.
          REPORT
          (cd work && zip -qr ../dist/BandLab9Active_v2.5_SOURCE_COMPLETE.zip . -x 'app/build/*' '.gradle/*' 'build/*')
          sha256sum dist/*.apk dist/*.zip > dist/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: BandLab-v2.5-offline-training-verified
          path: dist/
          if-no-files-found: error
