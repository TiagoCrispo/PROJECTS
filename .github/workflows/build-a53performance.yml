name: Build A53 Performance APK

on:
  push:
    branches: [a53performance-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct source archive
        run: |
          cat a53-source.part00 a53-source.part01 > a53-source.b64
          base64 -d a53-source.b64 > A53Performance-source-fixed.zip
          unzip -t A53Performance-source-fixed.zip
          rm -rf build-src
          mkdir build-src
          unzip -q A53Performance-source-fixed.zip -d build-src
          test -f build-src/A53Performance/settings.gradle.kts

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-src/A53Performance
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare APK
        run: |
          mkdir -p release
          cp build-src/A53Performance/app/build/outputs/apk/debug/app-debug.apk release/A53Performance-v1.0-debug.apk
          sha256sum release/A53Performance-v1.0-debug.apk | tee release/SHA256.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.0-APK
          path: |
            release/A53Performance-v1.0-debug.apk
            release/SHA256.txt
          if-no-files-found: error
          retention-days: 30
