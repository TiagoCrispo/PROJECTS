name: Build A53 Performance APK

on:
  push:
    branches: [a53performance-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct A53 v1.4.0
        run: |
          cat v11f-00 v11f-01 v11f-02a v11f-02b v11f-02c v11f-02d v11f-03 v11f-04 v11f-05 v11f-06a v11f-06b0 v11f-06b1a v11f-06b1b v11f-07 > v11f.b64
          test "$(wc -c < v11f.b64)" -eq 62020
          base64 -d v11f.b64 > A53Performance-v1.1-source.zip
          test "$(wc -c < A53Performance-v1.1-source.zip)" -eq 46515
          echo "978e60067f751ed50978f8e7efd2e7ec06d57047a8c413dfe10c4fc36e2ce29e  A53Performance-v1.1-source.zip" | sha256sum -c -
          rm -rf build-src && mkdir build-src
          unzip -q A53Performance-v1.1-source.zip -d build-src
          sed -i 's/Settings.ACTION_MANAGE_STORAGE/Settings.ACTION_INTERNAL_STORAGE_SETTINGS/g' build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/CleanerScreen.kt

          cat v12ov_00 v12ov_01 v12ov_02 v12ov_03 > v12-overlay.b64
          test "$(wc -c < v12-overlay.b64)" -eq 25320
          base64 -d v12-overlay.b64 > v12-overlay.tar.gz
          test "$(wc -c < v12-overlay.tar.gz)" -eq 18990
          echo "19b03389ff3d5501260d5c352ce583c7214a401a4a246bf188cf1216aec6940b  v12-overlay.tar.gz" | sha256sum -c -
          tar -xzf v12-overlay.tar.gz -C build-src/A53Performance

          SVC=build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/PrivilegedUserService.kt
          sed -i \
            -e 's/class PrivilegedUserService : IPrivilegedService.Stub() {/class PrivilegedUserService : IPrivilegedService.Stub {/' \
            -e 's/^    constructor()$/    constructor() : super()/' \
            -e 's/constructor(context: Context) : this()/constructor(context: Context) : super()/' \
            "$SVC"
          grep -q 'buildConfig = true' build-src/A53Performance/app/build.gradle.kts || sed -i '/aidl = true/a\        buildConfig = true' build-src/A53Performance/app/build.gradle.kts
          python3 v121_patch.py
          python3 v122_patch.py
          python3 v123_patch.py

          python3 -c "from pathlib import Path; p=bytearray(Path('v13ov_05').read_bytes()); assert len(p)==6000 and p[926]==112; p[926]=80; Path('v13ov_05.fixed').write_bytes(p); q=Path('v13ov_06').read_bytes(); assert len(q)==5192 and q[5146:5174]==b'fheXgenofn4Xl4Hp6H5+F5eB6eh+'; Path('v13ov_06.fixed').write_bytes(q[:5146]+q[5174:])"
          cat v13ov_00 v13ov_01 v13ov_02 v13ov_03 v13ov_04 v13ov_05.fixed v13ov_06.fixed > v13-overlay.b64
          test "$(wc -c < v13-overlay.b64)" -eq 41164
          base64 -d v13-overlay.b64 > v13-overlay.tar.gz
          test "$(wc -c < v13-overlay.tar.gz)" -eq 30871
          echo "757b12568441ea015e5c30abaf6389250f82618c7ace9259ae79256ad16772ba  v13-overlay.tar.gz" | sha256sum -c -
          tar -xzf v13-overlay.tar.gz -C build-src/A53Performance

          CR=build-src/A53Performance/app/src/main/java/com/fer/a53performance/data/CleanerRepository.kt
          python3 -c "from pathlib import Path; p=Path('$CR'); s=p.read_text(); s=s.replace('val items = exact.map { file ->','val items = exact.sortedByDescending { it.lastModifiedSafe() }.map { file ->').replace('}.sortedByDescending { it.lastModifiedSafe() }','}').replace('cache[key]?.let { known -> inherited = known; break }','val known = cache[key]; if (known != null) { inherited = known; break }'); p.write_text(s)"

          cat v131bin_00 v131bin_01 v131bin_02 v131bin_03 v131bin_04 > v131-overlay.tar.gz
          test "$(wc -c < v131-overlay.tar.gz)" -eq 18725
          echo "3f96cf2d5e2b48ad76b9728cab8fe78ad9810034673bdfedd3d8f71c8b0ddb25  v131-overlay.tar.gz" | sha256sum -c -
          tar -xzf v131-overlay.tar.gz -C build-src/A53Performance

          cat v132bin_00 v132bin_01 v132bin_02 v132bin_03 v132bin_04 v132bin_05 > v132-overlay.tar.gz
          test "$(wc -c < v132-overlay.tar.gz)" -eq 20770
          echo "53b33a7845bf08e057bc0107a889f774d182eaa620348e4fc9827ec9fd049f9f  v132-overlay.tar.gz" | sha256sum -c -
          tar -xzf v132-overlay.tar.gz -C build-src/A53Performance

          cat v140b64_00 v140b64_01 v140b64_02 v140b64_03 v140b64_04 v140b64_05 v140b64_06 > v140-overlay.b64
          test "$(wc -c < v140-overlay.b64)" -eq 20072
          base64 -d v140-overlay.b64 > v140-overlay.tar.gz
          test "$(wc -c < v140-overlay.tar.gz)" -eq 15053
          echo "05058057554c5ebd3b4b1ca8d78213a1a2515da27d55eef9039d51eb09232d63  v140-overlay.tar.gz" | sha256sum -c -
          tar -xzf v140-overlay.tar.gz -C build-src/A53Performance

          grep -q 'versionName = "1.4.0"' build-src/A53Performance/app/build.gradle.kts
          grep -q 'versionCode = 10' build-src/A53Performance/app/build.gradle.kts
          grep -q 'Ahorro extremo de datos' build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/ModesScreen.kt
          grep -q 'setExtremeDataSaver' build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/ShizukuController.kt
          grep -q 'RUN_ANY_IN_BACKGROUND ignore' build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/ShizukuController.kt
          grep -q 'Instagram Súper Lite' build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/ModesScreen.kt
          if grep -q 'ACCESS_NOTIFICATION_POLICY' build-src/A53Performance/app/src/main/AndroidManifest.xml; then exit 1; fi

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable A53 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: a53performance-stable-debug-key-v1

      - name: Verify stable signing key
        run: |
          test -f ~/.android/debug.keystore
          echo "fb0a0e1354df4ff9029e7784db12ec1f436936295041c61f45d7ec0f4fe641e8  $HOME/.android/debug.keystore" | sha256sum -c -

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-src/A53Performance
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare downloads
        run: |
          mkdir -p release
          cp build-src/A53Performance/app/build/outputs/apk/debug/app-debug.apk release/A53Performance-v1.4.0-DATA-SAVER-STABLE.apk
          sha256sum release/A53Performance-v1.4.0-DATA-SAVER-STABLE.apk | tee release/SHA256.txt
          sha256sum ~/.android/debug.keystore | awk '{print $1 "  signing-key"}' > release/SIGNING_KEY_SHA256.txt
          echo 'A53 Performance v1.4.0 DATA SAVER' > release/LEEME.txt
          echo 'Ahorro extremo de datos: todas las apps de usuario restringidas salvo Brave y ChatGPT.' >> release/LEEME.txt
          echo 'Modo Lite por app para Instagram, TikTok, Spotify y WhatsApp; reversible mediante Shizuku.' >> release/LEEME.txt
          echo 'Los ajustes internos de cada app se abren como asistente: no se modifican bases privadas ni datos de usuario.' >> release/LEEME.txt
          cd release
          zip -q A53Performance-v1.4.0-DATA-SAVER-STABLE.zip A53Performance-v1.4.0-DATA-SAVER-STABLE.apk SHA256.txt SIGNING_KEY_SHA256.txt LEEME.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.4.0-DATA-SAVER-STABLE
          path: |
            release/A53Performance-v1.4.0-DATA-SAVER-STABLE.apk
            release/SHA256.txt
            release/SIGNING_KEY_SHA256.txt
            release/LEEME.txt
            release/A53Performance-v1.4.0-DATA-SAVER-STABLE.zip
          if-no-files-found: error
          retention-days: 30

# v1.4 build trigger from complete overlay
