name: Build A53 Performance APK

on:
  push:
    branches: [a53performance-build]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct stable base and apply v1.3 Ultimate overlay
        run: |
          cat v11f-00 v11f-01 v11f-02a v11f-02b v11f-02c v11f-02d v11f-03 v11f-04 v11f-05 v11f-06a v11f-06b0 v11f-06b1a v11f-06b1b v11f-07 > v11f.b64
          test "$(wc -c < v11f.b64)" -eq 62020
          base64 -d v11f.b64 > A53Performance-v1.1-source.zip
          test "$(wc -c < A53Performance-v1.1-source.zip)" -eq 46515
          echo "978e60067f751ed50978f8e7efd2e7ec06d57047a8c413dfe10c4fc36e2ce29e  A53Performance-v1.1-source.zip" | sha256sum -c -
          unzip -t A53Performance-v1.1-source.zip
          rm -rf build-src
          mkdir build-src
          unzip -q A53Performance-v1.1-source.zip -d build-src
          test -f build-src/A53Performance/settings.gradle.kts
          sed -i 's/Settings.ACTION_MANAGE_STORAGE/Settings.ACTION_INTERNAL_STORAGE_SETTINGS/g' build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/CleanerScreen.kt

          cat v12ov_00 v12ov_01 v12ov_02 v12ov_03 > v12-overlay.b64
          test "$(wc -c < v12-overlay.b64)" -eq 25320
          base64 -d v12-overlay.b64 > v12-overlay.tar.gz
          test "$(wc -c < v12-overlay.tar.gz)" -eq 18990
          echo "19b03389ff3d5501260d5c352ce583c7214a401a4a246bf188cf1216aec6940b  v12-overlay.tar.gz" | sha256sum -c -
          tar -xzf v12-overlay.tar.gz -C build-src/A53Performance

          SVC=build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/PrivilegedUserService.kt
          sed -i \
            -e 's/class PrivilegedUserService : IPrivilegedService.Stub() {/class PrivilegedUserService : IPrivilegedService.Stub {/' \
            -e 's/^    constructor()$/    constructor() : super()/' \
            -e 's/constructor(context: Context) : this()/constructor(context: Context) : super()/' \
            "$SVC"
          grep -q 'buildConfig = true' build-src/A53Performance/app/build.gradle.kts || \
            sed -i '/aidl = true/a\        buildConfig = true' build-src/A53Performance/app/build.gradle.kts

          python3 v121_patch.py
          python3 v122_patch.py
          python3 v123_patch.py

          cat v13ov_00 v13ov_01 v13ov_02 v13ov_03 v13ov_04 v13ov_05 v13ov_06 > v13-overlay.b64
          test "$(wc -c < v13-overlay.b64)" -eq 41164
          base64 -d v13-overlay.b64 > v13-overlay.tar.gz
          test "$(wc -c < v13-overlay.tar.gz)" -eq 30871
          echo "757b12568441ea015e5c30abaf6389250f82618c7ace9259ae79256ad16772ba  v13-overlay.tar.gz" | sha256sum -c -
          tar -xzf v13-overlay.tar.gz -C build-src/A53Performance

          # Cosmetic accounting fix: after smart cache cleanup compare only the packages that were targeted.
          python3 - <<'PY'
          from pathlib import Path
          p = Path('build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/CleanerScreen.kt')
          s = p.read_text()
          old = '''                        val before = smartCacheBytes
                        val out = onClearAppCaches(smartCacheApps.map { it.packageName })
                        refreshApps()
                        val after = appStats.filter { !it.systemApp }.sumOf { it.cacheBytes }
'''
          new = '''                        val targetPackages = smartCacheApps.map { it.packageName }.toSet()
                        val before = smartCacheApps.sumOf { it.cacheBytes }
                        val out = onClearAppCaches(targetPackages)
                        refreshApps()
                        val after = appStats.filter { it.packageName in targetPackages }.sumOf { it.cacheBytes }
'''
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

          grep -q 'versionName = "1.3.0"' build-src/A53Performance/app/build.gradle.kts
          grep -q 'versionCode = 7' build-src/A53Performance/app/build.gradle.kts
          grep -q 'StorageScanService' build-src/A53Performance/app/src/main/AndroidManifest.xml
          ! grep -q 'ACCESS_NOTIFICATION_POLICY' build-src/A53Performance/app/src/main/AndroidManifest.xml
          grep -q 'FOREGROUND_SERVICE_DATA_SYNC' build-src/A53Performance/app/src/main/AndroidManifest.xml
          grep -q 'pm clear --cache-only' build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/ShizukuController.kt
          grep -q 'cmd game mode performance' build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/ShizukuController.kt
          grep -q 'set-standby-bucket' build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/ShizukuController.kt
          grep -q 'restrict-background' build-src/A53Performance/app/src/main/java/com/fer/a53performance/shizuku/ShizukuController.kt
          grep -q 'CleanerTab.JUNK' build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/CleanerScreen.kt
          grep -q 'CleanerTab.DUPLICATES' build-src/A53Performance/app/src/main/java/com/fer/a53performance/ui/screens/CleanerScreen.kt
          grep -q 'Configurar todo' build-src/A53Performance/app/src/main/java/com/fer/a53performance/PermissionOnboarding.kt

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restore stable A53 signing key
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: a53performance-stable-debug-key-v1

      - name: Verify stable signing key
        run: |
          test -f ~/.android/debug.keystore
          echo "SIGNING_KEY_SHA256=$(sha256sum ~/.android/debug.keystore | awk '{print $1}')"
          echo "fb0a0e1354df4ff9029e7784db12ec1f436936295041c61f45d7ec0f4fe641e8  $HOME/.android/debug.keystore" | sha256sum -c -

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: build-src/A53Performance
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Prepare downloads
        run: |
          mkdir -p release
          cp build-src/A53Performance/app/build/outputs/apk/debug/app-debug.apk release/A53Performance-v1.3.0-ULTIMATE-STABLE.apk
          sha256sum release/A53Performance-v1.3.0-ULTIMATE-STABLE.apk | tee release/SHA256.txt
          sha256sum ~/.android/debug.keystore | awk '{print $1 "  signing-key"}' > release/SIGNING_KEY_SHA256.txt
          cat > release/LEEME.txt <<'TXT'
          A53 Performance v1.3.0 ULTIMATE

          - Storage Inspector persistente en segundo plano con progreso.
          - Basura segura, duplicados exactos, archivos grandes, WhatsApp, ocultos y apps.
          - Limpieza por app usa pm clear --cache-only: no borra cuentas ni datos de usuario.
          - Gaming: 120 Hz, ahorro desactivado, Game Mode PERFORMANCE cuando Android lo permite.
          - Bateria maxima: 60 Hz, ahorro/adaptativo, Data Saver y standby restringido para apps de usuario.
          - Protegidas en bateria: ChatGPT, Brave, Word/Microsoft 365, Spotify y WhatsApp.
          - No molestar nunca es activado por A53 Performance.
          - No se desactivan protecciones termicas.
          TXT
          cd release
          zip -q A53Performance-v1.3.0-ULTIMATE-STABLE.zip A53Performance-v1.3.0-ULTIMATE-STABLE.apk SHA256.txt SIGNING_KEY_SHA256.txt LEEME.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: A53Performance-v1.3.0-ULTIMATE-STABLE
          path: |
            release/A53Performance-v1.3.0-ULTIMATE-STABLE.apk
            release/SHA256.txt
            release/SIGNING_KEY_SHA256.txt
            release/LEEME.txt
            release/A53Performance-v1.3.0-ULTIMATE-STABLE.zip
          if-no-files-found: error
          retention-days: 30
