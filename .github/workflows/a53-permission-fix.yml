name: A53 Permission Flow Patch
on:
  push:
    paths:
      - 'A53Performance/PERMISSION_FIX_READY'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/a53-performance-v1154
      - name: Patch first-open permission chain
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java')
          s=p.read_text()
          old='    private boolean scanRunning=false;\n'
          new='    private boolean scanRunning=false;\n    private boolean waitingForAllFiles=false;\n'
          assert old in s
          s=s.replace(old,new,1)
          old='    private void continuePermissionFlow(){if(Build.VERSION.SDK_INT>=30&&!Environment.isExternalStorageManager()){openAllFilesSettings();return;}if(!shell.permissionGranted())shell.requestPermission(SHIZUKU_REQUEST);}\n'
          new='    private void continuePermissionFlow(){if(Build.VERSION.SDK_INT>=30&&!Environment.isExternalStorageManager()){waitingForAllFiles=true;openAllFilesSettings();return;}requestShizukuIfNeeded();}\n    private void requestShizukuIfNeeded(){if(!shell.permissionGranted())shell.requestPermission(SHIZUKU_REQUEST);}\n    @Override protected void onResume(){super.onResume();if(waitingForAllFiles){waitingForAllFiles=false;main.postDelayed(this::requestShizukuIfNeeded,300);}}\n'
          assert old in s
          s=s.replace(old,new,1)
          p.write_text(s)
          PY
          git config user.name 'ChatGPT Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add A53Performance/app/src/main/java/com/fer/a53performance/MainActivity.java
          git commit -m 'Complete first-open permission chain'
          git push origin HEAD:agent/a53-performance-v1154
