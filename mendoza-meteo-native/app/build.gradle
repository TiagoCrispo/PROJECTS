plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.mendozameteo.x10'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.mendozameteo.x10'
        minSdk = 24
        targetSdk = 36
        versionCode = 68
        versionName = '6.8-native-dev'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        // Keep source-level warnings fatal. Android 24-29 compatibility still
        // requires deprecated framework APIs, while WorkManager 2.11.x exposes
        // optional Room annotation metadata that javac reports as classfile noise.
        options.compilerArgs += ['-Xlint:all,-deprecation,-classfile', '-Werror']
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
