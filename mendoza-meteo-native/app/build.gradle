plugins {
    id 'com.android.application'
}

android {
    namespace = 'com.mendozameteo.x10'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.mendozameteo.x10'
        minSdk = 24
        targetSdk = 36
        versionCode = 67
        versionName = '6.7-native-dev'
    }

    buildFeatures {
        buildConfig = true
    }

    buildTypes {
        release {
            minifyEnabled = false
            shrinkResources = false
        }
        debug {
            applicationIdSuffix = '.debug'
            versionNameSuffix = '-debug'
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    tasks.withType(JavaCompile).configureEach {
        // Android 24-29 compatibility paths still require deprecated framework APIs.
        // Keep every other javac warning fatal while isolating framework deprecations
        // until the compatibility layer is migrated to AndroidX WindowInsets APIs.
        options.compilerArgs += ['-Xlint:all,-deprecation', '-Werror']
    }

    lint {
        abortOnError = true
        checkReleaseBuilds = true
    }
}

dependencies {
    implementation 'androidx.work:work-runtime:2.11.2'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20260719'
}
